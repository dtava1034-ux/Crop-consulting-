/* ---------- Scheduler ---------- */
const calState = (()=>{ const d = new Date(); return { year: d.getFullYear(), month: d.getMonth(), sel: null }; })();
function renderScheduler(){
  const today = todayISO();
  const todos = loadTodos();
  const first = new Date(calState.year, calState.month, 1);
  const daysInMonth = new Date(calState.year, calState.month+1, 0).getDate();
  const prevDays = new Date(calState.year, calState.month, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  const mStart = localISO(first), mEnd = localISO(new Date(calState.year, calState.month, daysInMonth));
  const counts = {}; schedVisits(mStart, mEnd).forEach(v=>{ counts[v.date] = (counts[v.date]||0) + 1; });

  const cells = [];
  for(let i = first.getDay()-1; i >= 0; i--) cells.push(`<div class="cal-cell muted">${prevDays - i}</div>`);
  for(let d = 1; d <= daysInMonth; d++){
    const iso = calState.year + '-' + pad(calState.month+1) + '-' + pad(d);
    const n = counts[iso] || 0;
    const dots = n ? `<div class="cal-dot">${'<i></i>'.repeat(Math.min(n,3))}</div>` : '';
    cells.push(`<button type="button" class="cal-cell${iso===today?' today':''}${iso===calState.sel?' selected':''}" data-date="${iso}" aria-label="${fmtDateDay(iso)}${n ? ', ' + n + ' visit' + (n>1?'s':'') : ''}">${d}${dots}</button>`);
  }
  let trail = 1; while(cells.length % 7) cells.push(`<div class="cal-cell muted">${trail++}</div>`);

  const sel = calState.sel;
  const selVisits = sel ? schedVisits(sel, sel) : [];
  const upcoming = schedVisits(today, addDays(today, 60)).slice(0, 20);
  const series = loadSeries().filter(s => schedState.who === 'all' || (s.assignee || clientTeam(s.clientKey).lead) === schedState.who).sort((a,b)=> a.client.localeCompare(b.client));
  const clients = computeClients();

  return `
    ${schedFilterHTML()}
    <div class="card">
      <div class="month-nav">
        <button type="button" id="prevMonth" aria-label="Previous month">‹</button>
        <div class="section-title" style="margin:0;">${monthLabel}</div>
        <button type="button" id="nextMonth" aria-label="Next month">›</button>
      </div>
      <div class="calendar">
        <div class="cal-head">S</div><div class="cal-head">M</div><div class="cal-head">T</div><div class="cal-head">W</div><div class="cal-head">T</div><div class="cal-head">F</div><div class="cal-head">S</div>
        ${cells.join('')}
      </div>
      ${ sel ? `<div style="margin-top:12px; border-top:1px solid var(--line); padding-top:10px;">
        <div class="row-between"><div class="section-title" style="margin:0;">${fmtDateDay(sel)}</div><button class="btn ghost small" id="addOnDay">+ Add visit this day</button></div>
        ${ selVisits.length ? selVisits.map(v=>visitRow(v, {deletable:true})).join('') : `<div class="empty">Nothing scheduled.</div>` }
      </div>` : `<p class="hint" style="margin:10px 0 0;">Tap a day to see or add visits.</p>` }
    </div>

    <div class="card" id="apptCard">
      <h2>New visit</h2>
      <div class="field-row">
        <div class="field"><label for="apDate">Date</label><input type="date" id="apDate" value="${sel || ''}"></div>
        <div class="field"><label for="apTime">Time</label><input type="time" id="apTime"></div>
      </div>
      <div class="field"><label for="apClient">Client</label><input type="text" id="apClient" list="clientNames" placeholder="e.g. Delgado Farms" autocomplete="off"></div>
      <datalist id="clientNames">${clients.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
      ${ loadTeam().length ? `<div class="field"><label for="apWho">Who goes</label><select id="apWho">${assigneeOptions(schedState.who !== 'all' ? schedState.who : '')}</select></div>` : '' }
      <div class="field-row">
        <div class="field"><label for="apRepeat">Repeat</label><select id="apRepeat"><option value="none">Does not repeat</option>${Object.keys(RULES).map(k=>`<option value="${k}">${RULES[k].label}</option>`).join('')}</select></div>
        <div class="field"><label for="apNote">Note (optional)</label><input type="text" id="apNote" placeholder="e.g. pre-harvest walk"></div>
      </div>
      <button class="btn rust" id="saveAppt">+ Add visit</button>
      <div class="saved-note" id="apMsg" style="color:var(--crit);"></div>
    </div>

    <div class="card">
      <h2 class="section-title">Upcoming visits · next 60 days</h2>
      ${ upcoming.length ? upcoming.map(v=>visitRow(v, {deletable:true})).join('') : `<div class="empty">Nothing scheduled yet.</div>` }
    </div>

    ${ series.length ? `
    <div class="card">
      <h2 class="section-title">Repeating check-ins</h2>
      ${ series.map(s=>{ const nx = nextSeriesDate(s); return `
        <div class="list-row">
          <a class="row-main" href="#client/${encodeURIComponent(s.clientKey)}">
            <div class="title">${esc(s.client)}</div>
            <div class="sub">↻ ${esc(RULES[s.rule] ? RULES[s.rule].label : '')}${s.time ? ' · ' + fmtTime(s.time) : ''}${nx ? ' · next ' + fmtDateShort(nx) : ''}${visitWhoText({ client:s.client, assignee:s.assignee })}</div>
          </a>
          <button class="btn small danger" onclick="stopSeries(${s.id})">Stop</button>
        </div>`; }).join('') }
    </div>` : '' }

    <div class="card" style="margin-bottom:0;">
      <h2 class="section-title">To-do</h2>
      <div class="field-row" style="margin-bottom:8px;">
        <div><input type="text" id="newTodoText" placeholder="Add a to-do…"></div>
        <button class="btn small" id="addTodo" style="flex:0 0 auto;">Add</button>
      </div>
      ${ todos.length ? todos.map(t=>`
        <div class="todo-row">
          <button type="button" class="todo-check${t.done?' done':''}" data-toggle-todo="${t.id}" aria-label="${t.done?'Mark not done':'Mark done'}"></button>
          <button type="button" class="todo-text${t.done?' done':''}" data-toggle-todo="${t.id}">${esc(t.text)}</button>
          <button class="todo-del" data-del-todo="${t.id}" aria-label="Delete">✕</button>
        </div>`).join('') : `<div class="empty">Nothing on your list.</div>` }
    </div>
  `;
}
function stopSeries(id){
  const s = loadSeries().find(x=>x.id===id); if(!s) return;
  if(!confirm('Stop the repeating check-ins for ' + s.client + '?')) return;
  saveSeries(loadSeries().filter(x=>x.id!==id));
  refresh();
}
function wireScheduler(){
  wireSchedFilter();
  document.getElementById('prevMonth').addEventListener('click', ()=>{ calState.month--; if(calState.month<0){ calState.month=11; calState.year--; } calState.sel = null; refresh(); });
  document.getElementById('nextMonth').addEventListener('click', ()=>{ calState.month++; if(calState.month>11){ calState.month=0; calState.year++; } calState.sel = null; refresh(); });
  document.querySelectorAll('.cal-cell[data-date]').forEach(cell=> cell.addEventListener('click', ()=>{
    const d = cell.getAttribute('data-date');
    calState.sel = calState.sel === d ? null : d;
    refresh();
  }));
  const addOnDay = document.getElementById('addOnDay');
  if(addOnDay) addOnDay.addEventListener('click', ()=>{ document.getElementById('apptCard').scrollIntoView({ behavior:'smooth', block:'start' }); document.getElementById('apClient').focus({ preventScroll:true }); });
  document.getElementById('saveAppt').addEventListener('click', ()=>{
    const date = document.getElementById('apDate').value;
    const time = document.getElementById('apTime').value;
    const client = document.getElementById('apClient').value.trim();
    const note = document.getElementById('apNote').value.trim();
    const repeat = document.getElementById('apRepeat').value;
    const whoEl = document.getElementById('apWho'), who = whoEl ? whoEl.value : '';
    const msg = document.getElementById('apMsg');
    if(!date || !client){ msg.textContent = 'Enter at least a date and a client.'; return; }
    if(repeat === 'none'){
      const list = loadAppts(); list.push({ id: Date.now(), date, time, client, note, assignee: who }); saveAppts(list);
    } else {
      const key = clientKeyOf(client);
      const existing = loadSeries().find(s=>s.clientKey===key);
      if(existing && !confirm(client + ' already repeats ' + (RULES[existing.rule] ? RULES[existing.rule].short : '') + '. Replace that schedule with this one?')) return;
      const list = loadSeries().filter(s=>s.clientKey!==key);
      list.push({ id: Date.now(), clientKey: key, client, start: date, rule: repeat, time, note, assignee: who, skips: [] });
      saveSeries(list);
    }
    const d = parseISO(date); calState.year = d.getFullYear(); calState.month = d.getMonth(); calState.sel = date;
    refresh();
  });
  document.querySelectorAll('[data-toggle-todo]').forEach(btn=> btn.addEventListener('click', ()=>{
    const id = parseInt(btn.getAttribute('data-toggle-todo'),10);
    saveTodos(loadTodos().map(t=> t.id===id ? Object.assign({}, t, { done: !t.done }) : t));
    refresh();
  }));
  document.querySelectorAll('[data-del-todo]').forEach(btn=> btn.addEventListener('click', ()=>{
    const id = parseInt(btn.getAttribute('data-del-todo'),10);
    saveTodos(loadTodos().filter(t=>t.id!==id));
    refresh();
  }));
  const input = document.getElementById('newTodoText');
  const add = ()=>{ const text = input.value.trim(); if(!text) return; const l = loadTodos(); l.push({ id: Date.now(), text, done:false }); saveTodos(l); refresh(); };
  document.getElementById('addTodo').addEventListener('click', add);
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') add(); });
}

<script>
/* ================= Contracts & per-acre pricing ================= */
const PRICING = { acre:'Per acre, for the season', flat:'Flat season fee', visit:'Per visit' };
const SCHEDULES = { once:'One bill at the start', monthly:'Monthly payments', split:'Equal payments over the season' };
function contractValue(k){
  if(!k) return 0;
  if(k.pricing === 'acre')  return round2(num(k.acres) * num(k.rate));
  if(k.pricing === 'flat')  return round2(num(k.flatFee));
  if(k.pricing === 'visit') return round2(num(k.perVisit) * num(k.visits));
  return 0;
}
function contractPriceText(k){
  if(k.pricing === 'acre')  return `${num(k.acres).toLocaleString('en-US')} acres × ${money2(num(k.rate))}/acre = ${money(contractValue(k))}`;
  if(k.pricing === 'flat')  return `Flat season fee ${money(contractValue(k))}`;
  if(k.pricing === 'visit') return `${money2(num(k.perVisit))} per visit` + (num(k.visits) ? ` · ${num(k.visits)} visits ≈ ${money(contractValue(k))}` : '');
  return '';
}
function contractStatus(k){
  const t = todayISO();
  if(k.start && t < k.start) return 'upcoming';
  if(k.end && t > k.end) return 'ended';
  return 'active';
}
function contractsFor(key){ return loadContracts().filter(k=>k.clientKey===key).sort((a,b)=> (b.start||'').localeCompare(a.start||'')); }
function currentContract(key){
  const list = contractsFor(key);
  return list.find(k=>contractStatus(k)==='active') || list.find(k=>contractStatus(k)==='upcoming') || null;
}
function contractForDate(key, iso){ return contractsFor(key).find(k => (!k.start || iso >= k.start) && (!k.end || iso <= k.end)) || null; }
function monthsSpan(a, b){ const pa = a.split('-').map(Number), pb = b.split('-').map(Number); return Math.max(1, (pb[0]*12+pb[1]) - (pa[0]*12+pa[1]) + 1); }
function contractInstallments(k){
  if(k.pricing === 'visit') return [];
  const value = contractValue(k); if(!value || !k.start) return [];
  let dates;
  if(k.schedule === 'monthly' && k.end){ const n = monthsSpan(k.start, k.end); dates = Array.from({length:n}, (_,i)=> addMonths(k.start, i)); }
  else if(k.schedule === 'split'){ const n = Math.max(1, parseInt(k.splits,10) || 1); const span = k.end ? daysBetween(k.start, k.end) : 0; dates = Array.from({length:n}, (_,i)=> addDays(k.start, Math.round(span*i/n))); }
  else dates = [k.start];
  const n = dates.length, each = round2(value/n);
  return dates.map((d,i)=>({ n:i+1, of:n, date:d, amount: i===n-1 ? round2(value - each*(n-1)) : each }));
}
function contractLines(k){ const out = []; loadInvoices().forEach(inv=>(inv.lines||[]).forEach(l=>{ if(l.contractId===k.id) out.push({ inv, line:l }); })); return out; }
function unbilledInstallments(k, exceptInvoiceId){
  const taken = new Set(contractLines(k).filter(x=>x.inv.id !== exceptInvoiceId).map(x=>x.line.installment));
  return contractInstallments(k).filter(x=>!taken.has(x.n));
}
function contractReports(k){ const c = clientByKey(k.clientKey); return c ? c.reports.filter(r => r.dateISO && (!k.start || r.dateISO >= k.start) && (!k.end || r.dateISO <= k.end)) : []; }
function contractBilled(k){
  if(k.pricing === 'visit'){
    const onInv = invoiceForReport();
    return round2(sum(contractReports(k), r=>{
      const inv = onInv[r.id];
      if(inv && inv.status !== 'draft'){ const l = inv.lines.find(x=>x.reportId===r.id); return l ? num(l.amount) : 0; }
      return typeof r.amount === 'number' ? r.amount : 0;
    }));
  }
  return round2(sum(contractLines(k).filter(x=>x.inv.status !== 'draft'), x=>num(x.line.amount)));

/* What a visit is worth when billing it: its own amount, else the per-visit contract rate. */
function reportBillAmount(r){
  if(typeof r.amount === 'number') return r.amount;
  const k = r.dateISO ? contractForDate(clientKeyOf(r.farmer), r.dateISO) : null;
  return k && k.pricing === 'visit' && num(k.perVisit) ? num(k.perVisit) : null;
}
function unbilledReports(c, exceptInvoiceId){
  const onInv = invoiceForReport();
  return c.reports.filter(r => { const inv = onInv[r.id]; return !inv || inv.id === exceptInvoiceId; });
}
function readyToBill(){
  const today = todayISO(), out = [];
  computeClients().forEach(c=>{
    const reps = unbilledReports(c).filter(r => r.paymentStatus !== 'paid' && num(reportBillAmount(r)) > 0);
    const inst = [];
    contractsFor(c.key).forEach(k => unbilledInstallments(k).filter(x=>x.date <= today).forEach(x=>inst.push(x)));
    if(!reps.length && !inst.length) return;
    const parts = [];
    if(reps.length) parts.push(reps.length + ' visit' + (reps.length===1?'':'s'));
    if(inst.length) parts.push(inst.length === 1 ? `contract payment ${inst[0].n} of ${inst[0].of}` : `${inst.length} contract payments`);
    out.push({ key:c.key, name:c.name, parts, total: round2(sum(reps, r=>num(reportBillAmount(r))) + sum(inst, x=>x.amount)) });
  });
  return out.sort((a,b)=> b.total - a.total).slice(0, 6);
}
function contractAlerts(){
  const today = todayISO(), out = [];
  computeClients().forEach(c=>{
    const list = contractsFor(c.key); if(!list.length) return;
    const latest = list[0];
    if(!latest.end) return;
    const daysLeft = daysBetween(today, latest.end);
    if(daysLeft < 0 && daysLeft >= -45) out.push({ c: latest, urgent: true, chip: 'Not renewed', text: `${latest.season} season ended ${fmtDateMed(latest.end)}` });
    else if(daysLeft >= 0 && daysLeft <= 30) out.push({ c: latest, urgent: false, chip: 'Renewal', text: `${latest.season} season ends ${fmtDateMed(latest.end)} · ${daysLeft} day${daysLeft===1?'':'s'} left` });
    const promised = num(latest.visits);
    if(contractStatus(latest) === 'active' && promised && latest.start && latest.end){
      const done = contractReports(latest).length;
      const expected = Math.floor(promised * Math.min(1, daysBetween(latest.start, today) / Math.max(1, daysBetween(latest.start, latest.end))));
      if(expected - done >= 2) out.push({ c: latest, urgent: false, chip: 'Behind', text: `${done} of ${promised} visits done — about ${expected} expected by now` });
    }
  });
  return out;
}

function wireContractCard(c){
  const view = document.getElementById('ckView'), form = document.getElementById('ckForm');
  if(!form) return;
  let mode = 'edit';
  const pricing = document.getElementById('ckPricing'), schedule = document.getElementById('ckSchedule');
  const read = ()=>({
    season: document.getElementById('ckSeason').value.trim() || todayISO().slice(0,4),
    pkg: document.getElementById('ckPkg').value.trim(),
    pricing: pricing.value,
    acres: num(document.getElementById('ckAcres').value), rate: num(document.getElementById('ckRate').value),
    flatFee: num(document.getElementById('ckFlat').value), perVisit: num(document.getElementById('ckPerVisit').value),
    visits: num(document.getElementById('ckVisits').value),
    start: document.getElementById('ckStart').value, end: document.getElementById('ckEnd').value,
    schedule: schedule.value, splits: parseInt(document.getElementById('ckSplits').value,10) || 1,
    notes: document.getElementById('ckNotes').value.trim()
  });
  const sync = ()=>{
    form.querySelectorAll('[data-show]').forEach(el => el.hidden = el.getAttribute('data-show') !== pricing.value);
    form.querySelectorAll('[data-hide]').forEach(el => el.hidden = el.getAttribute('data-hide') === pricing.value);
    document.getElementById('ckSplitsWrap').hidden = schedule.value !== 'split';
    const k = read(), v = contractValue(k), inst = contractInstallments(k);
    document.getElementById('ckValue').textContent = k.pricing === 'visit'
      ? (k.perVisit ? `${money2(k.perVisit)} per visit — each report is billed at this rate` : 'Enter the rate per visit')
      : (v ? `Season value ${money(v)}` + (inst.length > 1 ? ` · ${inst.length} payments of about ${money(inst[0].amount)}` : '') : 'Enter the price to see the season value');
  };
  form.addEventListener('input', sync); form.addEventListener('change', sync);
  const open = m => { mode = m; view.hidden = true; form.hidden = false; sync(); form.scrollIntoView({ behavior:'smooth', block:'start' }); };
  const btnNew = document.getElementById('ckNew'); if(btnNew) btnNew.addEventListener('click', ()=> open('new'));
  const btnEdit = document.getElementById('ckEdit'); if(btnEdit) btnEdit.addEventListener('click', ()=> open('edit'));
  const btnRenew = document.getElementById('ckRenew');
  if(btnRenew) btnRenew.addEventListener('click', ()=>{
    const k = c.contract;
    const y = (parseInt(k.season,10) || parseInt(todayISO().slice(0,4),10)) + 1;
    document.getElementById('ckSeason').value = String(y);
    const bump = iso => iso ? String(parseInt(iso.slice(0,4),10)+1) + iso.slice(4) : '';
    document.getElementById('ckStart').value = bump(k.start); document.getElementById('ckEnd').value = bump(k.end);
    open('new');
  });
  const mappedBtn = document.getElementById('ckUseMapped');
  if(mappedBtn) mappedBtn.addEventListener('click', ()=>{ document.getElementById('ckAcres').value = round2(sum(c.fields, f=>polygonAcres(f.points))); sync(); });
  document.getElementById('ckCancel').addEventListener('click', ()=> refresh());
  document.getElementById('ckSave').addEventListener('click', ()=>{
    const k = read();
    if(k.start && k.end && k.end < k.start){ alert('The season end date is before the start date.'); return; }
    if(k.pricing === 'acre' && !(k.acres && k.rate)){ alert('Enter the acres and the rate per acre.'); return; }
    if(k.pricing === 'flat' && !k.flatFee){ alert('Enter the season fee.'); return; }
    if(k.pricing === 'visit' && !k.perVisit){ alert('Enter the rate per visit.'); return; }
    const list = loadContracts();
    if(mode === 'edit' && c.contract){
      const i = list.findIndex(x=>x.id===c.contract.id);
      list[i] = Object.assign({}, list[i], k);
    } else {
      list.push(Object.assign({ id: Date.now(), clientKey: c.key, client: c.name, created: todayISO() }, k));
    }
    saveContracts(list);
    refresh();
  });
  const del = document.getElementById('ckDelete');
  if(del) del.addEventListener('click', ()=>{
    if(contractLines(c.contract).length){ alert('This contract is on an invoice. Delete or edit that invoice first.'); return; }
    if(!confirm('Delete the ' + c.contract.season + ' contract for ' + c.name + '?')) return;
    saveContracts(loadContracts().filter(x=>x.id!==c.contract.id));
    refresh();
  });
}

    <button type="button" class="todo-del" onclick="this.parentNode.remove(); ivRecalc();" aria-label="Remove charge">✕</button>

function gatherInvoiceLines(c, issued){
  const lines = [];
  document.querySelectorAll('[data-rep]').forEach(cb=>{
    if(!cb.checked) return;
    const id = parseInt(cb.getAttribute('data-rep'),10);
    const r = c.reports.find(x=>x.id===id); if(!r) return;
    const amt = round2(num(document.querySelector(`[data-rep-amt="${id}"]`).value));
    const crop = hasText(r.crop) && !String(r.crop).startsWith('(') ? ` (${r.crop})` : '';
    lines.push({ kind:'report', reportId:id, date:r.dateISO || issued, desc:`Field inspection — ${r.field}${crop}`, qty:1, rate:amt, amount:amt });
  });
  const basisShown = {};
  document.querySelectorAll('[data-con]').forEach(cb=>{
    if(!cb.checked) return;
    const kid = parseInt(cb.getAttribute('data-con'),10), n = parseInt(cb.getAttribute('data-inst'),10);
    const k = loadContracts().find(x=>x.id===kid); if(!k) return;
    const x = contractInstallments(k).find(y=>y.n===n);
    const amt = round2(num(document.querySelector(`[data-con-amt="${kid}:${n}"]`).value));
    const basis = k.pricing === 'acre' ? `${num(k.acres).toLocaleString('en-US')} acres × ${money2(num(k.rate))}/acre = ${money2(contractValue(k))} for the season`
                                       : `Season fee ${money2(contractValue(k))}`;
    const line = { kind:'contract', contractId:kid, installment:n, date: x ? x.date : issued,
                   desc:`${k.season} season${k.pkg ? ' (' + k.pkg + ')' : ''}${x && x.of > 1 ? ` — payment ${n} of ${x.of}` : ''}`, qty:1, rate:amt, amount:amt };
    if(!basisShown[kid]){ line.note = basis; basisShown[kid] = true; }
    lines.push(line);
  });
  document.querySelectorAll('.custom-line').forEach(row=>{
    const desc = row.querySelector('.cl-desc').value.trim();
    const qty = num(row.querySelector('.cl-qty').value) || 1, rate = num(row.querySelector('.cl-rate').value);
    if(!desc && !rate) return;
    lines.push({ kind:'custom', date: issued, desc: desc || 'Charge', qty, rate, amount: round2(qty*rate) });
  });
  return lines;
}

function setInvoiceStatus(id, status){

  }
}

async function downloadFullBackup(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k.startsWith('pca_') && !k.startsWith('pca_cloud')) data[k] = localStorage.getItem(k); }
  const pub = data.pca_publish ? JSON.parse(data.pca_publish) : null;
  if(pub){ delete pub.token; data.pca_publish = JSON.stringify(pub); }
  const blob = new Blob([JSON.stringify({ app:'tavares-portal', v:1, exportedAt: new Date().toISOString(), data })], { type:'application/json' });
  const name = 'tavares_full_backup_' + todayISO() + '.json';
  const fileObj = new File([blob], name, { type:'application/json' });
  const msg = document.getElementById('bkMsg');
  try {
    if(navigator.canShare && navigator.canShare({ files:[fileObj] })){ await navigator.share({ files:[fileObj], title: name }); msg.textContent = 'Backup ready — save it to Files or send it to yourself.'; return; }
  } catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  msg.textContent = 'Backup downloaded (' + Math.round(blob.size/1024).toLocaleString('en-US') + ' KB).';
}
function restoreFullBackup(f){
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try {
      const b = JSON.parse(r.result);
      if(b.app !== 'tavares-portal' || !b.data){ alert('That file isn’t a full Portal backup. (Report-only backups restore from the Report tab.)'); return; }
      if(!confirm('Restore this backup from ' + (b.exportedAt ? new Date(b.exportedAt).toLocaleDateString('en-US') : 'an earlier date') + '? It replaces the data on this phone with the backup. Your GitHub token is kept.')) return;
      const token = loadPublish().token;
      Object.keys(b.data).forEach(k=> localStorage.setItem(k, b.data[k]));
      if(token){ const p = loadPublish(); p.token = token; savePublish(p); }
      alert('Restored.'); location.hash = '#dashboard'; refresh();
    } catch(e){ alert('That file could not be read.'); }
  };
  r.readAsText(f);
}

<script>
/* ================= Grower portal =================
   Each grower with the portal turned on gets a private page (grower.html) at a link
   like …/grower.html#<id>.<key>. Their reports, summary, field map, schedule and
   (optionally) invoices are encrypted on this phone with that grower's own key and
   posted to the GitHub repo under g/<id>/. The key is only in the link, never in the
   repo, so the files on GitHub can't be read without the link. */
function loadPublish(){ return Object.assign({ owner:'dtava1034-ux', repo:'Crop-consulting-', branch:'main', token:'' }, readJSON('pca_publish', {})); }
function savePublish(o){ try { localStorage.setItem('pca_publish', JSON.stringify(o)); } catch(e){} }
function publishConfigured(){ return !!loadPublish().token; }
function portalLink(p){ return new URL('grower.html', location.href.split('#')[0]).href + '#' + p.gid + '.' + p.key; }

// --- crypto helpers (AES-GCM, key lives only in the grower's link) ---
function b64url(bytes){ let s = ''; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64url(str){ str = str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length % 4) str += '='; const bin = atob(str); const out = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i); return out; }
function bytesToB64(bytes){ let s = ''; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(s); }
function randomId(n){ return b64url(crypto.getRandomValues(new Uint8Array(n))); }
async function aesKey(keyStr){ return crypto.subtle.importKey('raw', unb64url(keyStr), 'AES-GCM', false, ['encrypt','decrypt']); }
async function encryptJSON(obj, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv, 0); out.set(ct, 12); return out;
}
function hashStr(str){ let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for(let i=0;i<str.length;i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909); h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909); return (4294967296 * (2097151 & h2) + (h1>>>0)).toString(36); }

// --- GitHub API ---
async function gh(path, opts){
  opts = opts || {};
  const cfg = loadPublish();
  const res = await fetch('https://api.github.com/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) + path, {
    method: opts.method || 'GET', cache: 'no-store',
    headers: Object.assign({ 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.body ? { 'Content-Type': 'application/json' } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(!res.ok){ const t = await res.text().catch(()=> ''); const e = new Error(res.status + ' ' + t.slice(0, 160)); e.status = res.status; throw e; }
  return res.status === 204 ? null : res.json();
}
function friendlyGitHubError(e){
  const s = e && e.status;
  if(s === 401) return 'GitHub didn’t accept the token. Check it was copied fully, or make a new one.';
  if(s === 403) return 'The token doesn’t have permission. Give it "Contents: Read and write" on this repository.';
  if(s === 404) return 'Couldn’t find that repository or branch. Check the username, repository and branch names.';
  if(s === 409 || s === 422) return 'GitHub was busy with another update. Try again in a moment.';
  if(!navigator.onLine) return 'No internet right now — it will update once you have signal.';
  return 'Couldn’t reach GitHub (' + (e && e.message ? e.message.slice(0, 80) : 'unknown error') + ').';
}
async function testPublishing(){ const cfg = loadPublish(); await gh('/git/ref/heads/' + encodeURIComponent(cfg.branch)); }
async function commitFiles(changes, message){
  const cfg = loadPublish();
  const ref = await gh('/git/ref/heads/' + encodeURIComponent(cfg.branch));
  const base = ref.object.sha;
  const commit = await gh('/git/commits/' + base);
  const tree = [];
  for(const ch of changes){
    if(ch.del){ tree.push({ path: ch.path, mode:'100644', type:'blob', sha: null }); continue; }
    const blob = await gh('/git/blobs', { method:'POST', body:{ content: bytesToB64(ch.bytes), encoding:'base64' } });
    tree.push({ path: ch.path, mode:'100644', type:'blob', sha: blob.sha });
  }
  const newTree = await gh('/git/trees', { method:'POST', body:{ base_tree: commit.tree.sha, tree } });
  const newCommit = await gh('/git/commits', { method:'POST', body:{ message, tree: newTree.sha, parents:[base] } });
  await gh('/git/refs/heads/' + encodeURIComponent(cfg.branch), { method:'PATCH', body:{ sha: newCommit.sha } });
}
async function listRemoteFolder(prefix){
  const cfg = loadPublish();
  const ref = await gh('/git/ref/heads/' + encodeURIComponent(cfg.branch));
  const commit = await gh('/git/commits/' + ref.object.sha);
  const t = await gh('/git/trees/' + commit.tree.sha + '?recursive=1');
  return (t.tree||[]).filter(x=>x.type === 'blob' && x.path.startsWith(prefix)).map(x=>x.path);
}

function portalFiles(c, p){
  const base = 'g/' + p.gid + '/';
  const logo = document.getElementById('brandLogo').src;

  const reports = sortByDateDesc(c.reports);
  reports.forEach(r=>{

  });
  const today = todayISO();
  const years = [...new Set(reports.map(r=>(r.dateISO||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const summaries = {};
  years.forEach(y => { summaries[y] = growerSummaryDoc(c, y, { billing: !!p.showBilling }).split(logo).join('{{LOGO}}'); });
  let billing = null;

    const invs = loadInvoices().filter(i=>i.clientKey===c.key && i.status !== 'draft').sort((a,b)=> (b.issued||'').localeCompare(a.issued||''));
    const items = ledgerFor(c.key).filter(x=> !x.paid || daysBetween(x.dateISO || today, today) <= 400);
    billing = {
      balance: round2(sum(items.filter(x=>!x.paid), x=>x.amount)),
      invoices: invs.slice(0, 24).map(i=>({ id:i.id, number:i.number, issued:i.issued, due:i.due, total:invoiceTotal(i), status:i.status, overdue: invoiceOverdue(i),
                                            html: renderInvoiceDoc(i).split(logo).join('{{LOGO}}') })),
      visits: items.filter(x=>x.kind === 'report').map(x=>({ date:x.dateISO, field:x.r.field, amount:x.amount, paid:x.paid }))
    };
  }
  const pca = loadPCA(), biz = loadBusiness();
  const index = {
    client: { name:c.name, crop:c.crop, county:c.county },
    pca: { name:pca.name, num:pca.num, phone:pca.phone, email:pca.email, business: biz.name },
    reports: reports.map(r=>({ id:r.id, dateISO:r.dateISO||'', date:r.date||'', field:r.field, crop:r.crop, summary:r.summary||'',
                               issues:(r.issues||[]).map(i=>({ category:i.category, severity:i.severity, problem: hasText(i.problem) ? i.problem : '', pin: i.pin || null })) })),
    fields: c.fields.map(f=>({ field:f.field, points:f.points, acres: round2(polygonAcres(f.points)) })),
    visits: visitsBetween(today, addDays(today, 120)).filter(v=>clientKeyOf(v.client)===c.key).slice(0, 12).map(v=>({ date:v.date, time:v.time, note:v.note })),
    summaries, billing
  };
  const sig = hashStr(JSON.stringify(index));
  files[base + 'index.bin'] = { sig, data: Object.assign({ v:1, updated: new Date().toISOString() }, index) };
  return files;
}
function portalPending(c){
  if(!c.portal || !c.portal.enabled) return 0;
  const files = portalFiles(c, c.portal), prev = c.portal.published || {};
  let n = 0;
  Object.keys(files).forEach(p=>{ if(prev[p] !== files[p].sig) n++; });
  Object.keys(prev).forEach(p=>{ if(!files[p]) n++; });
  return n;
}

// --- publishing ---
let _publishing = null;
function publishPortals(opts){
  opts = opts || {};
  if(_publishing) return _publishing;
  _publishing = (async ()=>{
    const pub = loadPublish();
    if(!pub.token) throw Object.assign(new Error('Publishing is not set up'), { status: 0 });
    const changes = [], newState = {};
    // growers whose portal was turned off or whose link was reset: remove their old files
    for(const gid of (pub.pendingDeletes || [])){
      const paths = await listRemoteFolder('g/' + gid + '/');
      paths.forEach(path => changes.push({ path, del:true }));
    }
    const all = loadClientSettings();
    for(const c of computeClients()){
      const p = all[c.key] && all[c.key].portal;
      if(!p || !p.enabled) continue;
      if(opts.keys && !opts.keys.includes(c.key)) continue;
      const key = await aesKey(p.key);
      const files = portalFiles(c, p), prev = p.published || {};
      for(const path of Object.keys(files)){
        if(!opts.force && prev[path] === files[path].sig) continue;
        if(opts.force && path.indexOf('/r-') > 0 && prev[path] === files[path].sig) continue;
        changes.push({ path, bytes: await encryptJSON(files[path].data, key) });
      }
      Object.keys(prev).forEach(path => { if(!files[path]) changes.push({ path, del:true }); });
      newState[c.key] = Object.fromEntries(Object.keys(files).map(k=>[k, files[k].sig]));
    }
    if(changes.length){
      try { await commitFiles(changes, 'Update grower portals'); }
      catch(e){
        if(e.status === 409 || e.status === 422){ await new Promise(r=>setTimeout(r, 1500)); await commitFiles(changes, 'Update grower portals'); }
        else throw e;
      }
    }
    const all2 = loadClientSettings();
    Object.keys(newState).forEach(k=>{ if(all2[k] && all2[k].portal){ all2[k].portal.published = newState[k]; all2[k].portal.lastPublished = Date.now(); } });
    saveClientSettings(all2);
    const pub2 = loadPublish(); pub2.pendingDeletes = []; pub2.lastPublished = Date.now(); delete pub2.lastError; savePublish(pub2);
    return { changed: changes.length };
  })();
  _publishing.catch(e=>{ const p = loadPublish(); p.lastError = friendlyGitHubError(e); savePublish(p); }).finally(()=>{ _publishing = null; });
  return _publishing;
}
let _pubTimer = null, _lastAuto = 0;
function schedulePublish(){
  clearTimeout(_pubTimer);
  _pubTimer = setTimeout(()=>{
    if(!navigator.onLine || !publishConfigured()) return;
    const pub = loadPublish();
    const anyOn = Object.values(loadClientSettings()).some(s => s.portal && s.portal.enabled);
    if(!anyOn && !(pub.pendingDeletes||[]).length) return;
    if(Date.now() - _lastAuto < 30000) return;
    _lastAuto = Date.now();
    publishPortals().then(r=>{ if(r.changed){ toast('Grower portals updated'); const s = document.getElementById('portalStatus'); if(s) refresh(); } }).catch(()=>{});
  }, 2500);
}
window.addEventListener('online', ()=>{ _lastAuto = 0; schedulePublish(); });

function wirePortalCard(c){
  const on = document.getElementById('ptOn');

  });
  const retire = ()=>{
    const p = clientSettings(c.key).portal;
    const pub = loadPublish(); pub.pendingDeletes = (pub.pendingDeletes||[]).concat([p.gid]); savePublish(pub);
    return p;
  };
  document.getElementById('ptReset').addEventListener('click', ()=>{
    if(!confirm('Make a new link for ' + c.name + '? The old link stops working, so you’ll need to send them the new one.')) return;
    const p = retire();
    updateClientSettings(c.key, { portal: Object.assign({}, p, { gid: randomId(12), key: randomId(32), published:{}, lastPublished:null }) });
    refresh(); schedulePublish(); _lastAuto = 0;
  });
  document.getElementById('ptOff').addEventListener('click', ()=>{
    if(!confirm('Turn off the grower portal for ' + c.name + '? Their link stops working and their files are removed from your site. You can turn it back on anytime (with a new link).')) return;
    retire();
    updateClientSettings(c.key, { portal: { enabled:false } });
    _lastAuto = 0; refresh();
  });
}

<script>

     pca_client_settings[key].team   { lead: id, scouts: [id] }   (no entry = you lead, nobody scouts)

function clientTeam(key){

function periodRange(p){
  const today = todayISO();
  if(p === 'month') return [addDays(today, -29), today];

function inPeriod(iso, period){ const r = periodRange(period); return !r || (!!iso && iso >= r[0] && iso <= r[1]); }
function memberStats(id, period){
  const reps = loadReports().filter(r => reportPerformer(r) === id && inPeriod(r.dateISO, period));
  const mine = clientsOf(id);
  const leadKeys = new Set(mine.lead.map(c => c.key));
  let findings = 0, serious = 0, scoutVisits = 0;
  reps.forEach(r => {

    if(!leadKeys.has(clientKeyOf(r.farmer))) scoutVisits++;

  const led = getLedger().filter(x => leadKeys.has(x.clientKey) && inPeriod(x.dateISO, period));
  const acres = sum(mine.lead.concat(mine.scout), c => sum(c.fields, f => polygonAcres(f.points)));
  return { reps, visits: reps.length, scoutVisits, findings, serious, leadCount: mine.lead.length, scoutCount: mine.scout.length,

      ${active.map(row).join('')}
      ${ active.length === 1 ? `<div class="empty">You're the only one on the team so far. Add an employee to give them a profile, assign clients, and see their schedule and stats here.</div>` : '' }
    </div>
    ${ inactive.length ? `<div class="card"><h2 class="section-title">Inactive</h2>${inactive.map(row).join('')}</div>` : '' }
    <p class="hint" style="text-align:center;">Billed = what's been billed on clients each person leads. Visits = reports they logged.</p>`;
}
function empFormFields(m){
  return `
    <div class="field"><label for="emName">Name</label><input type="text" id="emName" value="${esc(m.name||'')}" placeholder="e.g. Maria Lopez" autocomplete="off"></div>
    <div class="field-row">
      <div class="field"><label for="emTitle">Role / title</label><input type="text" id="emTitle" value="${esc(m.title==null?'Field scout':m.title)}" placeholder="e.g. Field scout"></div>
      <div class="field"><label for="emStart">Start date</label><input type="date" id="emStart" value="${esc(m.start||'')}"></div>
    </div>
    <div class="field-row">

    <div class="field"><label for="emNotes">Notes</label><textarea id="emNotes" style="min-height:60px;" placeholder="Territory, licenses, availability…">${esc(m.notes||'')}</textarea></div>`;
}
function readEmpForm(){
  const v = id => document.getElementById(id).value.trim();
  return { name: v('emName'), title: v('emTitle'), start: v('emStart'), phone: v('emPhone'), email: v('emEmail'), notes: v('emNotes') };
}
function wireTeam(){
  wirePeriod();
  const form = document.getElementById('addEmpForm');
  document.getElementById('toggleAddEmp').addEventListener('click', () => { form.hidden = !form.hidden; if(!form.hidden) document.getElementById('emName').focus(); });
  document.getElementById('saveNewEmp').addEventListener('click', () => {
    const f = readEmpForm();
    if(!f.name){ document.getElementById('emName').focus(); return; }
    const list = loadTeam().slice();
    const id = 'e' + Date.now().toString(36);
    list.push(Object.assign({ id, status:'active', color: TEAM_COLORS[list.length % TEAM_COLORS.length], created: Date.now() }, f));
    if(saveTeam(list)) location.hash = '#employee/' + id;
  });
}

/* ---------- One person's profile (owner's view) ---------- */
function clientLineHTML(c, role, removable){
  const next = c.series ? nextSeriesDate(c.series) : null;
  return `<div class="list-row">
    <a class="row-main" href="${clientHref(c.key)}"><div class="title">${esc(c.name)}${role === 'scout' ? ' <span class="chip soft">Scouting</span>' : ''}</div>
      <div class="sub">${esc(c.crop||'—')}${c.county ? ' · ' + esc(c.county) : ''} · last visit ${c.lastVisitISO ? fmtDateShort(c.lastVisitISO) : '—'}${next ? ' · next ' + fmtDateShort(next) : ''}</div></a>
    ${ removable ? `<button class="todo-del" data-unassign="${esc(c.key)}" data-role="${role}" aria-label="Unassign ${esc(c.name)}">✕</button>` : '' }
  </div>`;
}
function renderEmployee(id){
  const m = memberById(id);
  if(!m || (id !== OWNER_ID && !loadTeam().some(x => x.id === id))) return `<a class="back-link" href="#team">← Team</a><div class="card"><div class="empty">Team member not found.</div></div>`;
  const today = todayISO(), period = teamState.period;
  const s = memberStats(id, period), mine = clientsOf(id);
  const visits = memberVisits(id, today, addDays(today, 14));
  const due = memberCheckinsDue(id);
  const recent = sortByDateDesc(loadReports().filter(r => reportPerformer(r) === id)).slice(0, 8);
  const months = monthlyVisits(id, 6), maxM = Math.max(1, ...months.map(x => x.count));
  const hasHistory = loadReports().some(r => reportPerformer(r) === id);
  const tel = m.phone ? `<a class="btn small ghost" href="${telHref(m.phone)}">Call</a><a class="btn small ghost" href="${smsHref(m.phone)}">Text</a>` : '';
  const mail = m.email ? `<a class="btn small ghost" href="${mailHref(m.email, '', '')}">Email</a>` : '';
  const others = computeClients().filter(c => { const t = clientTeam(c.key); return t.lead !== id && !t.scouts.includes(id); });
  const inactive = m.status === 'inactive';

  return `
    <a class="back-link" href="#team">← Team</a>
    <div class="card">
      <div style="display:flex; gap:14px; align-items:center;">
        ${avatarHTML(m, 'lg')}
        <div style="min-width:0;">
          <h2 style="font-size:20px; margin-bottom:2px;">${esc(m.name)}</h2>
          <div style="color:var(--ink-soft); font-size:12.5px;">${esc(m.title||'')}${m.start ? (m.title ? ' · ' : '') + 'Since ' + fmtDateMed(m.start) : ''}</div>
          <div style="margin-top:4px;">${m.isOwner ? '<span class="chip soft">Owner</span>' : inactive ? '<span class="chip soft">Inactive</span>' : '<span class="chip paid">Active</span>'}</div>
        </div>
      </div>
      ${ (tel || mail) ? `<div class="actions-row" style="margin-top:12px;">${tel}${mail}</div>` : '' }
      ${ m.phone || m.email ? `<div class="hint" style="margin:8px 0 0;">${esc([m.phone, m.email].filter(Boolean).join(' · '))}</div>` : '' }
      ${ (!m.isOwner && cloudOn() && cloudAuth()) ? (cloud.members[m.id] ? `<div style="margin-top:6px;"><span class="chip paid">Signed in ✓</span></div>` : `<div class="hint" style="margin:8px 0 0;">${m.email ? 'Hasn’t signed in yet. Send them the invite link — they create an account with <b>' + esc(m.email) + '</b>.' : 'Add their email above so they can sign in.'}</div><div class="actions-row" style="margin-top:6px;"><button class="btn small ghost" id="emInvite">Copy invite link</button></div>`) : '' }
      ${ m.notes ? `<div class="doc-note" style="margin-top:8px; font-size:13px; white-space:pre-wrap;">${esc(m.notes)}</div>` : '' }
      ${ m.isOwner ? `<p class="hint" style="margin:10px 0 0;">Your name, phone and email come from "Your details" on the Report tab.</p>` : `
      <div class="actions-row" style="margin-top:12px;">
        <button class="btn small ghost" id="emEditBtn">Edit profile</button>
        <button class="btn small ghost" id="emStatusBtn">${inactive ? 'Reactivate' : 'Deactivate'}</button>
        ${ hasHistory ? '' : `<button class="btn small danger" id="emDeleteBtn">Delete</button>` }
      </div>
      <div id="emEditForm" hidden style="margin-top:12px;">${empFormFields(m)}<div class="actions-row"><button class="btn small" id="emSave">Save changes</button><button class="btn small ghost" id="emCancel">Cancel</button></div></div>` }
    </div>

    <div class="row-between" style="margin:0 2px 8px;"><h2 class="section-title" style="margin:0;">Stats</h2>${periodSelectHTML()}</div>
    <div class="stat-grid">
      ${tile(s.visits, 'Visits logged', s.scoutVisits ? s.scoutVisits + ' scouting' : '')}
      ${tile(money(s.billed), 'Billed', 'on clients they lead')}
      ${tile(s.leadCount + s.scoutCount, 'Clients', s.leadCount + ' lead · ' + s.scoutCount + ' scouting')}
      ${tile(s.findings, 'Findings logged', s.serious ? s.serious + ' severe or critical' : '', s.serious ? 'warn' : '')}
      ${tile(s.acres ? Math.round(s.acres).toLocaleString('en-US') : '—', 'Acres', 'across their clients')}
      ${tile(money(s.outstanding), 'Outstanding', 'on clients they lead', s.outstanding > 0 ? 'warn' : '')}
    </div>
    <div class="card">
      <h2 class="section-title">Visits by month</h2>
      ${months.map(x => `<div class="barchart-row"><div class="blabel">${fmtMonthLabel(x.ym)}</div><div class="btrack"><div class="bfill" style="width:${x.count ? Math.max(3, Math.round(x.count/maxM*100)) : 0}%; background:var(--accent);"></div></div><div class="bval">${x.count}</div></div>`).join('')}
    </div>

    <div class="card">
      <h2>Clients</h2>
      ${ mine.lead.length ? `<div class="section-title" style="margin:6px 0 0;">${m.isOwner ? 'Your clients' : 'Leads'}</div>` + mine.lead.map(c => clientLineHTML(c, 'lead', !m.isOwner)).join('') : '' }
      ${ mine.scout.length ? `<div class="section-title" style="margin:12px 0 0;">Scouting (client stays with the lead)</div>` + mine.scout.map(c => clientLineHTML(c, 'scout', true)).join('') : '' }
      ${ !mine.lead.length && !mine.scout.length ? `<div class="empty">No clients assigned yet.</div>` : '' }
      ${ m.isOwner ? `<p class="hint" style="margin:10px 0 0;">Assign clients to employees from their profile, or from a client's page.</p>` : (inactive ? '' : `
      <div style="border-top:1px solid var(--line); margin-top:12px; padding-top:12px;">
        <div class="field"><label for="asClient">Assign a client</label>
          <select id="asClient"><option value="">Choose a client…</option>${others.map(c => { const t = clientTeam(c.key); return `<option value="${esc(c.key)}">${esc(c.name)}${t.lead !== OWNER_ID ? ' — lead: ' + esc(firstName(memberName(t.lead))) : ''}</option>`; }).join('')}</select></div>
        <div class="field"><label for="asRole">As</label>
          <select id="asRole"><option value="scout">Scout — client stays mine, they scout the fields</option><option value="lead">Lead — they run the client</option></select></div>
        <button class="btn small" id="asGo">Assign</button>
      </div>`) }
    </div>

    <div class="card">
      <div class="row-between" style="margin-bottom:6px;"><h2 style="margin:0;">Schedule</h2><button class="btn small ghost" id="fullSched">Full schedule</button></div>
      ${ due.length ? due.map(x => `<div class="list-row"><a class="row-main" href="${clientHref(x.series.clientKey)}"><div class="title">${esc(x.series.client)}</div><div class="sub">Check-in due ${fmtDateShort(x.due)}</div></a><span class="chip overdue">${x.late}d late</span></div>`).join('') : '' }
      <div class="section-title" style="margin:${due.length ? 12 : 4}px 0 0;">Next 14 days</div>
      ${ visits.length ? visits.map(v => visitRow(v, { deletable: true })).join('') : `<div class="empty">Nothing scheduled.</div>` }
    </div>

    <div class="card" style="margin-bottom:0;">
      <h2>Recent reports</h2>
      ${ recent.length ? recent.map(r => `<div class="list-row"><a class="row-main" href="${openReportHref(r.id)}"><div class="title">${esc(r.farmer)} · ${esc(r.field)}</div><div class="sub">${esc(reportDateLabel(r))}${(r.issues||[]).length ? ' · ' + r.issues.length + ' issue' + (r.issues.length===1?'':'s') : ' · no issues'}${clientTeam(clientKeyOf(r.farmer)).lead !== id ? ' · scouting' : ''}</div></a></div>`).join('') : `<div class="empty">No reports logged by ${esc(firstName(m.name))} yet. When you log a visit, choose "Visit done by" on the Report tab.</div>` }
    </div>`;
}
/* Take someone off their clients and upcoming visits (used when deactivating or deleting). */
function releaseMember(id){
  const all = loadClientSettings();
  Object.keys(all).forEach(k => { const t = all[k] && all[k].team; if(!t) return; if(t.lead === id) t.lead = OWNER_ID; if((t.scouts||[]).includes(id)) t.scouts = t.scouts.filter(x => x !== id); });
  saveClientSettings(all);
  saveAppts(loadAppts().map(a => a.assignee === id ? Object.assign({}, a, { assignee: '' }) : a));
  saveSeries(loadSeries().map(s => s.assignee === id ? Object.assign({}, s, { assignee: '' }) : s));
}
function wireEmployee(id){
  wirePeriod();
  const m = memberById(id); if(!m) return;
  const fs = document.getElementById('fullSched');
  if(fs) fs.addEventListener('click', () => { schedState.who = id; location.hash = '#scheduler'; });
  document.querySelectorAll('[data-unassign]').forEach(b => b.addEventListener('click', () => {
    const key = b.getAttribute('data-unassign'), role = b.getAttribute('data-role'), t = clientTeam(key), c = clientByKey(key);
    if(!confirm(role === 'lead' ? `Take ${c.name} back as your own client?` : `Stop ${firstName(m.name)} scouting for ${c.name}?`)) return;
    if(role === 'lead') setClientTeam(key, OWNER_ID, t.scouts); else setClientTeam(key, t.lead, t.scouts.filter(x => x !== id));
    toast('Updated'); refresh();
  }));
  const go = document.getElementById('asGo');
  if(go) go.addEventListener('click', () => {
    const key = document.getElementById('asClient').value, role = document.getElementById('asRole').value;
    if(!key){ document.getElementById('asClient').focus(); return; }
    const t = clientTeam(key), c = clientByKey(key);
    if(role === 'lead'){
      if(t.lead !== OWNER_ID && t.lead !== id && !confirm(`${c.name} is currently led by ${memberName(t.lead)}. Make ${firstName(m.name)} the lead instead?`)) return;
      setClientTeam(key, id, t.scouts);
    } else {
      setClientTeam(key, t.lead, t.scouts.concat([id]));
    }
    toast(c.name + ' assigned to ' + firstName(m.name)); refresh();
  });
  if(m.isOwner) return;
  const inv = document.getElementById('emInvite');
  if(inv) inv.addEventListener('click', async () => { const link = cloudInviteLink(); try { await navigator.clipboard.writeText(link); toast('Invite link copied'); } catch(e){ prompt('Copy this link and send it to your employee:', link); } });
  const edit = document.getElementById('emEditForm');
  document.getElementById('emEditBtn').addEventListener('click', () => { edit.hidden = !edit.hidden; });
  document.getElementById('emCancel').addEventListener('click', () => { edit.hidden = true; });
  document.getElementById('emSave').addEventListener('click', () => {
    const f = readEmpForm(); if(!f.name){ document.getElementById('emName').focus(); return; }
    const list = loadTeam().map(x => x.id === id ? Object.assign({}, x, f) : x);
    if(saveTeam(list)){ toast('Saved'); refresh(); }
  });
  document.getElementById('emStatusBtn').addEventListener('click', () => {
    if(m.status !== 'inactive'){
      const mine = clientsOf(id);
      if(!confirm(`Deactivate ${m.name}?\n\n• ${mine.lead.length} client${mine.lead.length===1?'':'s'} they lead go back to you\n• Scouting assignments and their upcoming visits are cleared\n• Reports they logged stay in your history`)) return;
      releaseMember(id);
    }
    saveTeam(loadTeam().map(x => x.id === id ? Object.assign({}, x, { status: m.status === 'inactive' ? 'active' : 'inactive' }) : x));
    refresh();
  });
  const del = document.getElementById('emDeleteBtn');
  if(del) del.addEventListener('click', () => {
    if(!confirm(`Delete ${m.name}'s profile? This can't be undone.`)) return;
    releaseMember(id);
    saveTeam(loadTeam().filter(x => x.id !== id));
    location.hash = '#team';
  });
}

/* ---------- Client page: who's on this client ---------- */
function renderClientTeamCard(c){
  if(isEmployee()) return '';
  const emps = employees(false), t = clientTeam(c.key);
  if(!emps.length && t.lead === OWNER_ID && !t.scouts.length) return '';
  const leadOpts = [ownerMember()].concat(emps);
  if(t.lead !== OWNER_ID && !leadOpts.some(m => m.id === t.lead)) leadOpts.push(memberById(t.lead));
  const scoutOpts = emps.filter(m => m.id !== t.lead);
  return `
    <div class="card">
      <h2>Team</h2>
      <p class="hint">The lead runs this client. Scouts check the fields for the lead, and the client stays theirs.</p>
      <div class="field"><label for="ctLead">Lead</label><select id="ctLead">${leadOpts.map(m => `<option value="${esc(m.id)}" ${t.lead===m.id?'selected':''}>${esc(m.isOwner ? 'Me (' + m.name + ')' : m.name)}</option>`).join('')}</select></div>
      ${ scoutOpts.length ? `<label>Scouts</label><div style="display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:4px;">${scoutOpts.map(m => `<label class="check"><input type="checkbox" data-scout="${esc(m.id)}" ${t.scouts.includes(m.id)?'checked':''}> ${esc(m.name)}</label>`).join('')}</div>` : '' }
