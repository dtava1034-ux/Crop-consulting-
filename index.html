<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #EDEEE3; --surface: #FFFFFF; --ink: #232620; --ink-soft: #5B6055;
  --accent: #4B6043; --accent-deep: #33442D; --rust: #B5652D; --line: #CCCFBE;
  --on-accent: #FFFFFF;
  --good: #4B6043; --low: #7E8A3E; --mod: #C79A2E; --sev: #C4622A; --crit: #A8342A;
  --pest:#C4622A; --weed:#2A8FB5; --nutrient:#4F8A3D; --irrigation:#D9A426; --vertebrate:#A6488A; --concern:#9B9C8E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1D18; --surface: #24261F; --ink: #EDEEE3; --ink-soft: #A9AD9D;
    --accent: #8FB27C; --accent-deep: #B7D6A6; --rust: #D98A52; --line: #3A3D32;
    --on-accent: #14170F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1D18; --surface: #24261F; --ink: #EDEEE3; --ink-soft: #A9AD9D;
  --accent: #8FB27C; --accent-deep: #B7D6A6; --rust: #D98A52; --line: #3A3D32;
  --on-accent: #14170F; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px));
}
h1,h2,h3 { font-family: 'Source Serif 4', Georgia, serif; color: var(--accent-deep); margin: 0; text-wrap: balance; }
a { color: var(--rust); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
}
header.top .top-text h1 { font-size: 22px; }
header.top .top-text p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-soft); }
header.top .top-text a.crosslink { font-size: 12.5px; font-weight: 600; color: var(--rust); text-decoration: none; }
.logo-chip { flex-shrink: 0; }
.logo-chip img { width: 84px; height: auto; display: block; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 16px;
}
.card h2 { font-size: 16px; margin-bottom: 10px; }
.card.alert { border-color: var(--crit); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.stat-tile .num { font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; color: var(--accent-deep); font-variant-numeric: tabular-nums; }
.stat-tile .lbl { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; text-transform: uppercase; letter-spacing: .03em; }
.stat-tile .sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
.stat-tile.warn .num { color: var(--rust); }
.stat-tile.alert { border-color: var(--crit); }
.stat-tile.alert .num, .stat-tile.alert .sub { color: var(--crit); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat-tile.alert .num, :root:not([data-theme="light"]) .stat-tile.alert .sub { color: #F08A7E; } }
:root[data-theme="dark"] .stat-tile.alert .num, :root[data-theme="dark"] .stat-tile.alert .sub { color: #F08A7E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { color: #F08A7E; } }
:root[data-theme="dark"] .btn.danger { color: #F08A7E; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: var(--on-accent);
  border: none; font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 10px 16px;
  border-radius: 20px; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn.rust { background: var(--rust); }
.btn.ghost { background: transparent; color: var(--accent-deep); border: 1px solid var(--line); }
.btn.small { padding: 7px 12px; font-size: 12.5px; }
.btn.danger { background: transparent; color: var(--crit); border: 1px solid var(--line); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.actions-row { display: flex; flex-wrap: wrap; gap: 8px; }
input[type=text], input[type=search], input[type=number], input[type=date], input[type=time], input[type=tel], input[type=email], input[type=password], textarea, select {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
  font-family: inherit; font-size: 16px; background: var(--bg); color: var(--ink);
  -webkit-appearance: none; appearance: none; min-height: 40px;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }
label.check { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: 12.5px; cursor: pointer; }
label.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.field { margin-bottom: 12px; }
.field-row { display: flex; gap: 10px; }
.field-row > div { flex: 1; min-width: 0; }
.hint { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 12px; }
.list-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
}
.list-row:last-child { border-bottom: none; }
.list-row .row-main { flex: 1; min-width: 0; text-decoration: none; color: inherit; }
.list-row .title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.list-row .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.list-row .right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.list-row .right.inline { flex-direction: row; align-items: center; }
.list-row .amt { font-weight: 700; color: var(--accent-deep); font-variant-numeric: tabular-nums; }
.edit-icon { flex-shrink: 0; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 50%; color: var(--accent-deep); text-decoration: none; font-size: 15px; }
.result-count { font-size: 12px; color: var(--ink-soft); padding: 8px 0 2px; }
.empty { color: var(--ink-soft); font-size: 13.5px; padding: 10px 0; }
.chip { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; color: var(--on-accent); white-space: nowrap; line-height: 1.5; }
.chip.paid { background: var(--accent); }
.chip.pending { background: var(--rust); }
.chip.overdue { background: var(--crit); color: #fff; }
.chip.soft { background: var(--bg); color: var(--ink-soft); border: 1px solid var(--line); }
.chip-btn { border: none; cursor: pointer; font-family: inherit; }
.section-title { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; color: var(--accent-deep); margin: 0 0 10px; }
.search-row { display: flex; gap: 8px; margin-bottom: 4px; }
.search-row input { flex: 1.6; }
.search-row select { flex: 1; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.seg a { flex: 1; text-align: center; padding: 8px 0; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-soft); text-decoration: none; }
.seg a.on { background: var(--accent); color: var(--on-accent); }
.saved-note { font-size: 11.5px; color: var(--ink-soft); min-height: 16px; margin-top: 4px; }
.repeat-box { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.repeat-box .big { font-weight: 700; font-size: 14.5px; }
.repeat-box .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

/* Bottom tab bar: a fixed light sage with near-black labels, the same in
   light and dark phone modes so the labels always stay readable. */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; height: calc(64px + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: #B9CFA9; border-top: 1px solid #93AD80; display: flex; z-index: 1000;
}
.tabitem {
  position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: #2A3124; text-decoration: none; font-size: 10px; font-weight: 600; background: none; border: none;
  cursor: pointer; padding: 0 2px; font-family: inherit;
}
.tabitem svg { width: 20px; height: 20px; }
.tabitem.active { color: #0A0C08; font-weight: 800; }
.tabitem.active::before { content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: #0A0C08; }

.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px; }
.cal-head { font-size: 9.5px; font-weight: 700; text-transform: uppercase; color: var(--ink-soft); text-align: center; padding-bottom: 4px; }
.cal-cell {
  aspect-ratio: 1; border-radius: 8px; padding: 4px 5px; font-size: 12px; color: var(--ink);
  background: var(--bg); position: relative; border: none; font-family: inherit; text-align: left; cursor: pointer;
}
.cal-cell.muted { color: var(--line); background: transparent; cursor: default; }
.cal-cell.today { background: var(--accent-deep); color: var(--on-accent); font-weight: 700; }
.cal-cell.selected { outline: 2px solid var(--rust); outline-offset: -2px; }
.cal-dot { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.cal-dot i { width: 5px; height: 5px; border-radius: 50%; background: var(--rust); display: block; }
.cal-cell.today .cal-dot i { background: var(--on-accent); }
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-nav button { background: none; border: none; color: var(--accent-deep); font-size: 22px; cursor: pointer; padding: 2px 12px; }
.todo-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.todo-row:last-child { border-bottom: none; }
.todo-check { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line); flex-shrink: 0; background: var(--surface); padding: 0; cursor: pointer; }
.todo-check.done { background: var(--accent); border-color: var(--accent); }
.todo-text { flex: 1; text-align: left; font-size: 13.5px; background: none; border: none; padding: 0; color: var(--ink); cursor: pointer; font-family: inherit; }
.todo-text.done { color: var(--ink-soft); text-decoration: line-through; }
.todo-del { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 16px; padding: 4px 8px; }
.barchart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.barchart-row .blabel { width: 84px; flex-shrink: 0; font-size: 11.5px; color: var(--ink-soft); text-align: right; line-height: 1.2; }
.barchart-row .btrack { flex: 1; background: var(--bg); border-radius: 6px; height: 16px; overflow: hidden; }
.barchart-row .bfill { height: 100%; border-radius: 6px; }
.barchart-row .bval { width: 64px; flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--accent-deep); text-decoration: none; margin-bottom: 12px; }
[hidden] { display: none !important; }
.title-row { display: flex; align-items: center; gap: 8px; }
.gear { color: var(--ink-soft); display: inline-flex; padding: 4px; border-radius: 8px; }
.offline-bar { background: #3A3D32; color: #EDEEE3; font-size: 12.5px; padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: #1F221B; color: #fff;
  padding: 10px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 1100; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: calc(100% - 32px); text-align: center; }
.icon-btn { flex-shrink: 0; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 50%; color: var(--accent-deep); text-decoration: none; font-size: 14px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 4px 0; }
.kv span { color: var(--ink-soft); }
.kv b { font-variant-numeric: tabular-nums; text-align: right; }
.pbar { height: 6px; background: var(--bg); border-radius: 4px; overflow: hidden; margin: 2px 0 8px; }
.pbar > div { height: 100%; background: var(--accent); border-radius: 4px; }
.inv-line { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.inv-line:last-child { border-bottom: none; }
.inv-line .row-main { flex: 1; min-width: 0; }
.inv-line .title { font-weight: 600; font-size: 14px; }
.inv-line .sub { font-size: 12px; color: var(--ink-soft); }
.inv-line .amt-in { width: 96px; flex-shrink: 0; text-align: right; }
.custom-line { display: grid; grid-template-columns: 1fr 58px 84px 30px; gap: 6px; align-items: center; margin-bottom: 6px; }
.big-total { font-size: 14px; color: var(--ink-soft); }
.big-total b { font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; color: var(--accent-deep); margin-left: 6px; font-variant-numeric: tabular-nums; }
.portal-link { font-size: 12px; background: var(--bg); border-radius: 8px; padding: 8px 10px; word-break: break-all; color: var(--ink-soft); user-select: all; -webkit-user-select: all; }
.setup-steps { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
.setup-steps summary { font-weight: 600; cursor: pointer; }
.setup-steps ol { margin: 8px 0 0; padding-left: 18px; }
.setup-steps li { margin-bottom: 6px; }
.inv-doc .doc-banner { align-items: center; }
.inv-num { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; color: #33442D; font-weight: 700; text-align: right; }
.inv-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px 24px; margin-bottom: 16px; font-size: 13px; line-height: 1.45; }
.inv-lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: #6B7060; font-weight: 700; margin-bottom: 3px; }
.inv-meta { width: auto; }
.inv-meta td.k { width: auto; }
.paid-stamp { display: inline-block; border: 3px solid #4B6043; color: #4B6043; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 4px 12px; border-radius: 6px; transform: rotate(-4deg); margin-bottom: 12px; font-size: 14px; }
.line-note { font-size: 11.5px; color: #6B7060; margin-top: 2px; }
.qty-note { display: none; }
@media (max-width: 520px) { .inv-doc .col-qty, .inv-doc .col-rate { display: none; } .inv-doc .qty-note { display: block; } }
@media print { .inv-doc .col-qty, .inv-doc .col-rate { display: table-cell !important; } .inv-doc .qty-note { display: none !important; } }
.pay-box { background: #F4F5EE; border-left: 3px solid #33442D; padding: 10px 14px; margin-top: 16px; font-size: 13px; }

/* ---------- Map ---------- */
.map-card { padding: 12px; }
.map-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.map-toolbar label.check { margin-left: auto; }
.draw-panel { border: 1px dashed var(--rust); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--bg); }
.field-map { height: calc(100vh - 300px); min-height: 380px; border-radius: 10px; overflow: hidden; background: #2B2F26; }
.field-map.drawing { cursor: crosshair; }
.field-map.labels-hidden .field-label { display: none; }
.field-label { background: none; border: none; pointer-events: none; }
.field-label > div {
  transform: translate(-50%, -50%); text-align: center; white-space: nowrap; color: #fff; line-height: 1.2;
  text-shadow: 0 0 3px #000, 0 0 6px #000, 0 1px 2px #000; font-family: 'Inter', sans-serif;
}
.field-label .fl-client { font-weight: 800; font-size: 13px; }
.field-label .fl-field { font-weight: 600; font-size: 11.5px; }
.leaflet-container { font-family: 'Inter', sans-serif; }
.leaflet-popup-content { font-size: 13px; line-height: 1.4; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

/* ---------- Printable summaries ---------- */
.doc-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.doc-toolbar select { width: auto; min-width: 96px; }
.doc {
  background: #fff; color: #232620; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  color-scheme: light; font-size: 13.5px;
}
.doc-banner { display: flex; align-items: center; gap: 14px; padding: 18px 20px; background: #FAFAF1; border-bottom: 3px solid #33442D; }
.doc-banner img { width: 72px; height: auto; flex-shrink: 0; }
.doc-banner .co { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 700; color: #33442D; line-height: 1.2; }
.doc-banner .ttl { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: #5B6055; margin-top: 2px; }
.doc-body { padding: 18px 20px 8px; }
.doc h3 { font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; color: #33442D; border-bottom: 2px solid #33442D; padding-bottom: 4px; margin: 22px 0 10px; break-after: avoid; }
.doc h3:first-child { margin-top: 0; }
.doc-meta { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
.doc-meta td { padding: 3px 12px 3px 0; vertical-align: top; }
.doc-meta td.k { color: #6B7060; font-weight: 600; width: 104px; white-space: nowrap; }
.glance { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
@media (min-width: 520px) { .glance { grid-template-columns: repeat(4, minmax(0,1fr)); } }
.glance > div { border: 1px solid #D9DACB; border-radius: 6px; padding: 10px 12px; }
.glance .n { font-family: 'Source Serif 4', Georgia, serif; font-size: 21px; color: #33442D; font-variant-numeric: tabular-nums; line-height: 1.15; }
.glance .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: #5B6055; margin-top: 3px; }
.tbl-wrap { overflow-x: auto; }
.doc table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.doc table.t th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: #6B7060; border-bottom: 1px solid #CCCFBE; padding: 6px 8px; white-space: nowrap; }
.doc table.t td { padding: 7px 8px; border-bottom: 1px solid #E7E8DE; vertical-align: top; }
.doc table.t td.num, .doc table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.doc table.t tr.total td { font-weight: 700; border-top: 1px solid #33442D; border-bottom: none; }
.sev { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; }
.months { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 3px; }
.months div { text-align: center; border-radius: 4px; padding: 5px 0 4px; background: #F2F3EA; font-size: 10px; color: #5B6055; }
.months div b { display: block; font-size: 13px; color: #33442D; }
.months div.on { background: #DDE7D2; }
.field-block { margin-bottom: 16px; break-inside: avoid-page; }
.field-block h4 { font-size: 14px; margin: 0 0 8px; color: #232620; }
.field-block h4 span { font-weight: 500; color: #6B7060; font-size: 12px; }
.visit { border-left: 3px solid #B5652D; padding: 4px 0 4px 12px; margin-bottom: 10px; break-inside: avoid; }
.visit .vd { font-weight: 700; font-size: 12.5px; color: #33442D; }
.visit .vs { font-style: italic; color: #5B6055; font-size: 12.5px; margin-top: 2px; }
.visit ul { margin: 5px 0 0; padding-left: 0; list-style: none; }
.visit li { margin-bottom: 5px; font-size: 12.5px; }
.visit .plan { color: #5B6055; margin-top: 1px; padding-left: 2px; }
.visit .loc { color: #6B7060; }
.muted { color: #6B7060; }
.rec-list { margin: 0; padding-left: 18px; font-size: 12.5px; }
.rec-list li { margin-bottom: 4px; }
.doc-note { min-height: 70px; border: 1px dashed #CCCFBE; border-radius: 6px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; outline: none; }
.doc-note:empty::before { content: attr(data-placeholder); color: #9CA090; }
.doc-foot { padding: 14px 20px; background: #F7F7F1; border-top: 1px solid #D9DACB; font-size: 12px; color: #5B6055; margin-top: 14px; }
.doc-foot b { color: #33442D; }

@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  :root { padding: 0; }
  body { background: #fff; padding: 0; }
  header.top, .tabbar, .no-print { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .doc { border: none; border-radius: 0; }
  .doc-note { border: none; padding: 0; min-height: 0; }
  .notes-sec:has(.doc-note:empty) { display: none; }
  .tbl-wrap { overflow: visible; }
  .glance { grid-template-columns: repeat(4, minmax(0,1fr)); }
}
.avatar { width:40px; height:40px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; flex-shrink:0; letter-spacing:.02em; }
.avatar.lg { width:56px; height:56px; font-size:19px; }
.list-row .avatar { margin-right:12px; }
.sync-badge { display:inline-block; font-size:11.5px; color:var(--ink-soft); text-decoration:none; margin-top:2px; }
.sync-badge.warn { color:var(--crit); font-weight:600; }
</style>

<script>
/* ---------- File names ----------
   The Portal is index.html and the report builder is report.html, side by side
   in the same GitHub repo (grower.html and sw.js sit next to them). Keep those
   names and the link never changes. */
const REPORT_FILE = 'report.html';
function reportUrl(query){
  return encodeURIComponent(REPORT_FILE) + (query ? ('?' + query) : '');
}

/* A pending payment on a report (not on an invoice) counts as overdue after this many days. */
const OVERDUE_DAYS = 30;

/* ---------- Constants ---------- */
const CATEGORIES = {pest:'Pest Pressures', weed:'Weed Pressures', nutrient:'Nutrient Findings', irrigation:'Irrigation Findings', vertebrate:'Vertebrate Pressures', concern:'Other Concerning Findings'};
const CAT_SHORT = {pest:'Pest', weed:'Weed', nutrient:'Nutrient', irrigation:'Irrigation', vertebrate:'Vertebrate', concern:'Other'};
const CAT_COLOR = {pest:'var(--pest)', weed:'var(--weed)', nutrient:'var(--nutrient)', irrigation:'var(--irrigation)', vertebrate:'var(--vertebrate)', concern:'var(--concern)'};
const CAT_HEX = {pest:'#C4622A', weed:'#2A8FB5', nutrient:'#4F8A3D', irrigation:'#D9A426', vertebrate:'#A6488A', concern:'#9B9C8E'};
const SEV_HEX = {'None / Good':'#4B6043','Low':'#7E8A3E','Moderate':'#C79A2E','Severe':'#C4622A','Critical':'#A8342A'};
const SEV_RANK = {'None / Good':0,'Low':1,'Moderate':2,'Severe':3,'Critical':4};
const RULES = {
  weekly:       { label:'Every week',     short:'weekly',          days:7 },
  biweekly:     { label:'Every 2 weeks',  short:'every 2 weeks',   days:14 },
  every3weeks:  { label:'Every 3 weeks',  short:'every 3 weeks',   days:21 },
  monthly:      { label:'Every month',    short:'monthly',         months:1 },
  every2months: { label:'Every 2 months', short:'every 2 months',  months:2 },
  quarterly:    { label:'Every 3 months', short:'every 3 months',  months:3 }
};
const FIELD_COLORS = ['#F2C94C','#56CCF2','#FF8A65','#7BE495','#D59BF6','#FFB347','#FFFFFF'];
const EMPTY_TEXT = ['(not entered)','(not specified)',''];

/* ---------- Storage (shared with the report builder on the same site) ---------- */
function readJSON(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; }
}
function writeJSON(key, val){
  clearCache();
  try { localStorage.setItem(key, JSON.stringify(val)); if(typeof cloudDirty === 'function') cloudDirty(); return true; }
  catch(e){ alert('Could not save — this phone may be out of storage space for the app.'); return false; }
}
/* Per-screen cache so a screen reads each saved list once. Cleared on every render and save. */
let _cache = {};
function clearCache(){ _cache = {}; }
function cached(name, fn){ if(!(name in _cache)) _cache[name] = fn(); return _cache[name]; }

const loadReports         = () => cached('reports', () => readJSON('pca_reports', []));
const saveReports         = l  => writeJSON('pca_reports', l);
const loadManualClients   = () => readJSON('pca_manual_clients', []);
const saveManualClients   = l  => writeJSON('pca_manual_clients', l);
const loadAppts           = () => readJSON('pca_schedule_appts', []);
const saveAppts           = l  => writeJSON('pca_schedule_appts', l);
const loadSeries          = () => cached('series', () => readJSON('pca_schedule_series', []));
const saveSeries          = l  => writeJSON('pca_schedule_series', l);
const loadTodos           = () => readJSON('pca_schedule_todos', []);
const saveTodos           = l  => writeJSON('pca_schedule_todos', l);
const loadClientSettings  = () => readJSON('pca_client_settings', {});
const saveClientSettings  = o  => writeJSON('pca_client_settings', o);
const loadFields          = () => cached('fields', () => readJSON('pca_field_boundaries', []));
const saveFields          = l  => writeJSON('pca_field_boundaries', l);
const loadSummaryNotes    = () => readJSON('pca_summary_notes', {});
const saveSummaryNotes    = o  => writeJSON('pca_summary_notes', o);
const loadContracts       = () => cached('contracts', () => readJSON('pca_contracts', []));
const saveContracts       = l  => writeJSON('pca_contracts', l);

                       readJSON('pca_business', {}));
}

/* ---------- Formatting & dates (local time, not UTC) ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return (n==null || isNaN(n)) ? '—' : '$' + Math.round(n).toLocaleString('en-US'); }
function money2(n){ return (n==null || isNaN(n)) ? '—' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function round2(n){ return Math.round(n*100)/100; }
function clientKeyOf(name){ return (name||'').trim().toLowerCase(); }
function pad(n){ return String(n).padStart(2,'0'); }
function localISO(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function todayISO(){ return localISO(new Date()); }
function parseISO(iso){ const p = String(iso||'').split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return localISO(d); }
function addMonths(iso, n){
  const p = iso.split('-').map(Number);
  const t = new Date(p[0], p[1]-1+n, 1);
  const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  t.setDate(Math.min(p[2], last));
  return localISO(t);
}
function daysBetween(aISO, bISO){ return Math.round((parseISO(bISO) - parseISO(aISO)) / 86400000); }
function fmtDateShort(iso){ if(!iso) return ''; return parseISO(iso).toLocaleDateString('en-US', {month:'short', day:'numeric'}); }
function fmtDateMed(iso){ if(!iso) return ''; return parseISO(iso).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
function fmtDateDay(iso){ if(!iso) return ''; return parseISO(iso).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}); }
function fmtDateLong(iso){ if(!iso) return ''; return parseISO(iso).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}); }
function fmtMonthLabel(ym){ return parseISO(ym + '-01').toLocaleDateString('en-US', {month:'short', year:'numeric'}); }
function fmtTime(t){
  if(!t) return '';
  const p = t.split(':').map(Number); const h = p[0], m = p[1]||0;
  return (((h+11)%12)+1) + ':' + pad(m) + (h>=12 ? ' PM' : ' AM');
}
function fmtStamp(ms){ return ms ? new Date(ms).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : ''; }
function reportDateLabel(r){ return r.dateISO ? fmtDateMed(r.dateISO) : (r.date || ''); }
function sortByDateDesc(list){ return list.slice().sort((a,b)=> (b.dateISO||'').localeCompare(a.dateISO||'') || (b.id||0)-(a.id||0)); }
function sortByDateAsc(list){ return sortByDateDesc(list).reverse(); }
function sum(list, fn){ return list.reduce((s,x)=> s + (fn(x)||0), 0); }
function hasText(s){ return s && !EMPTY_TEXT.includes(String(s).trim()); }
function logVisitHref(name){ return '#report/' + encodeURIComponent('farmer=' + encodeURIComponent(name)); }
function openReportHref(id){ return '#report/' + encodeURIComponent('open=' + id); }
function editReportHref(id){ return '#report/' + encodeURIComponent('edit=' + id); }
function clientHref(key){ return '#client/' + encodeURIComponent(key); }
function telHref(phone){ return 'tel:' + String(phone||'').replace(/[^\d+]/g, ''); }
function smsHref(phone, body){ return 'sms:' + String(phone||'').replace(/[^\d+]/g, '') + (body ? '&body=' + encodeURIComponent(body) : ''); }
function mailHref(to, subject, body){ return 'mailto:' + encodeURIComponent(to||'').replace(/%40/g,'@') + '?subject=' + encodeURIComponent(subject||'') + '&body=' + encodeURIComponent(body||''); }

/* ---------- Directions (Google Maps) ---------- */
function directionsUrl(lat, lng){ return 'https://www.google.com/maps/dir/?api=1&destination=' + (+lat).toFixed(6) + ',' + (+lng).toFixed(6) + '&travelmode=driving'; }
function fieldDirectionsUrl(f){ const c = polygonCentroid(f.points); return directionsUrl(c[0], c[1]); }
function firstFieldFor(clientName){ const k = clientKeyOf(clientName); return loadFields().find(f=>f.clientKey===k) || null; }
function dirButton(url, label){ return `<a class="btn small ghost dir-btn" href="${url}" target="_blank" rel="noopener">➤ ${esc(label||'Directions')}</a>`; }

/* ---------- Billing ledger ----------
   Everything billed, in one list: each sent or paid invoice, plus each report with
   a dollar amount that isn't on an invoice. Totals everywhere come from here, so a
   visit on an invoice is never counted twice. */
function invoiceTotal(inv){ return round2(sum(inv.lines||[], l => num(l.amount))); }
function invoiceOverdue(inv){ return inv.status === 'sent' && !!inv.due && inv.due < todayISO(); }
function invoiceForReport(){ return cached('invByReport', ()=>{ const m = {}; loadInvoices().forEach(inv => (inv.lines||[]).forEach(l => { if(l.reportId) m[l.reportId] = inv; })); return m; }); }
function isPending(r){ return typeof r.amount === 'number' && r.paymentStatus !== 'paid'; }
function daysOut(r){ return r.dateISO ? daysBetween(r.dateISO, todayISO()) : 0; }
function isOverdue(r){ return isPending(r) && !!r.dateISO && daysOut(r) > OVERDUE_DAYS; }
function getLedger(){
  return cached('ledger', ()=>{
    const today = todayISO(), out = [], onInvoice = {};
    loadInvoices().forEach(inv => {
      if(inv.status === 'draft') return;
      (inv.lines||[]).forEach(l => { if(l.reportId) onInvoice[l.reportId] = true; });
      const paid = inv.status === 'paid';
      out.push({ kind:'invoice', id:inv.id, clientKey:inv.clientKey, client:inv.client, dateISO:inv.issued, amount:invoiceTotal(inv),
                 paid, overdue: !paid && !!inv.due && inv.due < today, late: inv.due ? daysBetween(inv.due, today) : 0, inv });
    });
    loadReports().forEach(r => {
      if(typeof r.amount !== 'number' || onInvoice[r.id]) return;
      out.push({ kind:'report', id:r.id, clientKey:clientKeyOf(r.farmer), client:r.farmer, dateISO:r.dateISO||'', amount:r.amount,
                 paid: r.paymentStatus === 'paid', overdue: isOverdue(r), late: daysOut(r), r });
    });
    return out;
  });
}
function ledgerFor(key){ return getLedger().filter(x=>x.clientKey===key); }
function payChip(r, clickable){
  const inv = invoiceForReport()[r.id];
  if(inv){
    let cls = 'pending', label = 'Invoiced';
    if(inv.status === 'paid'){ cls = 'paid'; label = 'Paid'; }
    else if(inv.status === 'draft'){ cls = 'soft'; label = 'On draft'; }
    else if(invoiceOverdue(inv)){ cls = 'overdue'; label = 'Overdue'; }
    return `<a class="chip ${cls}" href="#invoice/${inv.id}" style="text-decoration:none;">${label} · ${esc(inv.number)}</a>`;
  }
  if(typeof r.amount !== 'number') return '';
  let cls, label;
  if(r.paymentStatus === 'paid'){ cls = 'paid'; label = 'Paid'; }
  else if(isOverdue(r)){ cls = 'overdue'; label = 'Overdue · ' + daysOut(r) + 'd'; }
  else { cls = 'pending'; label = 'Pending'; }
  if(!clickable) return `<span class="chip ${cls}">${label}</span>`;
  const next = r.paymentStatus === 'paid' ? 'unpaid' : 'paid';
  return `<button type="button" class="chip chip-btn ${cls}" onclick="togglePaymentStatus(${r.id})" aria-label="${label} — tap to mark ${next}">${label}</button>`;
}
function ledgerChip(x){
  if(x.kind === 'report') return payChip(x.r, true);
  const cls = x.paid ? 'paid' : x.overdue ? 'overdue' : 'pending';
  const label = x.paid ? 'Paid' : x.overdue ? 'Overdue · ' + x.late + 'd' : 'Due ' + fmtDateShort(x.inv.due);
  return `<a class="chip ${cls}" href="#invoice/${x.id}" style="text-decoration:none;">${label}</a>`;
}
function togglePaymentStatus(id){
  const list = loadReports();
  const r = list.find(x=>x.id===id);
  if(!r) return;
  r.paymentStatus = (r.paymentStatus === 'paid') ? 'pending' : 'paid';
  saveReports(list);
  refresh();
}

/* ---------- Recurring visits ---------- */
function ruleStep(iso, rule, n){
  const r = RULES[rule]; if(!r) return iso;
  return r.days ? addDays(iso, r.days*n) : addMonths(iso, r.months*n);
}
function seriesDates(s, fromISO, toISO){
  const out = [];
  for(let n = 0; n < 800; n++){
    const d = ruleStep(s.start, s.rule, n);
    if(d > toISO) break;
    if(d >= fromISO && !(s.skips||[]).includes(d)) out.push(d);
  }
  return out;
}
function nextSeriesDate(s){ const d = seriesDates(s, todayISO(), addDays(todayISO(), 400)); return d[0] || null; }
function visitsBetween(fromISO, toISO){
  const out = [];
  loadAppts().forEach(a => {
    if(a.date >= fromISO && a.date <= toISO) out.push({ kind:'appt', id:a.id, date:a.date, time:a.time||'', client:a.client, note:a.note||'', assignee:a.assignee||'' });
  });
  loadSeries().forEach(s => seriesDates(s, fromISO, toISO).forEach(d => {
    out.push({ kind:'series', id:s.id, date:d, time:s.time||'', client:s.client, note:s.note||'', rule:s.rule, assignee:s.assignee||'' });
  }));
  return out.sort((x,y)=> (x.date + (x.time||'99')).localeCompare(y.date + (y.time||'99')));
}
/* A repeating check-in is "due" when its most recent date has passed with no report
   logged for that client since (3 days' grace for visiting a little early). */
function checkinsDue(){
  const today = todayISO(), from = addDays(today, -60);
  const byKey = {}; computeClients().forEach(c => byKey[c.key] = c);
  const out = [];
  loadSeries().forEach(s => {
    const past = seriesDates(s, from, today);
    if(!past.length) return;
    const due = past[past.length-1];
    const c = byKey[s.clientKey];
    const last = c && c.lastVisitISO;
    if(last && last >= addDays(due, -3)) return;
    out.push({ series:s, due, late: daysBetween(due, today) });
  });
  return out.sort((a,b)=> b.late - a.late);
}
function skipOccurrence(seriesId, date){
  const list = loadSeries();
  const s = list.find(x=>x.id===seriesId); if(!s) return;
  s.skips = (s.skips||[]).concat([date]);
  saveSeries(list);
  refresh();
}
function visitRow(v, opts){
  opts = opts || {};
  const rep = v.kind === 'series' ? ` · <span title="Repeats">↻ ${esc(RULES[v.rule] ? RULES[v.rule].short : '')}</span>` : '';
  const del = opts.deletable
    ? (v.kind === 'series'
        ? `<button class="todo-del" onclick="confirmSkip(${v.id}, '${v.date}')" aria-label="Skip this visit">✕</button>`
        : `<button class="todo-del" onclick="deleteAppt(${v.id})" aria-label="Delete appointment">✕</button>`)
    : '';
  const f = firstFieldFor(v.client);
  const dir = f ? `<a class="icon-btn" href="${fieldDirectionsUrl(f)}" target="_blank" rel="noopener" aria-label="Directions to ${esc(v.client)}" title="Directions">➤</a>` : '';
  return `
    <div class="list-row">
      <div class="row-main">
        <div class="title">${esc(v.client)}</div>
        <div class="sub">${fmtDateDay(v.date)}${v.time ? ' · ' + fmtTime(v.time) : ''}${rep}${v.note ? ' · ' + esc(v.note) : ''}${visitWhoText(v)}</div>
      </div>
      ${dir}${del}
    </div>`;
}
function confirmSkip(id, date){
  if(confirm('Skip the ' + fmtDateDay(date) + ' visit? The rest of the repeating schedule stays the same.')) skipOccurrence(id, date);
}
function deleteAppt(id){
  saveAppts(loadAppts().filter(a=>a.id!==id));
  refresh();
}

/* ---------- Clients ---------- */
function computeClients(){
  return cached('clients', ()=>{
    const reports = loadReports();
    const settings = loadClientSettings();
    const series = loadSeries();
    const fields = loadFields();
    const map = {};
    reports.forEach(r=>{
      const key = clientKeyOf(r.farmer);
      if(!key || key.startsWith('(farmer name')) return;
      if(!map[key]) map[key] = { key, name:r.farmer, crop:'', county:'', reports:[] };
      map[key].reports.push(r);
    });
    loadManualClients().forEach(m=>{
      const key = clientKeyOf(m.name);
      if(!key || map[key]) return;
      map[key] = { key, name:m.name, crop:m.crop||'', county:m.county||'', reports:[], manual:true };
    });
    const ledger = getLedger();
    Object.values(map).forEach(c=>{
      c.reports = sortByDateDesc(c.reports);
      const latest = c.reports[0];
      if(latest){
        c.name = latest.farmer || c.name;
        c.crop = hasText(latest.crop) && !String(latest.crop).startsWith('(') ? latest.crop : c.crop;
        c.county = latest.county || c.county;
      }
      c.reportCount = c.reports.length;
      const mine = ledger.filter(x=>x.clientKey===c.key);
      c.totalAmount = round2(sum(mine, x=>x.amount));
      c.avgAmount = c.reportCount && c.totalAmount ? c.totalAmount / c.reportCount : null;
      c.lastVisitISO = latest ? (latest.dateISO || '') : '';
      c.lastVisitLabel = latest ? reportDateLabel(latest) : '';
      c.outstanding = round2(sum(mine.filter(x=>!x.paid), x=>x.amount));
      c.overdue = round2(sum(mine.filter(x=>!x.paid && x.overdue), x=>x.amount));
      const st = settings[c.key] || {};
      c.notes = st.notes || '';
      c.contact = st.contact || {};
      c.portal = st.portal || null;
      c.series = series.find(s=>s.clientKey===c.key) || null;
      c.fields = fields.filter(f=>f.clientKey===c.key);
      c.contract = currentContract(c.key);
    });
    return Object.values(map).sort((a,b)=> a.name.localeCompare(b.name));
  });
}
function clientByKey(key){ return computeClients().find(c=>c.key===key) || null; }
function ensureClient(name){
  const key = clientKeyOf(name);
  if(!key) return key;
  if(!computeClients().some(c=>c.key===key)){
    const list = loadManualClients(); list.push({ name: name.trim(), crop:'', county:'' }); saveManualClients(list);
  }
  return key;
}

/* ---------- Router ---------- */
function currentRoute(){
  const h = (location.hash || '#dashboard').slice(1);
  const parts = h.split('/');
  const dec = s => { try { return decodeURIComponent(s); } catch(e){ return s; } };
  return { tab: parts[0] || 'dashboard', arg: parts[1] ? dec(parts[1]) : null, arg2: parts[2] ? dec(parts[2]) : null };
}
window.addEventListener('hashchange', ()=> render());
window.addEventListener('load', ()=>{
  document.getElementById('headerSub').textContent = 'Tavares Crop Consulting · ' + parseISO(todayISO()).toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
  if(!location.hash) history.replaceState(null, '', '#dashboard');
  render();
});
const TAB_OF = { client:'clients', map:'clients', grower:'clients', summary:'analytics', invoice:'analytics', invoices:'analytics', settings:'', team:'', employee:'' };
function setActiveTab(tab){
  const t = (tab in TAB_OF) ? TAB_OF[tab] : tab;
  document.querySelectorAll('.tabitem').forEach(el=> el.classList.toggle('active', el.getAttribute('data-tab') === t));
}
let activeMap = null;
function render(opts){
  opts = opts || {};
  clearCache();
  if(activeMap){ try { activeMap.remove(); } catch(e){} activeMap = null; }
  const { tab, arg, arg2 } = currentRoute();
  const view = document.getElementById('view');
  if(tab === 'join'){
    try { const o = JSON.parse(new TextDecoder().decode(unb64url(arg))); if(o.u && o.k) lsSetRaw(CK.cfg, { url:o.u, key:o.k }); } catch(e){}
    history.replaceState(null, '', '#dashboard'); render(); return;
  }
  const tabbar = document.querySelector('.tabbar');
  if(cloudGateActive()){ view.innerHTML = renderCloudGate(); wireCloudGate(); syncBadgeIdle(); return; }
  tabbar.style.display = '';
  const emp = isEmployee();
  document.getElementById('teamLink').style.display = emp ? 'none' : '';
  document.querySelector('.tabitem[data-tab="analytics"]').style.display = emp ? 'none' : '';
  if(emp){
    if(!['dashboard','report','clients','client','map','scheduler','settings'].includes(tab)){ location.hash = '#dashboard'; return; }
    if(!schedState.set){ schedState.who = meId(); schedState.set = true; }
  }
  setActiveTab(tab);
  const fullscreenLink = document.getElementById('openFullscreenLink');
  fullscreenLink.hidden = tab !== 'report';
  if(tab === 'report') fullscreenLink.href = reportUrl(arg);

  if(tab === 'report')          { view.innerHTML = renderReportTab(arg); }
  else if(tab === 'clients')    { view.innerHTML = renderClients(); wireClients(); }
  else if(tab === 'client')     { view.innerHTML = renderClientDetail(arg); wireClientDetail(arg); }
  else if(tab === 'map')        { view.innerHTML = renderMapView(arg); wireMap(arg); }
  else if(tab === 'analytics')  { view.innerHTML = renderAnalytics(); wireAnalytics(); }
  else if(tab === 'summary')    { view.innerHTML = renderBusinessSummary(arg); wireSummary(); }
  else if(tab === 'grower')     { view.innerHTML = renderGrowerSummary(arg, arg2); wireSummary(arg, arg2); }
  else if(tab === 'scheduler')  { view.innerHTML = renderScheduler(); wireScheduler(); }
  else if(tab === 'invoices')   { view.innerHTML = renderInvoiceList(arg); }
  else if(tab === 'invoice')    {
    if(arg === 'new' || arg === 'edit'){ view.innerHTML = renderInvoiceEditor(arg, arg2); wireInvoiceEditor(arg, arg2); }
    else { view.innerHTML = renderInvoiceView(arg); wireInvoiceView(arg); }
  }
  else if(tab === 'team')       { view.innerHTML = renderTeam(); wireTeam(); }
  else if(tab === 'employee')   { view.innerHTML = renderEmployee(arg); wireEmployee(arg); }
  else if(tab === 'settings')   { view.innerHTML = renderSettings(); wireSettings(); }
  else if(emp)                  { view.innerHTML = renderEmployeeHome(); }
  else                          { view.innerHTML = renderDashboard(); wireDashboard(); }
  if(!opts.keepScroll) window.scrollTo(0,0);
  syncBadgeIdle();
  schedulePublish();
}
/* Re-render the current screen after a change, without jumping to the top. */
function refresh(){ render({ keepScroll:true }); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 3200);
}

function reportRow(r, opts){
  opts = opts || {};
  const n = (r.issues||[]).length;
  const issues = n ? ' · ' + n + ' issue' + (n===1?'':'s') : '';
  const title = opts.byField ? r.field : r.farmer;
  const sub = (opts.byField ? reportDateLabel(r) + issues : r.field + ' · ' + reportDateLabel(r) + issues) + performerSuffix(r);
  return `
    <div class="list-row">
      <a class="row-main" href="${openReportHref(r.id)}">
        <div class="title">${esc(title)}</div>
        <div class="sub">${esc(sub)}</div>
      </a>
      <div class="right"><div class="amt">${typeof r.amount === 'number' ? money(r.amount) : ''}</div>${payChip(r, true)}</div>
      <a class="edit-icon" href="${editReportHref(r.id)}" aria-label="Edit this report" title="Edit">✎</a>
    </div>`;
}
function reportIsUnpaid(r){
  const inv = invoiceForReport()[r.id];
  if(inv && inv.status !== 'draft') return inv.status !== 'paid';
  return isPending(r);
}
function reportIsOverdue(r){
  const inv = invoiceForReport()[r.id];
  if(inv && inv.status !== 'draft') return invoiceOverdue(inv);
  return isOverdue(r);
}
function renderReportResults(){
  const all = loadReports();
  if(!all.length) return `<div class="empty">No reports saved yet. Tap Report below to write your first one.</div>`;
  const q = dashState.q.trim().toLowerCase(), f = dashState.filter, today = todayISO();
  let list = sortByDateDesc(all);
  if(f === 'unpaid')  list = list.filter(reportIsUnpaid);
  if(f === 'overdue') list = list.filter(reportIsOverdue);
  if(f === 'month')   list = list.filter(r=> (r.dateISO||'').slice(0,7) === today.slice(0,7));
  if(f === 'year')    list = list.filter(r=> (r.dateISO||'').slice(0,4) === today.slice(0,4));
  if(q) list = list.filter(r => [r.farmer, r.field, r.crop, r.county, r.date, r.dateISO].join(' ').toLowerCase().includes(q));
  const filtered = !!q || f !== 'all';
  const limit = filtered ? 60 : 6;
  if(!list.length) return `<div class="empty">No reports match.</div>`;
  let h = filtered ? `<div class="result-count">${list.length} report${list.length===1?'':'s'}${list.length>limit ? ' — showing the ' + limit + ' most recent' : ''}</div>` : '';
  h += list.slice(0, limit).map(r=>reportRow(r)).join('');
  if(!filtered && list.length > limit) h += `<div class="result-count">Showing the ${limit} most recent of ${list.length}. Search or filter to find older ones.</div>`;
  return h;
}
function wireDashboard(){
  const s = document.getElementById('repSearch'), f = document.getElementById('repFilter'), out = document.getElementById('repResults');
  if(s) s.addEventListener('input', ()=>{ dashState.q = s.value; out.innerHTML = renderReportResults(); });

}

  });
  const edit = document.getElementById('editRepeat');
  if(edit) edit.addEventListener('click', ()=>{ document.getElementById('repeatView').hidden = true; document.getElementById('repeatForm').hidden = false; });
  const cancel = document.getElementById('cancelRepeat');
  if(cancel) cancel.addEventListener('click', ()=>{ document.getElementById('repeatView').hidden = false; document.getElementById('repeatForm').hidden = true; });
  const stop = document.getElementById('stopRepeat');
  if(stop) stop.addEventListener('click', ()=>{
    if(!confirm('Stop the repeating check-ins for ' + c.name + '? Past reports are not affected.')) return;
    saveSeries(loadSeries().filter(s=>s.clientKey !== c.key));
    refresh();
  });

  // Contact fields and notes save as you type
  const saved = document.getElementById('notesSaved');
  let t = null;
  const saveContact = ()=>{
    saved.textContent = 'Saving…';
    clearTimeout(t);
    t = setTimeout(()=>{
      const contact = {};
      document.querySelectorAll('[data-contact]').forEach(el => { contact[el.getAttribute('data-contact')] = el.value.trim(); });
      if(updateClientSettings(c.key, { contact, notes: document.getElementById('clientNotes').value })) saved.textContent = 'Saved';
    }, 500);
  };
  document.querySelectorAll('[data-contact], #clientNotes').forEach(el => el.addEventListener('input', saveContact));

  const gsGo = document.getElementById('gsGo');
  if(gsGo) gsGo.addEventListener('click', ()=>{
    location.hash = '#grower/' + encodeURIComponent(c.key) + '/' + document.getElementById('gsYear').value;
  });
  if(!isEmployee()) wireContractCard(c);
  wireClientTeamCard(c);
  if(!isEmployee()) wirePortalCard(c);
}
</script>
<script>
/* ---------- Field geometry ---------- */
const EARTH_R = 6378137;
function projectPts(points){
  const lat0 = points.reduce((s,p)=>s+p[0],0) / points.length * Math.PI/180;
  return { lat0, xy: points.map(p=>[EARTH_R * p[1]*Math.PI/180 * Math.cos(lat0), EARTH_R * p[0]*Math.PI/180]) };
}
function polygonAcres(points){
  if(!points || points.length < 3) return 0;
  const xy = projectPts(points).xy; let a = 0;
  for(let i=0;i<xy.length;i++){ const p=xy[i], q=xy[(i+1)%xy.length]; a += p[0]*q[1] - q[0]*p[1]; }
  return Math.abs(a)/2/4046.8564224;
}
function polygonCentroid(points){
  const avg = [points.reduce((s,p)=>s+p[0],0)/points.length, points.reduce((s,p)=>s+p[1],0)/points.length];
  if(points.length < 3) return avg;
  const pr = projectPts(points), xy = pr.xy;
  let a=0, cx=0, cy=0;
  for(let i=0;i<xy.length;i++){
    const p=xy[i], q=xy[(i+1)%xy.length], f = p[0]*q[1] - q[0]*p[1];
    a += f; cx += (p[0]+q[0])*f; cy += (p[1]+q[1])*f;
  }
  if(Math.abs(a) < 1e-6) return avg;
  cx /= (3*a); cy /= (3*a);
  return [cy/EARTH_R*180/Math.PI, cx/(EARTH_R*Math.cos(pr.lat0))*180/Math.PI];
}
function fmtAcres(a){ return a ? (a >= 10 ? Math.round(a).toLocaleString('en-US') : a.toFixed(1)) + ' acres' : '—'; }
function colorForKey(key){ let h = 0; for(const ch of String(key)) h = (h*31 + ch.charCodeAt(0)) >>> 0; return FIELD_COLORS[h % FIELD_COLORS.length]; }

/* ---------- Map (client fields on satellite view) ---------- */
const mapPrefs = { pins: true };
let mapFieldLayers = {};
let focusFieldId = null;
function renderMapView(focusKey){
  const clients = computeClients();
  const fields = loadFields().slice().sort((a,b)=> a.client.localeCompare(b.client) || a.field.localeCompare(b.field));
  const focus = focusKey ? clients.find(c=>c.key===focusKey) : null;
  return `
    ${segControl('map')}
    ${ focus ? `<a class="back-link" href="#client/${encodeURIComponent(focus.key)}">← ${esc(focus.name)}</a>` : '' }
    <div class="card map-card">
      <div class="map-toolbar">
        <button class="btn rust small" id="startDraw">+ Outline a field</button>
        <button class="btn ghost small" id="locateMe">◎ My location</button>
        <label class="check"><input type="checkbox" id="showPins" ${mapPrefs.pins?'checked':''}> Issue pins</label>
      </div>
      <div class="draw-panel" id="drawPanel" hidden>
        <div class="field-row">
          <div class="field"><label for="drClient">Client</label>
            <select id="drClient">
              ${clients.map(c=>`<option value="${esc(c.key)}" ${focusKey===c.key?'selected':''}>${esc(c.name)}</option>`).join('')}
              <option value="__new" ${clients.length?'':'selected'}>+ New client…</option>
            </select></div>
          <div class="field"><label for="drField">Field name</label><input type="text" id="drField" placeholder="e.g. North 40"></div>
        </div>
        <div class="field" id="drNewWrap" hidden><label for="drNewClient">New client name</label><input type="text" id="drNewClient" placeholder="e.g. Alvarez Ranch"></div>
        <p class="hint" style="margin-bottom:10px;">Tap each corner of the field on the map, going around the edge. <b id="drStats">0 points</b></p>
        <div class="actions-row">
          <button class="btn small" id="drFinish">Save field</button>
          <button class="btn small ghost" id="drUndo">Undo point</button>
          <button class="btn small ghost" id="drCancel">Cancel</button>
        </div>
      </div>
      <div id="fieldMap" class="field-map"></div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <h2>Saved fields</h2>
      ${ fields.length ? fields.map(f=>`
        <div class="list-row">
          <div class="row-main">
            <div class="title"><span class="swatch" style="background:${colorForKey(f.clientKey)}; outline:1px solid var(--line);"></span>${esc(f.client)} — ${esc(f.field)}</div>
            <div class="sub">${fmtAcres(polygonAcres(f.points))}</div>
          </div>
          <div class="right inline">
            <button class="btn small ghost" onclick="zoomToField(${f.id})">Show</button>
            <a class="icon-btn" href="${fieldDirectionsUrl(f)}" target="_blank" rel="noopener" aria-label="Directions" title="Directions">➤</a>
            <button class="todo-del" onclick="deleteField(${f.id})" aria-label="Delete field outline">✕</button>
          </div>
        </div>`).join('') : `<div class="empty">No fields outlined yet. Tap "+ Outline a field", pick the client, then tap the field's corners on the satellite map.</div>` }
    </div>
  `;
}
function zoomToField(id){
  const layer = mapFieldLayers[id];
  if(activeMap && layer){
    activeMap.fitBounds(layer.getBounds(), { padding:[30,30], maxZoom:18 });
    document.getElementById('fieldMap').scrollIntoView({ behavior:'smooth', block:'center' });
  }
}
function deleteField(id){
  const f = loadFields().find(x=>x.id===id); if(!f) return;
  if(!confirm('Delete the outline for ' + f.client + ' — ' + f.field + '?')) return;
  saveFields(loadFields().filter(x=>x.id!==id));
  refresh();
}
function wireMap(focusKey){
  const el = document.getElementById('fieldMap');
  if(typeof L === 'undefined'){ el.innerHTML = '<div class="empty" style="padding:20px; color:#ddd;">The map needs an internet connection to load.</div>'; return; }
  const map = L.map(el, { zoomControl: true });
  activeMap = map;
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, crossOrigin: true, attribution: 'Tiles &copy; Esri' }).addTo(map);
  const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, crossOrigin: true }).addTo(map);
  const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, maxNativeZoom: 19, crossOrigin: true, attribution: '&copy; OpenStreetMap contributors' });
  L.control.layers({ 'Satellite': satellite, 'Street map': streets }, {}, { collapsed: true }).addTo(map);
  map.on('baselayerchange', e => { if(e.name === 'Satellite'){ if(!map.hasLayer(labels)) labels.addTo(map); } else map.removeLayer(labels); });

  let draft = null;
  const fieldGroup = L.featureGroup().addTo(map);
  const pinGroup = L.featureGroup();
  const draftGroup = L.featureGroup().addTo(map);
  mapFieldLayers = {};

  loadFields().forEach(f=>{
    const color = colorForKey(f.clientKey);
    const poly = L.polygon(f.points, { color, weight: 3, fillColor: color, fillOpacity: 0.16 }).addTo(fieldGroup);
    poly.on('click', e=>{
      if(draft) return;
      L.popup().setLatLng(e.latlng).setContent(`<b>${esc(f.client)}</b><br>${esc(f.field)} · ${fmtAcres(polygonAcres(f.points))}<br><a href="${fieldDirectionsUrl(f)}" target="_blank" rel="noopener">➤ Directions (Google Maps)</a><br><a href="#client/${encodeURIComponent(f.clientKey)}">Open client →</a>`).openOn(map);
    });
    const icon = L.divIcon({ className: 'field-label', html: `<div><div class="fl-client">${esc(f.client)}</div><div class="fl-field">${esc(f.field)}</div></div>`, iconSize: null });
    L.marker(polygonCentroid(f.points), { icon, interactive: false, keyboard: false }).addTo(fieldGroup);
    mapFieldLayers[f.id] = poly;
  });

  loadReports().forEach(r => (r.issues||[]).forEach(i => {
    if(!i.pin || typeof i.pin.lat !== 'number') return;
    const m = L.circleMarker([i.pin.lat, i.pin.lon], { radius: 7, color: '#fff', weight: 2, fillColor: CAT_HEX[i.category] || '#9B9C8E', fillOpacity: 1 }).addTo(pinGroup);
    m.on('click', e=>{
      if(draft) return;
      L.popup().setLatLng(e.latlng).setContent(`<b>${esc(r.farmer)}</b> — ${esc(r.field)}<br>${esc(reportDateLabel(r))}<br>${esc(CAT_SHORT[i.category]||'')}: ${esc(hasText(i.problem) ? i.problem : '')} <i>(${esc(i.severity)})</i><br><a href="${directionsUrl(i.pin.lat, i.pin.lon)}" target="_blank" rel="noopener">➤ Directions</a> &nbsp; <a href="${openReportHref(r.id)}">Open report →</a>`).openOn(map);
    });
  }));
  if(mapPrefs.pins) pinGroup.addTo(map);

  // Initial view: the focused client's fields, else everything, else the Central Valley.
  const focusLayers = focusKey ? loadFields().filter(f=>f.clientKey===focusKey).map(f=>mapFieldLayers[f.id]) : [];
  let bounds = null;
  if(focusFieldId && mapFieldLayers[focusFieldId]) bounds = mapFieldLayers[focusFieldId].getBounds();
  else if(focusLayers.length) bounds = L.featureGroup(focusLayers).getBounds();
  else if(fieldGroup.getLayers().length) bounds = fieldGroup.getBounds();
  else if(mapPrefs.pins && pinGroup.getLayers().length) bounds = pinGroup.getBounds();
  focusFieldId = null;
  if(bounds && bounds.isValid()) map.fitBounds(bounds, { padding: [30,30], maxZoom: 17 });
  else map.setView([37.45, -120.85], 9);

  const updateLabels = ()=> el.classList.toggle('labels-hidden', map.getZoom() < 13);
  map.on('zoomend', updateLabels); updateLabels();
  setTimeout(()=> map.invalidateSize(), 150);

  document.getElementById('showPins').addEventListener('change', e=>{
    mapPrefs.pins = e.target.checked;
    if(mapPrefs.pins) pinGroup.addTo(map); else map.removeLayer(pinGroup);
  });
  let meMarker = null;
  document.getElementById('locateMe').addEventListener('click', ()=>{
    if(!navigator.geolocation){ alert('Location is not available on this device.'); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      const ll = [pos.coords.latitude, pos.coords.longitude];
      if(meMarker) map.removeLayer(meMarker);
      meMarker = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#2F80ED', fillOpacity: 1 }).addTo(map);
      map.setView(ll, Math.max(map.getZoom(), 16));
    }, ()=> alert("Couldn't get your location. Check that Location is allowed for Safari in your iPhone settings."), { enableHighAccuracy: true, timeout: 12000 });
  });

  // Drawing a field outline
  const panel = document.getElementById('drawPanel');
  const clientSel = document.getElementById('drClient'), newWrap = document.getElementById('drNewWrap');
  const syncNew = ()=>{ newWrap.hidden = clientSel.value !== '__new'; };
  clientSel.addEventListener('change', syncNew); syncNew();
  const stats = document.getElementById('drStats');
  const redraw = ()=>{
    draftGroup.clearLayers();
    const pts = draft ? draft.points : [];
    if(pts.length >= 3) L.polygon(pts, { color:'#FFE14D', weight:3, dashArray:'6 6', fillColor:'#FFE14D', fillOpacity:0.15, interactive:false }).addTo(draftGroup);
    else if(pts.length === 2) L.polyline(pts, { color:'#FFE14D', weight:3, dashArray:'6 6', interactive:false }).addTo(draftGroup);
    pts.forEach((p,i)=> L.circleMarker(p, { radius:6, color:'#fff', weight:2, fillColor: i===0 ? '#FF7A59' : '#FFE14D', fillOpacity:1, interactive:false }).addTo(draftGroup));
    stats.textContent = pts.length + ' point' + (pts.length===1?'':'s') + (pts.length >= 3 ? ' · ' + fmtAcres(polygonAcres(pts)) : '');
  };
  const stopDraw = ()=>{
    draft = null; draftGroup.clearLayers(); panel.hidden = true;
    el.classList.remove('drawing'); map.doubleClickZoom.enable();
    document.getElementById('startDraw').hidden = false;
  };
  map.on('click', e=>{ if(!draft) return; draft.points.push([e.latlng.lat, e.latlng.lng]); redraw(); });
  document.getElementById('startDraw').addEventListener('click', ()=>{
    draft = { points: [] }; panel.hidden = false; redraw();
    el.classList.add('drawing'); map.doubleClickZoom.disable(); map.closePopup();
    document.getElementById('startDraw').hidden = true;
    panel.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  document.getElementById('drUndo').addEventListener('click', ()=>{ if(draft && draft.points.length){ draft.points.pop(); redraw(); } });
  document.getElementById('drCancel').addEventListener('click', stopDraw);
  document.getElementById('drFinish').addEventListener('click', ()=>{
    if(!draft || draft.points.length < 3){ alert('Tap at least 3 corners of the field on the map first.'); return; }
    const fieldName = document.getElementById('drField').value.trim();
    if(!fieldName){ document.getElementById('drField').focus(); alert('Give the field a name (e.g. "North 40").'); return; }
    let key, name;
    if(clientSel.value === '__new'){
      name = document.getElementById('drNewClient').value.trim();
      if(!name){ document.getElementById('drNewClient').focus(); alert('Enter the new client’s name.'); return; }
      key = ensureClient(name);
    } else {
      key = clientSel.value;
      name = clientSel.options[clientSel.selectedIndex].text;
    }
    const id = Date.now();
    const list = loadFields();
    list.push({ id, clientKey: key, client: name, field: fieldName, points: draft.points.map(p=>[+p[0].toFixed(7), +p[1].toFixed(7)]), created: todayISO() });
    if(!saveFields(list)) return;
    focusFieldId = id;
    refresh();
  });
}

/* ---------- Analytics ---------- */
function computeAnalytics(){
  const reports = loadReports();
  const ledger = getLedger();
  const totalRevenue = sum(ledger, x=>x.amount);
  const avgPerReport = reports.length && totalRevenue ? totalRevenue / reports.length : null;
  const unpaid = ledger.filter(x=>!x.paid), overdue = unpaid.filter(x=>x.overdue);
  const monthMap = {};
  ledger.forEach(x=>{
    if(!x.dateISO) return;
    const ym = x.dateISO.slice(0,7);
    if(!monthMap[ym]) monthMap[ym] = { ym, total:0, count:0 };
    monthMap[ym].total += x.amount; monthMap[ym].count++;
  });
  const months = Object.values(monthMap).sort((a,b)=> a.ym.localeCompare(b.ym)).slice(-12);
  const catCounts = {};
  reports.forEach(r=> (r.issues||[]).forEach(i=>{ const c = i.category || 'concern'; catCounts[c] = (catCounts[c]||0) + 1; }));
  const totalIssues = Object.values(catCounts).reduce((s,v)=>s+v, 0);
  return { reports, reportsCount: reports.length, totalRevenue, avgPerReport, months, catCounts, totalIssues,
           totalOutstanding: sum(unpaid, x=>x.amount), pendingCount: unpaid.length,
           overdueTotal: sum(overdue, x=>x.amount), overdueCount: overdue.length };
}
function renderAnalytics(){
  const a = computeAnalytics();
  const maxMonth = Math.max(1, ...a.months.map(m=>m.total));
  const monthsHTML = a.months.length >= 2 ? a.months.map(m=>`
    <div class="barchart-row">
      <div class="blabel">${fmtMonthLabel(m.ym)}</div>
      <div class="btrack"><div class="bfill" style="width:${Math.max(2, Math.round(m.total/maxMonth*100))}%; background:var(--accent);"></div></div>
      <div class="bval">${money(m.total)}</div>
    </div>`).join('') : `<div class="empty">Bill at least two months of visits or invoices to see a revenue trend here.</div>`;
  const catEntries = Object.entries(a.catCounts).sort((x,y)=>y[1]-x[1]);
  const catHTML = catEntries.length ? catEntries.map(([cat,count])=>{
    const pct = a.totalIssues ? Math.round(count/a.totalIssues*100) : 0;
    return `
    <div class="barchart-row">
      <div class="blabel">${esc(CATEGORIES[cat]||cat)}</div>
      <div class="btrack"><div class="bfill" style="width:${Math.max(2,pct)}%; background:${CAT_COLOR[cat]||'var(--concern)'};"></div></div>
      <div class="bval">${pct}% <span style="font-weight:500; color:var(--ink-soft);">(${count})</span></div>
    </div>`;
  }).join('') : `<div class="empty">No issues logged yet — category trends appear once you file reports with findings.</div>`;
  const years = yearsFor(a.reports);
  const outTile = a.overdueCount ? 'alert' : (a.totalOutstanding > 0 ? 'warn' : '');
  const invs = loadInvoices();
  const openInv = invs.filter(i=>i.status==='sent').length, draftInv = invs.filter(i=>i.status==='draft').length;

  return `
    <div class="stat-grid">
      <div class="stat-tile"><div class="num">${money(a.totalRevenue)}</div><div class="lbl">Total billed</div></div>
      <div class="stat-tile"><div class="num">${a.reportsCount}</div><div class="lbl">Reports completed</div></div>
      <div class="stat-tile"><div class="num">${money(a.avgPerReport)}</div><div class="lbl">Avg per visit</div></div>
      <div class="stat-tile ${outTile}"><div class="num">${money(a.totalOutstanding)}</div><div class="lbl">Pending payments</div>
        <div class="sub">${a.overdueCount ? `${a.overdueCount} overdue · ${money(a.overdueTotal)}` : `${a.pendingCount} unpaid`}</div></div>
    </div>
    <div class="card">
      <div class="row-between">
        <div><h2 style="margin:0 0 2px;">Invoices</h2><div class="sub" style="font-size:12.5px; color:var(--ink-soft);">${invs.length ? `${openInv} open · ${draftInv} draft · ${invs.length} total` : 'None yet — create one from a client or from Ready to bill.'}</div></div>
        <a class="btn small" href="#invoices">View invoices</a>
      </div>
    </div>
    <div class="card">
      <h2>Year-end summary</h2>
      <p class="hint">A printable recap of your year: revenue by month, collected vs. outstanding, each client's visits and totals, and findings by category. For a grower's own year-end summary, open them from Clients.</p>
      <div class="field-row" style="align-items:flex-end;">
        <div class="field" style="flex:0 0 110px; margin-bottom:0;"><label for="bsYear">Year</label><select id="bsYear">${years.map(y=>`<option ${y===todayISO().slice(0,4)?'selected':''}>${y}</option>`).join('')}</select></div>
        <div style="flex:1;"><button class="btn" id="bsGo" style="width:100%;">Create business summary</button></div>
      </div>
    </div>
    ${teamAnalyticsCard()}
    <div class="card">
      <h2 class="section-title">Billed by month</h2>
      ${monthsHTML}
    </div>
    <div class="card" style="margin-bottom:0;">
      <h2 class="section-title">Findings by category</h2>
      ${catHTML}
    </div>
  `;
}
function wireAnalytics(){
  document.getElementById('bsGo').addEventListener('click', ()=>{ location.hash = '#summary/' + document.getElementById('bsYear').value; });
}

/* ---------- Printable summaries ---------- */
const growerOpts = { billing: false };
function docBanner(title){
  const logo = document.getElementById('brandLogo').src;
  return `<div class="doc-banner"><img src="${logo}" alt=""><div><div class="co">Tavares Crop Consulting</div><div class="ttl">${esc(title)}</div></div></div>`;
}
function docFooter(){
  const p = loadPCA();
  return `<div class="doc-foot"><b>${esc(p.name)}</b>, Licensed PCA #${esc(p.num)}${p.phone ? ' &nbsp;·&nbsp; ' + esc(p.phone) : ''}${p.email ? ' &nbsp;·&nbsp; ' + esc(p.email) : ''}<br>Prepared ${fmtDateLong(todayISO())}. Questions about anything in this summary? Reach out anytime.</div>`;
}
function glance(items){ return `<div class="glance">${items.map(i=>`<div><div class="n">${i[0]}</div><div class="l">${esc(i[1])}</div></div>`).join('')}</div>`; }
function monthStrip(counts){
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `<div class="months">${counts.map((n,i)=>`<div class="${n?'on':''}"><b>${n||'–'}</b>${names[i]}</div>`).join('')}</div>`;
}
function summaryToolbar(backHref, backLabel, years, year, extra){
  return `
    <div class="doc-toolbar no-print">
      <a class="back-link" href="${backHref}" style="margin:0 auto 0 0;">← ${esc(backLabel)}</a>
      <select id="sumYear" aria-label="Year">${years.map(y=>`<option ${y===String(year)?'selected':''}>${y}</option>`).join('')}</select>
      ${extra||''}
      <button class="btn small" id="sumPrint">Print / Save PDF</button>
    </div>`;
}
function renderGrowerSummary(key, year){
  const c = clientByKey(key);
  if(!c) return `<a class="back-link" href="#clients">← Clients</a><div class="card"><div class="empty">Client not found.</div></div>`;
  year = String(year || todayISO().slice(0,4));
  const billingToggle = `<label class="check"><input type="checkbox" id="billToggle" ${growerOpts.billing?'checked':''}> Include billing</label>`;
  let h = summaryToolbar(clientHref(c.key), c.name, yearsFor(c.reports), year, billingToggle);
  h += growerSummaryDoc(c, year, { billing: growerOpts.billing, editable: true });
  h += `<p class="hint no-print" style="margin-top:10px;">Tap <b>Print / Save PDF</b>, then use the Share button on the print screen to text, email or save it as a PDF. Visits logged before September 26 show category and severity only; newer ones include the full finding and plan.</p>`;
  return h;
}
/* The year-end summary document itself. Used on screen, in print, and in the grower portal. */
function growerSummaryDoc(c, year, opts){
  opts = opts || {};
  year = String(year);
  const reports = sortByDateAsc(c.reports.filter(r=>(r.dateISO||'').slice(0,4) === year));
  const issues = []; reports.forEach(r=> (r.issues||[]).forEach(i=> issues.push(Object.assign({ r }, i))));
  const findings = issues.filter(i=> i.severity !== 'None / Good');
  const attention = issues.filter(i=> (SEV_RANK[i.severity]||0) >= 3);
  const fieldNames = [...new Set(reports.map(r=>r.field))];
  const crops = [...new Set(reports.map(r=>r.crop).filter(x=>hasText(x) && !String(x).startsWith('(')))];
  const monthCounts = Array(12).fill(0); reports.forEach(r=>{ monthCounts[parseInt(r.dateISO.slice(5,7),10)-1]++; });

  const byCat = {};
  issues.forEach(i=>{
    const k = i.category || 'concern';
    const b = byCat[k] = byCat[k] || { total:0, findings:0, worst:-1, worstLabel:'' };
    b.total++; if(i.severity !== 'None / Good') b.findings++;
    const rk = SEV_RANK[i.severity]; if(rk != null && rk > b.worst){ b.worst = rk; b.worstLabel = i.severity; }
  });
  const rec = {};
  reports.forEach(r=>{
    new Set((r.issues||[]).filter(i=>i.severity !== 'None / Good').map(i=>i.category)).forEach(cat=>{
      const k = r.field + '||' + cat;
      rec[k] = rec[k] || { field:r.field, cat, visits:0, last:'' };
      rec[k].visits++; rec[k].last = r.dateISO;
    });
  });
  const recurring = Object.values(rec).filter(x=>x.visits >= 2).sort((a,b)=> b.visits - a.visits);
  const yearLedger = ledgerFor(c.key).filter(x=>(x.dateISO||'').slice(0,4) === year);
  const billed = sum(yearLedger, x=>x.amount);
  const outstanding = sum(yearLedger.filter(x=>!x.paid), x=>x.amount);
  const note = loadSummaryNotes()[c.key + '|' + year] || '';
  const pca = loadPCA();

  let h = `<div class="doc">${docBanner(year + ' Year-End Field Summary')}<div class="doc-body">`;
  h += `<table class="doc-meta">
      <tr><td class="k">Prepared for</td><td><b>${esc(c.name)}</b></td></tr>
      ${crops.length ? `<tr><td class="k">Crop${crops.length>1?'s':''}</td><td>${esc(crops.join(', '))}</td></tr>` : ''}
      ${c.county ? `<tr><td class="k">Location</td><td>${esc(c.county)}</td></tr>` : ''}
      <tr><td class="k">Season</td><td>January – December ${year}${reports.length ? ` (visits ${fmtDateShort(reports[0].dateISO)} – ${fmtDateShort(reports[reports.length-1].dateISO)})` : ''}</td></tr>
      <tr><td class="k">Prepared by</td><td>${esc(pca.name)}, PCA #${esc(pca.num)}</td></tr>
    </table>`;

  if(!reports.length){
    h += `<p class="muted" style="margin-top:18px;">No field visits were logged for ${esc(c.name)} in ${year}.</p></div>${docFooter()}</div>`;
    return h;
  }
  const g = [
    [reports.length, 'Field visits'],
    [fieldNames.length, 'Field' + (fieldNames.length===1?'':'s') + ' inspected'],
    [findings.length, 'Findings logged'],
    [attention.length, 'Severe / critical']
  ];
  if(opts.billing){ g.push([money(billed), 'Billed ' + year]); g.push([money(billed - outstanding), 'Paid']); g.push([money(outstanding), 'Balance due']); }
  h += `<h3 style="margin-top:20px;">At a glance</h3>${glance(g)}`;
  h += `<h3>Visits by month</h3>${monthStrip(monthCounts)}`;

  const cats = Object.keys(CATEGORIES).filter(k=>byCat[k]);
  if(cats.length){
    h += `<h3>Findings by category</h3><div class="tbl-wrap"><table class="t"><tr><th>Category</th><th class="num">Items checked</th><th class="num">Findings</th><th>Worst seen</th></tr>`;
    cats.forEach(k=>{ const b = byCat[k];
      h += `<tr><td><span class="swatch" style="background:${CAT_HEX[k]}"></span>${esc(CATEGORIES[k])}</td><td class="num">${b.total}</td><td class="num">${b.findings}</td><td>${b.worstLabel ? `<span class="sev" style="background:${SEV_HEX[b.worstLabel]||'#6B7060'}">${esc(b.worstLabel)}</span>` : '—'}</td></tr>`; });
    h += `</table></div>`;
  }
  if(recurring.length){
    h += `<h3>Recurring issues</h3><ul class="rec-list">${recurring.map(x=>`<li><b>${esc(CATEGORIES[x.cat]||x.cat)}</b> in ${esc(x.field)} — found on ${x.visits} visits (most recently ${fmtDateShort(x.last)})</li>`).join('')}</ul>`;
  }

  h += `<h3>Field-by-field detail</h3>`;
  fieldNames.forEach(fname=>{
    const fr = reports.filter(r=>r.field === fname);
    const outline = c.fields.find(f=> f.field.trim().toLowerCase() === String(fname).trim().toLowerCase());
    h += `<div class="field-block"><h4>${esc(fname)} <span>· ${fr.length} visit${fr.length===1?'':'s'}${outline ? ' · ' + fmtAcres(polygonAcres(outline.points)) : ''}</span></h4>`;
    fr.forEach(r=>{
      h += `<div class="visit"><div class="vd">${fmtDateLong(r.dateISO)}${opts.billing && typeof r.amount==='number' ? ` <span class="muted" style="font-weight:500;">· ${money(r.amount)}</span>` : ''}</div>`;
      if(hasText(r.summary)) h += `<div class="vs">${esc(r.summary)}</div>`;
      const iss = (r.issues||[]).slice().sort((a,b)=> (SEV_RANK[b.severity]||0) - (SEV_RANK[a.severity]||0));
      if(!iss.length) h += `<div class="muted" style="font-size:12.5px;">No issues logged.</div>`;
      else {
        h += `<ul>`;
        iss.forEach(i=>{
          h += `<li><span class="sev" style="background:${SEV_HEX[i.severity]||'#6B7060'}">${esc(i.severity||'—')}</span> <b>${esc(CAT_SHORT[i.category]||'Other')}</b>${hasText(i.problem) ? ' — ' + esc(i.problem) : ''}${hasText(i.location) ? ` <span class="loc">(${esc(i.location)})</span>` : ''}`;
          if(hasText(i.plan)) h += `<div class="plan">Plan: ${esc(i.plan)}</div>`;
          h += `</li>`;
        });
        h += `</ul>`;
      }
      h += `</div>`;
    });
    h += `</div>`;
  });

  if(opts.editable){
    h += `<div class="notes-sec"><h3>Notes &amp; recommendations for next season</h3>
      <div class="doc-note" id="sumNote" contenteditable="true" data-placeholder="Tap to type a personal note for ${esc(c.name)} — it's saved and prints with the summary. Leave blank to leave this section off.">${esc(note)}</div>
      <div class="saved-note no-print" id="sumNoteSaved"></div></div>`;
  } else if(note.trim()){
    h += `<div class="notes-sec"><h3>Notes &amp; recommendations for next season</h3><div class="doc-note" style="border:none; padding:0;">${esc(note)}</div></div>`;
  }
  h += `</div>${docFooter()}</div>`;
  return h;
}
function renderBusinessSummary(year){
  year = String(year || todayISO().slice(0,4));
  const all = loadReports();
  const reports = sortByDateAsc(all.filter(r=>(r.dateISO||'').slice(0,4) === year));
  const led = getLedger().filter(x=>(x.dateISO||'').slice(0,4) === year);
  const billed = sum(led, x=>x.amount);
  const collected = sum(led.filter(x=>x.paid), x=>x.amount);
  const outstanding = sum(led.filter(x=>!x.paid), x=>x.amount);
  const overdueAmt = sum(led.filter(x=>!x.paid && x.overdue), x=>x.amount);
  const months = Array.from({length:12}, ()=>({ n:0, billed:0, paid:0 }));
  reports.forEach(r=>{ months[parseInt(r.dateISO.slice(5,7),10)-1].n++; });
  led.forEach(x=>{ const m = months[parseInt(x.dateISO.slice(5,7),10)-1]; m.billed += x.amount; if(x.paid) m.paid += x.amount; });
  const byClient = {};
  const row = (k, name) => byClient[k] = byClient[k] || { name, visits:0, fields:new Set(), billed:0, outstanding:0 };
  reports.forEach(r=>{ const b = row(clientKeyOf(r.farmer), r.farmer); b.visits++; b.fields.add(r.field); });
  led.forEach(x=>{ const b = row(x.clientKey, x.client); b.billed += x.amount; if(!x.paid) b.outstanding += x.amount; });
  const clientRows = Object.values(byClient).sort((a,b)=> b.billed - a.billed || b.visits - a.visits);
  const catCounts = {}; reports.forEach(r=> (r.issues||[]).forEach(i=>{ const c = i.category||'concern'; catCounts[c] = (catCounts[c]||0)+1; }));
  const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  let h = summaryToolbar('#analytics', 'Analytics', yearsFor(all), year, '');
  h += `<div class="doc">${docBanner(year + ' Business Summary')}<div class="doc-body">`;
  if(!reports.length && !led.length){
    h += `<p class="muted">No reports were logged in ${year}.</p></div>${docFooter()}</div>`;
    return h;
  }
  h += `<h3>At a glance</h3>${glance([
    [money(billed), 'Billed'], [money(collected), 'Collected'], [money(outstanding), 'Outstanding' + (overdueAmt ? ' (' + money(overdueAmt) + ' overdue)' : '')],
    [reports.length, 'Reports'], [clientRows.length, 'Clients served'], [money(reports.length && billed ? billed/reports.length : null), 'Avg per visit'],
    [sum(clientRows, c=>c.fields.size), 'Fields inspected'], [Object.values(catCounts).reduce((s,v)=>s+v,0), 'Items logged']
  ])}`;
  h += `<h3>By month</h3><div class="tbl-wrap"><table class="t"><tr><th>Month</th><th class="num">Reports</th><th class="num">Billed</th><th class="num">Collected</th></tr>`;
  months.forEach((m,i)=>{ h += `<tr><td>${names[i]}</td><td class="num">${m.n||'—'}</td><td class="num">${m.billed?money(m.billed):'—'}</td><td class="num">${m.paid?money(m.paid):'—'}</td></tr>`; });
  h += `<tr class="total"><td>Total</td><td class="num">${reports.length}</td><td class="num">${money(billed)}</td><td class="num">${money(collected)}</td></tr></table></div>`;
  h += `<h3>By client</h3><div class="tbl-wrap"><table class="t"><tr><th>Client</th><th class="num">Visits</th><th class="num">Fields</th><th class="num">Billed</th><th class="num">Outstanding</th></tr>`;
  clientRows.forEach(c=>{ h += `<tr><td>${esc(c.name)}</td><td class="num">${c.visits}</td><td class="num">${c.fields.size}</td><td class="num">${money(c.billed)}</td><td class="num">${c.outstanding?money(c.outstanding):'—'}</td></tr>`; });
  h += `</table></div>`;
  const cats = Object.keys(CATEGORIES).filter(k=>catCounts[k]);
  if(cats.length){
    const tot = cats.reduce((s,k)=>s+catCounts[k],0);
    h += `<h3>Findings by category</h3><div class="tbl-wrap"><table class="t"><tr><th>Category</th><th class="num">Items</th><th class="num">Share</th></tr>`;
    cats.sort((a,b)=>catCounts[b]-catCounts[a]).forEach(k=>{ h += `<tr><td><span class="swatch" style="background:${CAT_HEX[k]}"></span>${esc(CATEGORIES[k])}</td><td class="num">${catCounts[k]}</td><td class="num">${Math.round(catCounts[k]/tot*100)}%</td></tr>`; });
    h += `</table></div>`;
  }
  h += `</div>${docFooter()}</div>`;
  return h;
}
