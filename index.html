function wireClientTeamCard(c){
  const lead = document.getElementById('ctLead'); if(!lead) return;
  const save = () => {
    const scouts = [...document.querySelectorAll('[data-scout]')].filter(x => x.checked).map(x => x.getAttribute('data-scout'));
    if(setClientTeam(c.key, lead.value, scouts)){ toast('Saved'); refresh(); }
  };
  lead.addEventListener('change', save);
  document.querySelectorAll('[data-scout]').forEach(x => x.addEventListener('change', save));
}

/* ---------- Clients list: chips + filter ---------- */
function clientTeamChips(key){
  if(!loadTeam().length) return '';
  const t = clientTeam(key);
  return (t.lead !== OWNER_ID ? ` <span class="chip soft" title="Lead">${esc(firstName(memberName(t.lead)))}</span>` : '')
       + (t.scouts.length ? ` <span class="chip soft" title="Scouts">scout: ${esc(t.scouts.map(id => firstName(memberName(id))).join(', '))}</span>` : '');
}
function clientTeamAttr(key){ const t = clientTeam(key); return [t.lead].concat(t.scouts).join(' '); }
function clientWhoSelectHTML(){
  if(!loadTeam().length || isEmployee()) return '';
  return `<div class="field"><select id="clientWho" aria-label="Filter by team member"><option value="all">Everyone's clients</option><option value="${OWNER_ID}">Mine</option>${employees(false).map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select></div>`;
}
function clientRowMatchesWho(row){
  const w = document.getElementById('clientWho');
  if(!w || w.value === 'all') return true;
  return (' ' + (row.getAttribute('data-team') || '') + ' ').includes(' ' + w.value + ' ');
}

/* ---------- Scheduler: filter ---------- */
function schedVisits(a, b){ return visitsBetween(a, b).filter(v => schedState.who === 'all' || resolveAssignee(v) === schedState.who); }
function schedFilterHTML(){
  if(!loadTeam().length) return '';
  if(isEmployee()) return `<div class="card" style="padding:10px 14px;"><div class="row-between"><label for="schedWho" style="margin:0;">Showing</label><select id="schedWho" style="width:auto;"><option value="all" ${schedState.who==='all'?'selected':''}>All my clients' visits</option><option value="${esc(meId())}" ${schedState.who===meId()?'selected':''}>Just mine</option></select></div></div>`;
  if(schedState.who !== 'all' && !memberById(schedState.who)) schedState.who = 'all';
  return `<div class="card" style="padding:10px 14px;"><div class="row-between"><label for="schedWho" style="margin:0;">Showing</label>
    <select id="schedWho" style="width:auto; max-width:70%;"><option value="all">Everyone</option><option value="${OWNER_ID}" ${schedState.who===OWNER_ID?'selected':''}>Me</option>${employees(false).map(m => `<option value="${esc(m.id)}" ${schedState.who===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div></div>`;
}
function wireSchedFilter(){ const el = document.getElementById('schedWho'); if(el) el.addEventListener('change', () => { schedState.who = el.value; refresh(); }); }

/* ---------- Analytics: team card ---------- */
function teamAnalyticsCard(){
  const emps = employees(false); if(!emps.length) return '';
  const all = [ownerMember()].concat(emps), stats = all.map(m => memberStats(m.id, 'year'));
  const max = Math.max(1, ...stats.map(s => s.visits));
  return `<div class="card">
    <div class="row-between" style="margin-bottom:6px;"><h2 class="section-title" style="margin:0;">Visits by team member · this year</h2><a class="btn small ghost" href="#team">Team</a></div>
    ${all.map((m, i) => `<div class="barchart-row"><div class="blabel">${esc(firstName(m.name))}</div><div class="btrack"><div class="bfill" style="width:${stats[i].visits ? Math.max(3, Math.round(stats[i].visits/max*100)) : 0}%; background:${esc(m.color)};"></div></div><div class="bval">${stats[i].visits} <span style="font-weight:500; color:var(--ink-soft);">(${money(stats[i].billed)})</span></div></div>`).join('')}
  </div>`;
}
</script>
<script>
/* ================= Cloud: shared database (Supabase) =================
   Everything still lives on the phone first, so the app works offline exactly as before.
   When a database is connected and someone is signed in, changes are copied up and other
   people's changes are copied down. The database itself decides who may see what
   (see supabase-setup.sql): employees only ever receive the clients they are assigned to.

   No database configured  ->  nothing here runs and the app behaves as it always has.       */
const CK = { cfg:'pca_cloud_cfg', auth:'pca_cloud_auth', sync:'pca_cloud_sync', profile:'pca_cloud_profile' };
const lsSetRaw = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };

/* What is synced. shape: array of records / map keyed by string / one object.
   split: keys moved into a second, owner-only row (billing, portal keys, private notes).
   owner: never sent to employees. ck: which client a record belongs to (drives access). */
const SYNC_SPECS = [
  { ls:'pca_reports',          shape:'array',  coll:'reports',         id:r=>r.id,               ck:r=>clientKeyOf(r.farmer), split:[{ coll:'report_billing', keys:['amount','paymentStatus'] }] },
  { ls:'pca_manual_clients',   shape:'array',  coll:'clients',         id:m=>clientKeyOf(m.name), ck:m=>clientKeyOf(m.name) },
  { ls:'pca_schedule_appts',   shape:'array',  coll:'appts',           id:a=>a.id,               ck:a=>clientKeyOf(a.client) },
  { ls:'pca_schedule_series',  shape:'array',  coll:'series',          id:s=>s.id,               ck:s=>s.clientKey },
  { ls:'pca_field_boundaries', shape:'array',  coll:'fields',          id:f=>f.id,               ck:f=>f.clientKey },
  { ls:'pca_client_settings',  shape:'map',    coll:'client_settings', ck:k=>k,                  split:[{ coll:'client_portal', keys:['portal'] }] },
  { ls:'pca_team',             shape:'array',  coll:'team',            id:m=>m.id,               split:[{ coll:'team_private', keys:['notes'] }] },
  { ls:'pca_contracts',        shape:'array',  coll:'contracts',       id:k=>k.id,               ck:k=>k.clientKey, owner:true },
  { ls:'pca_invoices',         shape:'array',  coll:'invoices',        id:i=>i.id,               ck:i=>i.clientKey, owner:true },
  { ls:'pca_schedule_todos',   shape:'array',  coll:'todos',           id:t=>t.id,               owner:true },
  { ls:'pca_summary_notes',    shape:'map',    coll:'summary_notes',   owner:true },
  { ls:'pca_business',         shape:'single', coll:'business',        owner:true }
];
const HOLD_DELETES_OVER = 3;   // more removals than this in one sync are held until you confirm
const cloud = { applyDeletes:false, busy:false, again:false, timer:null, poll:null, rawCache:{}, rowCache:{}, rejected:{}, held:null, lastOk:0, error:'', access:true, members:{}, force:false };

/* ---------- state ---------- */
function cloudCfg(){ const c = readJSON(CK.cfg, {}); return c && c.url && c.key ? { url: String(c.url).trim().replace(/\/+$/, ''), key: String(c.key).trim() } : null; }
function cloudAuth(){ return readJSON(CK.auth, null); }
function cloudProfile(){ return readJSON(CK.profile, null); }
function cloudOn(){ return !!cloudCfg(); }
function cloudRole(){ if(!cloudOn()) return 'owner'; const p = cloudProfile(); return p && p.role ? p.role : 'none'; }
function isEmployee(){ return cloudOn() && cloudRole() === 'employee'; }
function meId(){ const p = cloudProfile(); return isEmployee() && p && p.member_id ? p.member_id : OWNER_ID; }
function cloudSpecs(){ return SYNC_SPECS.filter(s => !(isEmployee() && s.owner)); }
function cloudGateActive(){ return cloudOn() && (!cloudAuth() || cloudRole() === 'none' || (isEmployee() && cloud.access === false)); }
function syncState(){ const s = readJSON(CK.sync, null) || {}; s.snap = s.snap || {}; s.backfilled = s.backfilled || {}; return s; }
function saveSyncState(s){ return lsSetRaw(CK.sync, s); }
function canon(v){
  if(Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if(v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function stripKeys(o, keys){ const c = Object.assign({}, o); keys.forEach(k => { delete c[k]; }); return c; }
function mkRow(coll, id, ck, data){ return { coll, id, client_key: ck || null, data, h: hashStr(canon(data) + '|' + (ck || '')) }; }
function unwrap(d){ return d && typeof d === 'object' && Object.keys(d).length === 1 && '_v' in d ? d._v : d; }

/* ---------- talking to Supabase (plain fetch, no library) ---------- */
async function authReq(path, body){
  const c = cloudCfg();
  const res = await fetch(c.url + '/auth/v1/' + path, { method:'POST', headers:{ apikey:c.key, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  const j = await res.json().catch(() => ({}));
  if(!res.ok){ const e = new Error(j.error_description || j.msg || j.message || ('Error ' + res.status)); e.status = res.status; throw e; }
  return j;
}
function saveSession(j){
  if(!j || !j.access_token) return null;
  const a = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user:{ id: j.user && j.user.id, email: j.user && j.user.email } };
  lsSetRaw(CK.auth, a); return a;
}
async function cloudToken(){
  let a = cloudAuth();
  if(!a){ const e = new Error('Not signed in'); e.status = 401; throw e; }
  if(a.expires_at - Date.now() > 60000) return a.access_token;
  try { a = saveSession(await authReq('token?grant_type=refresh_token', { refresh_token: a.refresh_token })) || a; return a.access_token; }
  catch(e){
    if(e.status === 400 || e.status === 401 || e.status === 403){ try { localStorage.removeItem(CK.auth); } catch(x){} setTimeout(() => render(), 0); }
    throw e;
  }
}
async function rest(path, opts){
  opts = opts || {};
  const c = cloudCfg(), tok = await cloudToken();
  const res = await fetch(c.url + '/rest/v1/' + path, Object.assign({}, opts, { headers: Object.assign({ apikey:c.key, Authorization:'Bearer ' + tok, 'Content-Type':'application/json' }, opts.headers) }));
  const text = await res.text();
  if(!res.ok){ let m = ''; try { const j = JSON.parse(text); m = j.message || j.hint || ''; } catch(e){} const e = new Error(m || ('Error ' + res.status)); e.status = res.status; throw e; }
  return text ? JSON.parse(text) : null;
}
async function pullAll(query){
  const out = []; const size = 60;
  for(let off = 0; ; off += size){
    const page = await rest(query + '&limit=' + size + '&offset=' + off);
    out.push.apply(out, page || []);
    if(!page || page.length < size) break;
  }
  return out;
}

/* ---------- turning local data into rows ---------- */
function rowsOfSpec(spec){
  const raw = localStorage.getItem(spec.ls) || '';
  if(cloud.rawCache[spec.ls] === raw && cloud.rowCache[spec.ls]) return cloud.rowCache[spec.ls];
  let val = null; try { val = raw ? JSON.parse(raw) : null; } catch(e){}
  const rows = [];
  const add = (rec, key) => {
    const id = spec.shape === 'array' ? String(spec.id(rec)) : (spec.shape === 'map' ? key : 'main');
    const ck = spec.ck ? (spec.shape === 'map' ? spec.ck(key) : spec.ck(rec)) : null;
    let obj = rec && typeof rec === 'object' && !Array.isArray(rec) ? rec : { _v: rec };
    (spec.split || []).forEach(sp => {
      const part = {}; let has = false;
      sp.keys.forEach(k => { if(obj[k] !== undefined){ part[k] = obj[k]; has = true; } });
      if(has && !isEmployee()) rows.push(mkRow(sp.coll, id, ck, part));
      obj = stripKeys(obj, sp.keys);
    });
    rows.push(mkRow(spec.coll, id, ck, obj));
  };
  if(val){
    if(spec.shape === 'array' && Array.isArray(val)) val.forEach(r => { if(r && typeof r === 'object' && spec.id(r) != null) add(r); });
    else if(spec.shape === 'map' && typeof val === 'object' && !Array.isArray(val)) Object.keys(val).forEach(k => add(val[k], k));
    else if(spec.shape === 'single' && typeof val === 'object' && !Array.isArray(val)) add(val);
  }
  cloud.rawCache[spec.ls] = raw; cloud.rowCache[spec.ls] = rows;
  return rows;
}
function localRowMap(){ const m = {}; cloudSpecs().forEach(sp => rowsOfSpec(sp).forEach(r => { m[r.coll + '/' + r.id] = r; })); return m; }
function snapMeta(coll, data, ck, h){ return { h, ck: ck || null, pb: coll === 'reports' ? ((data && data.performedBy) || '') : undefined }; }

/* ---------- push: local changes -> database ---------- */
function computeChanges(st){
  const now = localRowMap(), up = [], del = [];
  Object.keys(now).forEach(k => { const s = st.snap[k], r = now[k]; if(!s || s.dead || s.h !== r.h) up.push(r); });
  const colls = new Set(); cloudSpecs().forEach(sp => { colls.add(sp.coll); (sp.split || []).forEach(x => colls.add(x.coll)); });
  Object.keys(st.snap).forEach(k => { const s = st.snap[k]; if(s.dead || now[k]) return; if(colls.has(k.split('/')[0])) del.push(k); });
  return { up, del };
}
async function upsertBatch(batch){
  await rest('records?on_conflict=coll,id', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(batch.map(r => r.body)) });
}
async function pushChanges(st){
  const { up, del } = computeChanges(st);
  const rows = [];
  up.forEach(r => {
    const k = r.coll + '/' + r.id, rj = cloud.rejected[k];
    if(rj && rj.h === r.h && !cloud.force) return;
    rows.push({ key:k, h:r.h, body:{ coll:r.coll, id:r.id, client_key:r.client_key, data:r.data, deleted:false }, snap: snapMeta(r.coll, r.data, r.client_key, r.h) });
  });
  // Removals: if lots of records vanished at once (e.g. the phone ran out of space), hold them for confirmation
  const byColl = {}; del.forEach(k => { const c = k.split('/')[0]; (byColl[c] = byColl[c] || []).push(k); });
  cloud.held = null;
  del.forEach(k => {
    const c = k.split('/')[0];
    if(byColl[c].length > HOLD_DELETES_OVER && !cloud.applyDeletes){ (cloud.held = cloud.held || {})[c] = byColl[c]; return; }
    const s = st.snap[k]; if(cloud.rejected[k] && cloud.rejected[k].h === 'dead' && !cloud.force) return;
    rows.push({ key:k, h:'dead', body:{ coll:c, id:k.slice(c.length + 1), client_key:s.ck || null, data: c === 'reports' ? { performedBy: s.pb || '' } : {}, deleted:true }, snap:{ dead:true, ck:s.ck || null } });
  });
  if(!rows.length) return 0;
  const batches = []; let batch = [], size = 0;
  rows.forEach(r => { const n = JSON.stringify(r.body).length; if(batch.length && size + n > 900000){ batches.push(batch); batch = []; size = 0; } batch.push(r); size += n; });
  if(batch.length) batches.push(batch);
  const ok = r => { st.snap[r.key] = r.snap; delete cloud.rejected[r.key]; };
  const bad = (r, e) => { cloud.rejected[r.key] = { h:r.h, msg: e.message || 'rejected' }; };
  const fatal = e => !e.status || e.status === 401;
  for(const b of batches){
    try { await upsertBatch(b); b.forEach(ok); }
    catch(e){
      if(fatal(e)) throw e;
      for(const r of b){ try { await upsertBatch([r]); ok(r); } catch(e2){ if(fatal(e2)) throw e2; bad(r, e2); } }
    }
    saveSyncState(st);
  }
  return rows.length;
}

/* ---------- pull: database -> local ---------- */
function applyRows(rows, st){
  const specs = cloudSpecs(), byColl = {};
  specs.forEach(sp => { byColl[sp.coll] = { spec: sp }; if(!isEmployee()) (sp.split || []).forEach(x => { byColl[x.coll] = { spec: sp, split: x }; }); });
  const mine = localRowMap(), loc = {}, touched = [], dirty = new Set();
  const getLoc = spec => { if(!(spec.ls in loc)) loc[spec.ls] = readJSON(spec.ls, spec.shape === 'array' ? [] : {}); return loc[spec.ls]; };
  const usable = rows.filter(r => byColl[r.coll]);
  const ordered = usable.filter(r => !byColl[r.coll].split).concat(usable.filter(r => byColl[r.coll].split));
  let changed = 0;
  ordered.forEach(row => {
    const meta = byColl[row.coll], spec = meta.spec, k = row.coll + '/' + row.id, data = row.data || {};
    const rh = hashStr(canon(data) + '|' + (row.client_key || ''));
    const s = st.snap[k], m = mine[k];
    if(s && !s.dead && s.h === rh) return;                 // already have exactly this
    if(row.deleted && s && s.dead) return;
    if(s && !s.dead && (!m || m.h !== s.h)) return;       // an unsent local edit or removal wins; it will be pushed
    let arr = getLoc(spec);
    if(meta.split){                                         // billing / portal / notes part
      let rec = spec.shape === 'array' ? arr.find(x => String(spec.id(x)) === row.id) : (spec.shape === 'map' ? arr[row.id] : arr);
      if(!rec || typeof rec !== 'object') return;          // main record not here yet
      if(row.deleted) meta.split.keys.forEach(kk => { delete rec[kk]; }); else Object.assign(rec, data);
    } else if(row.deleted){
      if(spec.shape === 'array') loc[spec.ls] = arr.filter(x => String(spec.id(x)) !== row.id);
      else if(spec.shape === 'map') delete arr[row.id];
      else loc[spec.ls] = {};
    } else {
      const inc = unwrap(data);
      const keep = old => { if(old && typeof old === 'object' && inc && typeof inc === 'object') (spec.split || []).forEach(sp => sp.keys.forEach(kk => { if(old[kk] !== undefined && inc[kk] === undefined) inc[kk] = old[kk]; })); };
      if(spec.shape === 'array'){
        const i = arr.findIndex(x => String(spec.id(x)) === row.id);
        if(i >= 0){ keep(arr[i]); arr[i] = inc; } else arr.unshift(inc);
      } else if(spec.shape === 'map'){ keep(arr[row.id]); arr[row.id] = inc; }
      else loc[spec.ls] = inc;
    }
    dirty.add(spec.ls); touched.push({ k, row, rh }); changed++;
    st.snap[k] = row.deleted ? { dead:true, ck: row.client_key || null } : snapMeta(row.coll, data, row.client_key, rh);
  });
  dirty.forEach(ls => { try { localStorage.setItem(ls, JSON.stringify(loc[ls])); } catch(e){ cloud.error = 'This phone is out of storage space.'; } delete cloud.rawCache[ls]; });
  if(dirty.size){
    clearCache();
    const now = localRowMap();                              // make the snapshot match exactly what is now stored
    touched.forEach(t => { if(!t.row.deleted && now[t.k] && st.snap[t.k] && !st.snap[t.k].dead) st.snap[t.k].h = now[t.k].h; });
  }
  return changed;
}
async function pullChanges(st){
  let q = 'records?select=coll,id,client_key,data,deleted,updated_at&order=updated_at.asc,coll.asc,id.asc';
  if(st.since) q += '&updated_at=gt.' + encodeURIComponent(new Date(new Date(st.since).getTime() - 5000).toISOString());
  const rows = await pullAll(q);
  const changed = applyRows(rows, st);
  rows.forEach(r => { if(!st.since || r.updated_at > st.since) st.since = r.updated_at; });
  return changed;
}

/* ---------- employees: reconcile which clients they can see ---------- */
function purgeClient(key, st){
  // Remove only what came from the shared database. Anything this person created and hasn't sent yet stays
  // (it will be flagged as "not accepted" instead of silently disappearing).
  cloudSpecs().forEach(spec => {
    if(!spec.ck) return;
    let val = readJSON(spec.ls, spec.shape === 'array' ? [] : {});
    if(spec.shape === 'array') val = val.filter(r => !(spec.ck(r) === key && st.snap[spec.coll + '/' + String(spec.id(r))]));
    else if(spec.shape === 'map'){ if(st.snap[spec.coll + '/' + key]) delete val[key]; }
    else return;
    try { localStorage.setItem(spec.ls, JSON.stringify(val)); } catch(e){}
    delete cloud.rawCache[spec.ls];
  });
  Object.keys(st.snap).forEach(k => { if(st.snap[k].ck === key) delete st.snap[k]; });
  delete st.backfilled[key];
  clearCache();
}
async function reconcileEmployee(st, initial){
  const mem = cloudProfile().member_id;
  const own = await rest('records?select=id&coll=eq.team&id=eq.' + encodeURIComponent(mem));
  cloud.access = !!(own && own.length);
  if(!cloud.access) return 0;                  // access turned off: the caller wipes this phone's copy
  const vis = cloud.access ? await pullAll('records?select=id&coll=eq.client_settings&deleted=eq.false&order=id.asc') : [];
  const visible = new Set(vis.map(r => r.id)), seen = new Set();
  cloudSpecs().forEach(spec => { if(spec.ck) rowsOfSpec(spec).forEach(r => { if(r.client_key) seen.add(r.client_key); }); });
  Object.keys(readJSON('pca_client_settings', {})).forEach(k => seen.add(k));
  let purged = 0;
  seen.forEach(k => { if(!visible.has(k)){ purgeClient(k, st); purged++; } });
  Object.keys(st.backfilled).forEach(k => { if(!visible.has(k)) delete st.backfilled[k]; });
  const need = [...visible].filter(k => !st.backfilled[k]);
  if(initial){ need.forEach(k => { st.backfilled[k] = true; }); return purged; }
  const q = k => '"' + k.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
  for(let i = 0; i < need.length; i += 15){
    const chunk = need.slice(i, i + 15);
    const rows = await pullAll('records?select=coll,id,client_key,data,deleted,updated_at&order=updated_at.asc,coll.asc,id.asc&client_key=in.(' + encodeURIComponent(chunk.map(q).join(',')) + ')');
    applyRows(rows, st); chunk.forEach(k => { st.backfilled[k] = true; });
  }
  return purged + need.length;
}

/* ---------- orchestration ---------- */
function setSyncBadge(text, warn){
  const el = document.getElementById('syncBadge'); if(!el) return;
  el.textContent = text; el.classList.toggle('warn', !!warn);
}
function syncBadgeIdle(){
  if(!cloudOn() || !cloudAuth()) return setSyncBadge('');
  const n = Object.keys(cloud.rejected).length, held = cloud.held ? Object.values(cloud.held).reduce((s, l) => s + l.length, 0) : 0;
  if(n || held) return setSyncBadge('⚠ ' + (n + held) + ' change' + (n + held === 1 ? '' : 's') + ' need attention', true);
  if(!navigator.onLine) return setSyncBadge('● Offline — will sync');
  if(cloud.error) return setSyncBadge('⚠ ' + cloud.error, true);
  setSyncBadge(cloud.lastOk ? '✓ Synced ' + new Date(cloud.lastOk).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }) : '');
}
function cloudDirty(){ if(!cloudOn()) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(() => cloudSync(), 2000); }
function typingNow(){ const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
async function cloudSync(manual){
  if(!cloudOn() || !cloudAuth()) return;
  if(!navigator.onLine){ syncBadgeIdle(); return; }
  if(cloud.busy){ cloud.again = true; return; }
  cloud.busy = true; cloud.error = ''; if(manual) cloud.force = true;
  setSyncBadge('⟳ Syncing…');
  let changed = 0;
  try {
    if(!cloudProfile() || cloudRole() === 'none'){ await cloudClaim(); if(cloudRole() === 'none'){ render(); return; } }
    const st = syncState(), initial = !st.since;
    changed += await pullChanges(st);
    if(isEmployee()){
      changed += await reconcileEmployee(st, initial);
      if(cloud.access === false){ wipeSyncedData(); changed++; return; }
    }
    else { try { const ps = await rest('profiles?select=member_id,email,role'); cloud.members = {}; (ps || []).forEach(p => { if(p.member_id) cloud.members[p.member_id] = p.email || true; }); } catch(e){} }
    saveSyncState(st);
    await pushChanges(st);
    saveSyncState(st);
    cloud.lastOk = Date.now();
  } catch(e){
    if(!e.status) cloud.error = ''; else if(e.status !== 401) cloud.error = e.message;
    if(e.status === 401) cloud.error = 'Sign in again';
  } finally {
    cloud.busy = false; cloud.force = false; cloud.applyDeletes = false;
    syncBadgeIdle();
    if(changed && !typingNow() && !cloudGateActive()) refresh(); else if(changed) cloud.refreshLater = true;
    if(cloudGateActive()) render();
    if(cloud.again){ cloud.again = false; cloudDirty(); }
  }
}
async function cloudClaim(){
  const j = await rest('rpc/claim_profile', { method:'POST', body:'{}' });
  lsSetRaw(CK.profile, j && j.role ? j : { role:'none' });
  return j;
}
async function cloudSignIn(email, password, create){
  let j;
  if(create){ j = await authReq('signup', { email, password }); if(!j.access_token) return { needsConfirm:true }; }
  else j = await authReq('token?grant_type=password', { email, password });
  const prev = syncState();
  if(prev.user && j.user && prev.user !== j.user.id){
    if(!confirm('This phone still has data from a different account. Signing in will replace it with this account’s data. Continue?')) return { cancelled:true };
    wipeSyncedData();
  }
  saveSession(j);
  await cloudClaim();
  const st = syncState(); st.user = j.user && j.user.id; saveSyncState(st);
  return { ok:true };
}
function wipeSyncedData(){
  SYNC_SPECS.forEach(s => { try { localStorage.removeItem(s.ls); } catch(e){} });
  try { localStorage.removeItem(CK.sync); } catch(e){}
  cloud.rawCache = {}; cloud.rowCache = {}; cloud.rejected = {}; cloud.held = null; cloud.lastOk = 0; clearCache();
}
async function cloudSignOut(){
  if(isEmployee()){
    if(navigator.onLine){ cloud.force = false; await cloudSync(); }
    const pending = cloudAuth() ? computeChanges(syncState()) : { up:[], del:[] };
    if((pending.up.length || pending.del.length) && !confirm('Some changes on this phone haven’t reached the shared database yet, and signing out removes this phone’s copy. Sign out anyway?')) return;
    wipeSyncedData();
  }
  try { localStorage.removeItem(CK.auth); localStorage.removeItem(CK.profile); } catch(e){}
  cloud.access = true; gateState.create = false; gateState.msg = ''; render();
}
function cloudDisconnect(){
  if(!confirm('Disconnect from the shared database? Everything stays on this phone, but it will stop syncing.')) return;
  [CK.cfg, CK.auth, CK.profile, CK.sync].forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
  cloud.rejected = {}; cloud.held = null; render();
}
function cloudInviteLink(){
  const c = cloudCfg(); if(!c) return '';
  return location.href.split('#')[0].replace(/[?].*$/, '') + '#join/' + b64url(new TextEncoder().encode(JSON.stringify({ u:c.url, k:c.key })));
}
function cloudInit(){
  window.addEventListener('online', () => cloudDirty());
  window.addEventListener('offline', syncBadgeIdle);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) cloudDirty(); });
  window.addEventListener('storage', e => { if(e.key && e.key.startsWith('pca_') && !e.key.startsWith('pca_cloud')){ delete cloud.rawCache[e.key]; cloudDirty(); } });
  document.addEventListener('focusout', () => { if(cloud.refreshLater){ setTimeout(() => { if(!typingNow() && cloud.refreshLater){ cloud.refreshLater = false; refresh(); } }, 400); } });
  clearInterval(cloud.poll); cloud.poll = setInterval(() => { if(!document.hidden) cloudSync(); }, 45000);
  if(cloudOn() && cloudAuth()) setTimeout(() => cloudSync(), 600);
}
window.addEventListener('load', cloudInit);

/* ---------- sign-in screen ---------- */
const gateState = { create:false, msg:'', showConn:false };
function renderCloudGate(){
  const auth = cloudAuth(), c = cloudCfg();
  document.querySelector('.tabbar').style.display = 'none';
  const head = `<div class="card" style="text-align:center; margin-top:8px;"><h2 style="font-size:20px; margin-bottom:4px;">${esc(loadBusiness().name)}</h2>`;
  if(auth && isEmployee() && cloud.access === false){
    return head + `<p class="hint">Your access has been turned off. If that's a mistake, ask the owner to reactivate your profile.</p><button class="btn ghost" id="gtOut">Sign out</button></div>`;
  }
  if(auth){
    return head + `<p class="hint">You're signed in as <b>${esc(auth.user.email || '')}</b>, but this account isn't linked to the company yet.</p>
      <p class="hint">Employees: ask the owner to add <b>this email</b> to your profile in Team, then tap Try again. Owner: this must be the email you put in the database setup.</p>
      <div class="actions-row" style="justify-content:center;"><button class="btn" id="gtRetry">Try again</button><button class="btn ghost" id="gtOut">Sign out</button></div><div class="saved-note" id="gtMsg"></div></div>`;
  }
  return head + `<p class="hint" style="margin-bottom:14px;">${gateState.create ? 'Create your account' : 'Sign in to continue'}</p>
    <div class="field" style="text-align:left;"><label for="gtEmail">Email</label><input type="email" id="gtEmail" autocomplete="username" autocapitalize="off"></div>
    <div class="field" style="text-align:left;"><label for="gtPass">Password</label><input type="password" id="gtPass" autocomplete="${gateState.create ? 'new-password' : 'current-password'}" placeholder="${gateState.create ? 'At least 6 characters' : ''}"></div>
    <button class="btn" id="gtGo" style="width:100%;">${gateState.create ? 'Create account' : 'Sign in'}</button>
    <div class="saved-note" id="gtMsg" style="color:var(--crit);">${esc(gateState.msg)}</div>
    <p class="hint" style="margin:10px 0 0;"><a href="#" id="gtToggle">${gateState.create ? 'I already have an account' : 'First time here? Create an account'}</a></p>
    <details style="margin-top:14px; text-align:left;" ${gateState.showConn ? 'open' : ''}><summary class="hint" style="cursor:pointer;">Connection settings</summary>
      <div class="field" style="margin-top:8px;"><label for="gtUrl">Database URL</label><input type="text" id="gtUrl" value="${esc(c ? c.url : '')}" autocapitalize="off"></div>
      <div class="field"><label for="gtKey">Public key</label><input type="text" id="gtKey" value="${esc(c ? c.key : '')}" autocapitalize="off"></div>
      <div class="actions-row"><button class="btn small ghost" id="gtSaveConn">Save</button><button class="btn small danger" id="gtOffline">Use this phone only</button></div>
    </details></div>`;
}
function wireCloudGate(){
  const $ = id => document.getElementById(id);
  if($('gtOut')) $('gtOut').addEventListener('click', () => cloudSignOut());
  if($('gtRetry')) $('gtRetry').addEventListener('click', async () => { $('gtMsg').textContent = 'Checking…'; try { await cloudClaim(); } catch(e){ $('gtMsg').textContent = e.message; return; } if(cloudRole() === 'none') $('gtMsg').textContent = 'Still not linked.'; else { cloudSync(); render(); } });
  if(!$('gtGo')) return;
  $('gtToggle').addEventListener('click', e => { e.preventDefault(); gateState.create = !gateState.create; gateState.msg = ''; render(); });
  const go = async () => {
    const email = $('gtEmail').value.trim().toLowerCase(), pass = $('gtPass').value;
    if(!email || !pass){ $('gtMsg').textContent = 'Enter your email and password.'; return; }
    $('gtGo').disabled = true; $('gtMsg').style.color = 'var(--ink-soft)'; $('gtMsg').textContent = 'One moment…';
    try {
      const r = await cloudSignIn(email, pass, gateState.create);
      if(r.needsConfirm){ gateState.create = false; gateState.msg = 'Check your email to confirm your account, then sign in here.'; render(); return; }
      if(r.cancelled){ $('gtGo').disabled = false; $('gtMsg').textContent = ''; return; }
      gateState.msg = ''; gateState.create = false; render(); cloudSync();
    } catch(e){
      $('gtGo').disabled = false; $('gtMsg').style.color = 'var(--crit)';
      $('gtMsg').textContent = !e.status ? 'Can’t reach the database — check your signal and the connection settings.' : (/invalid login/i.test(e.message) ? 'That email and password don’t match.' : e.message);
    }
  };
  $('gtGo').addEventListener('click', go);
  $('gtPass').addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  $('gtSaveConn').addEventListener('click', () => { lsSetRaw(CK.cfg, { url: $('gtUrl').value.trim(), key: $('gtKey').value.trim() }); gateState.showConn = true; render(); });
  $('gtOffline').addEventListener('click', () => { if(confirm('Stop using the shared database on this phone?')){ [CK.cfg, CK.auth, CK.profile, CK.sync].forEach(k => localStorage.removeItem(k)); render(); } });
}

/* ---------- Settings card ---------- */
function renderCloudCard(){
  const c = cloudCfg(), a = cloudAuth();
  if(!c || !a){
    return `<div class="card"><h2>Shared database</h2>
      <p class="hint">Lets employees sign in on their own phones and share clients, schedules and reports with you. Follow the setup guide, then paste the two values it gives you.</p>
      <div class="field"><label for="cdUrl">Database URL</label><input type="text" id="cdUrl" value="${esc(c ? c.url : '')}" placeholder="https://xxxx.supabase.co" autocapitalize="off"></div>
      <div class="field"><label for="cdKey">Public key (anon)</label><input type="text" id="cdKey" value="${esc(c ? c.key : '')}" placeholder="eyJ…" autocapitalize="off"></div>
      <div class="actions-row"><button class="btn small" id="cdSave">Save &amp; continue</button></div><div class="saved-note" id="cdMsg"></div></div>`;
  }
  const rej = Object.entries(cloud.rejected), held = cloud.held ? Object.entries(cloud.held) : [];
  return `<div class="card"><h2>Shared database</h2>
    <p class="hint" style="margin:0 0 8px;">Signed in as <b>${esc(a.user.email || '')}</b> · ${esc(cloudRole())}${cloud.lastOk ? ' · last sync ' + new Date(cloud.lastOk).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }) : ''}</p>
    <div class="actions-row">
      <button class="btn small" id="cdSync">Sync now</button>
      ${ isEmployee() ? '' : `<button class="btn small ghost" id="cdInvite">Copy employee invite link</button>` }
      <button class="btn small ghost" id="cdOut">Sign out</button>
      ${ isEmployee() ? '' : `<button class="btn small danger" id="cdOff">Disconnect</button>` }
    </div>
    <div class="saved-note" id="cdMsg">${esc(cloud.error || '')}</div>
    ${ held.length ? `<div class="card alert" style="margin:10px 0 0;"><b>${held.reduce((s, x) => s + x[1].length, 0)} items were removed from this phone.</b>
      <div class="hint" style="margin:4px 0 8px;">Removed: ${held.map(x => esc(x[0]) + ' (' + x[1].length + ')').join(', ')}. This can happen if the phone ran low on space or you restored an old backup. They have not been deleted from the shared database.</div>
      <div class="actions-row"><button class="btn small ghost" id="cdRestore">Bring them back</button><button class="btn small danger" id="cdApply">Delete for everyone</button></div></div>` : '' }
    ${ rej.length ? `<div style="margin-top:10px;"><div class="section-title" style="margin:0 0 4px;">Not accepted by the database (${rej.length})</div>
      ${rej.slice(0, 6).map(([k, v]) => `<div class="hint" style="margin:0 0 3px;">${esc(k)} — ${esc(v.msg)}</div>`).join('')}
      <div class="hint">Usually this means the item belongs to a client you're not assigned to.</div></div>` : '' }
  </div>`;
}
function wireCloudCard(){
  const $ = id => document.getElementById(id);
  if($('cdSave')) $('cdSave').addEventListener('click', () => {
    let url = $('cdUrl').value.trim(); const key = $('cdKey').value.trim();
    if(!/^https:\/\/.+\..+/.test(url) || key.length < 20){ $('cdMsg').textContent = 'Paste the full URL (https://…) and the long public key.'; return; }
    lsSetRaw(CK.cfg, { url, key }); render();
  });
  if($('cdSync')) $('cdSync').addEventListener('click', async () => { $('cdMsg').textContent = 'Syncing…'; await cloudSync(true); refresh(); });
  if($('cdInvite')) $('cdInvite').addEventListener('click', async () => {
    const link = cloudInviteLink();
    try { await navigator.clipboard.writeText(link); $('cdMsg').textContent = 'Copied. Send it to your employee — it connects their phone to the database.'; }
    catch(e){ prompt('Copy this link and send it to your employee:', link); }
  });
  if($('cdOut')) $('cdOut').addEventListener('click', () => cloudSignOut());
  if($('cdOff')) $('cdOff').addEventListener('click', cloudDisconnect);
  if($('cdRestore')) $('cdRestore').addEventListener('click', async () => { const st = syncState(); Object.values(cloud.held || {}).forEach(l => l.forEach(k => { delete st.snap[k]; })); st.since = null; saveSyncState(st); cloud.held = null; await cloudSync(true); refresh(); });
  if($('cdApply')) $('cdApply').addEventListener('click', async () => { if(confirm('Delete these items from the shared database for everyone?')){ cloud.applyDeletes = true; await cloudSync(true); refresh(); } });
}
function renderAccountOnly(){
  return `<a class="back-link" href="#dashboard">← Home</a>${renderCloudCard()}`;
}

/* ---------- employee home screen ---------- */
function renderEmployeeHome(){
  const me = meId(), today = todayISO(), m = memberById(me) || { name:'' };
  const visits = memberVisits(me, today, addDays(today, 14)), due = memberCheckinsDue(me);
  const mine = clientsOf(me), s = memberStats(me, 'month');
  return `
    <div class="card"><h2 style="font-size:19px; margin-bottom:2px;">Hi ${esc(firstName(m.name) || 'there')}</h2>
      <div class="hint" style="margin:0;">${visits.length ? visits.length + ' visit' + (visits.length === 1 ? '' : 's') + ' coming up in the next two weeks.' : 'Nothing scheduled in the next two weeks.'}</div></div>
    <div class="stat-grid">
      <div class="stat-tile"><div class="num">${mine.lead.length + mine.scout.length}</div><div class="lbl">Your clients</div></div>
      <div class="stat-tile"><div class="num">${s.visits}</div><div class="lbl">Visits · last 30 days</div></div>
    </div>
    ${ due.length ? `<div class="card alert"><h2>Check-ins due</h2>${due.map(d => `<div class="list-row"><div class="row-main"><div class="title">${esc(d.series.client)}</div><div class="sub">Was due ${fmtDateDay(d.due)}</div></div><div class="right inline"><a class="btn small rust" href="${logVisitHref(d.series.client)}">Log visit</a></div></div>`).join('')}</div>` : '' }
    <div class="card"><div class="row-between" style="margin-bottom:6px;"><h2 style="margin:0;">Upcoming visits</h2><a class="btn ghost small" href="#scheduler">Schedule</a></div>
      ${ visits.length ? visits.slice(0, 8).map(v => visitRow(v)).join('') : `<div class="empty">Nothing scheduled.</div>` }</div>
    <div class="card" style="margin-bottom:0;"><div class="row-between" style="margin-bottom:6px;"><h2 style="margin:0;">Your clients</h2><a class="btn ghost small" href="#clients">All</a></div>
      ${ mine.lead.concat(mine.scout).slice(0, 8).map(c => `<a class="list-row" href="${clientHref(c.key)}"><div class="row-main"><div class="title">${esc(c.name)}</div><div class="sub">${esc(c.crop || '—')}${c.county ? ' · ' + esc(c.county) : ''} · last visit ${c.lastVisitISO ? fmtDateShort(c.lastVisitISO) : '—'}</div></div></a>`).join('') || `<div class="empty">No clients assigned to you yet.</div>` }</div>`;
}
</script>
