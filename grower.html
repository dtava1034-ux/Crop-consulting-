<style>
/* A grower-facing page with one deliberate light look, matching the printed reports. */
:root {
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F4F3EA; --surface: #FFFFFF; --ink: #232620; --ink-soft: #5B6055; --line: #D9DACB;
  --green: #33442D; --accent: #4B6043; --rust: #B5652D;
  --good: #4B6043; --low: #7E8A3E; --mod: #C79A2E; --sev: #C4622A; --crit: #A8342A; --ink-soft-2: #6B7060;
}
* { box-sizing: border-box; }
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: 'Source Serif 4', Georgia, serif; color: var(--green); margin: 0; text-wrap: balance; }
a { color: var(--rust); }
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 0 14px; }
.top img { width: 96px; height: auto; display: block; flex-shrink: 0; }
.top .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.top h1 { font-size: 23px; line-height: 1.2; margin-top: 2px; }
.contact { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: #fff; border: none; font-family: inherit;
  font-size: 13.5px; font-weight: 600; padding: 9px 15px; border-radius: 20px; text-decoration: none; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: var(--surface); color: var(--green); border: 1px solid var(--line); }
.btn.small { padding: 7px 12px; font-size: 12.5px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; overflow-x: auto; }
.tabs button { flex: 1; border: none; background: none; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft); padding: 9px 4px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: var(--green); color: #fff; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.card h2 { font-size: 16px; margin-bottom: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; cursor: pointer; }
.row:last-child { border-bottom: none; }
.row .t { font-weight: 600; font-size: 14.5px; }
.row .s { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.row .chev { color: var(--ink-soft); font-size: 18px; }
.sev { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; margin: 4px 4px 0 0; }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; color: #fff; white-space: nowrap; }
.chip.paid { background: var(--accent); } .chip.due { background: var(--rust); } .chip.overdue { background: #A8342A; }
.empty { color: var(--ink-soft); font-size: 14px; padding: 8px 0; }
.hint { font-size: 12.5px; color: var(--ink-soft); }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 600; color: var(--green); text-decoration: none; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar select { font-family: inherit; font-size: 15px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.big { font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; color: var(--green); font-variant-numeric: tabular-nums; }
.gmap { height: calc(100vh - 260px); min-height: 380px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #2B2F26; }
.field-label { background: none; border: none; pointer-events: none; }
.field-label > div { transform: translate(-50%, -50%); text-align: center; white-space: nowrap; color: #fff; line-height: 1.2; text-shadow: 0 0 3px #000, 0 0 6px #000; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px; }
.status { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
.status h2 { margin-bottom: 8px; }
.foot { text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-top: 20px; }

/* --- the field report itself (same look as the printed report) --- */
.paper { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rpt-banner { background: #FAFAF1; padding: 18px 24px; border-bottom: 3px solid #33442D; text-align: center; }
.rpt-banner img { max-width: 260px; width: 70%; height: auto; display: block; margin: 0 auto 6px; }
.rpt-banner .co-sub { font-size: 13px; color: #33442D; letter-spacing: .05em; }
.rpt-body { padding: 20px 20px; }
.rpt-info { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 14px; }
.rpt-info td { padding: 6px 10px 6px 0; vertical-align: top; }
.rpt-info td.k { color: #6B7060; width: 70px; font-weight: 600; }
.rpt-summary { background: #F4F5EE; border-left: 3px solid #33442D; padding: 12px 16px; margin-bottom: 20px; font-size: 14.5px; }
.rpt-section { margin-bottom: 22px; }
.rpt-section h3 { font-size: 16.5px; color: #33442D; border-bottom: 2px solid #33442D; padding-bottom: 5px; margin: 0 0 10px; }
.rpt-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.rpt-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: #6B7060; border-bottom: 1px solid #CCCFBE; padding: 6px 6px; }
.rpt-table td { padding: 8px 6px; border-bottom: 1px solid #E7E8DE; vertical-align: top; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 3px; font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; }
.rpt-photos { margin: 4px 0 18px; }
.rpt-photos-label { font-size: 12.5px; color: #6B7060; margin-bottom: 6px; }
.rpt-photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rpt-photo-grid img.rpt-photo { width: 100%; aspect-ratio: 1; height: auto; object-fit: cover; border: 1px solid #CCCFBE; display: block; cursor: zoom-in; }
@media (max-width: 420px) { .rpt-photo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.rpt-footer { border-top: 1px solid #CCCFBE; padding: 16px 24px; font-size: 13px; color: #5B6055; background: #F7F7F1; }
.rpt-footer b { color: #33442D; }
.rpt-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #B5652D; color: #fff; font-size: 11px; font-weight: 700; }
.rpt-map-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; font-size: 13px; }
.map-legend-item { display: flex; align-items: center; gap: 6px; }
.rpt-pin-marker { width: 24px; height: 24px; border-radius: 50%; background: #B5652D; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); color: #fff; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.rpt-mappage { padding: 20px; }
.rpt-mappage-head h3 { font-size: 17px; color: #33442D; border-bottom: 2px solid #33442D; padding-bottom: 6px; margin: 0 0 6px; }
.rpt-map-full { width: 100%; height: 420px; border: 1px solid #CCCFBE; background: #E7E8DE; margin-top: 14px; }
.tbl-scroll { overflow-x: auto; }
.lightbox { position: fixed; inset: 0; background: rgba(10,12,8,.92); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 24px; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* --- season summary and invoices (same look as the printed versions) --- */
.doc { background: #fff; color: #232620; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 13.5px; }
.doc-banner { display: flex; align-items: center; gap: 14px; padding: 18px 20px; background: #FAFAF1; border-bottom: 3px solid #33442D; }
.doc-banner img { width: 72px; height: auto; flex-shrink: 0; }
.doc-banner .co { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 700; color: #33442D; line-height: 1.2; }
.doc-banner .ttl { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: #5B6055; margin-top: 2px; }
.doc-body { padding: 18px 20px 8px; }
.doc h3 { font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; color: #33442D; border-bottom: 2px solid #33442D; padding-bottom: 4px; margin: 22px 0 10px; }
.doc-meta { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
.doc-meta td { padding: 3px 12px 3px 0; vertical-align: top; }
.doc-meta td.k { color: #6B7060; font-weight: 600; width: 104px; white-space: nowrap; }
.glance { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
@media (min-width: 520px) { .glance { grid-template-columns: repeat(4, minmax(0,1fr)); } }
.glance > div { border: 1px solid #D9DACB; border-radius: 6px; padding: 10px 12px; }
.glance .n { font-family: 'Source Serif 4', Georgia, serif; font-size: 21px; color: #33442D; font-variant-numeric: tabular-nums; line-height: 1.15; }
.glance .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: #5B6055; margin-top: 3px; }
.tbl-wrap { overflow-x: auto; }
.doc table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.doc table.t th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: #6B7060; border-bottom: 1px solid #CCCFBE; padding: 6px 8px; white-space: nowrap; }
.doc table.t td { padding: 7px 8px; border-bottom: 1px solid #E7E8DE; vertical-align: top; }
.doc table.t td.num, .doc table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.doc table.t tr.total td { font-weight: 700; border-top: 1px solid #33442D; border-bottom: none; }
.months { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 3px; }
.months div { text-align: center; border-radius: 4px; padding: 5px 0 4px; background: #F2F3EA; font-size: 10px; color: #5B6055; }
.months div b { display: block; font-size: 13px; color: #33442D; }
.months div.on { background: #DDE7D2; }
.field-block { margin-bottom: 16px; }
.field-block h4 { font-size: 14px; margin: 0 0 8px; }
.field-block h4 span { font-weight: 500; color: #6B7060; font-size: 12px; }
.visit { border-left: 3px solid #B5652D; padding: 4px 0 4px 12px; margin-bottom: 10px; }
.visit .vd { font-weight: 700; font-size: 12.5px; color: #33442D; }
.visit .vs { font-style: italic; color: #5B6055; font-size: 12.5px; margin-top: 2px; }
.visit ul { margin: 5px 0 0; padding-left: 0; list-style: none; }
.visit li { margin-bottom: 5px; font-size: 12.5px; }
.visit .plan { color: #5B6055; margin-top: 1px; }
.visit .loc, .muted { color: #6B7060; }
.rec-list { margin: 0; padding-left: 18px; font-size: 12.5px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.doc-note { white-space: pre-wrap; font-size: 13px; }
.doc-foot { padding: 14px 20px; background: #F7F7F1; border-top: 1px solid #D9DACB; font-size: 12px; color: #5B6055; margin-top: 14px; }
.doc-foot b { color: #33442D; }
.inv-num { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; color: #33442D; font-weight: 700; text-align: right; }
.inv-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px 24px; margin-bottom: 16px; font-size: 13px; }
.inv-lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: #6B7060; font-weight: 700; margin-bottom: 3px; }
.inv-meta { width: auto; }
.paid-stamp { display: inline-block; border: 3px solid #4B6043; color: #4B6043; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 4px 12px; border-radius: 6px; transform: rotate(-4deg); margin-bottom: 12px; font-size: 14px; }
.line-note { font-size: 11.5px; color: #6B7060; margin-top: 2px; }
.qty-note { display: none; }
@media (max-width: 520px) { .inv-doc .col-qty, .inv-doc .col-rate { display: none; } .inv-doc .qty-note { display: block; } }
@media print { .inv-doc .col-qty, .inv-doc .col-rate { display: table-cell !important; } .inv-doc .qty-note { display: none !important; } }
.pay-box { background: #F4F5EE; border-left: 3px solid #33442D; padding: 10px 14px; margin-top: 16px; font-size: 13px; }

@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff; }
  body * { visibility: hidden; }
  #printTarget, #printTarget * { visibility: visible; }
  #printTarget { position: absolute; top: 0; left: 0; width: 100%; }
  .paper, .doc { border: none; border-radius: 0; }
  .rpt-mappage { page-break-before: always; break-before: page; }
  .rpt-map-full { height: 8.5in; }
  .leaflet-control-container { display: none !important; }
}
</style>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money2(n){ return '$' + Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function parseISO(iso){ const p = String(iso||'').split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
function fmtDate(iso, fallback){ return iso ? parseISO(iso).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : (fallback||''); }
function fmtDay(iso){ return parseISO(iso).toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}); }
function fmtTime(t){ if(!t) return ''; const p = t.split(':').map(Number); return (((p[0]+11)%12)+1) + ':' + String(p[1]||0).padStart(2,'0') + (p[0]>=12 ? ' PM' : ' AM'); }
function unb64url(str){ str = str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length % 4) str += '='; const bin = atob(str); const out = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i); return out; }
async function load(name){
  const res = await fetch('g/' + state.gid + '/' + name + '?t=' + Date.now(), { cache: 'no-store' });
  if(!res.ok){ const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
  const buf = new Uint8Array(await res.arrayBuffer());
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: buf.slice(0,12) }, state.key, buf.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function withLogo(html){ return String(html||'').split('{{LOGO}}').join(LOGO); }
function status(title, body){ app.innerHTML = `<div class="top"><div></div><img src="${LOGO}" alt="Tavares Crop Consulting"></div><div class="status"><h2>${esc(title)}</h2><p>${body}</p></div>`; }

async function start(){
  let h = location.hash.slice(1);
  try { if(h) localStorage.setItem('tcc_grower_link', h); else h = localStorage.getItem('tcc_grower_link') || ''; } catch(e){}
  const parts = h.split('.');
  if(parts.length !== 2 || !parts[0] || !parts[1]){ status('This link is incomplete', 'Please open the full link you were sent by text or email.'); return; }
  state.gid = parts[0];
  try { state.key = await crypto.subtle.importKey('raw', unb64url(parts[1]), 'AES-GCM', false, ['decrypt']); }
  catch(e){ status('This link is incomplete', 'Please open the full link you were sent by text or email.'); return; }
  try { state.data = await load('index.bin'); }
  catch(e){
    if(e.status === 404) status('This link isn’t active', 'It may have been replaced with a new one. Please reach out for an updated link.');
    else if(!navigator.onLine) status('You’re offline', 'Connect to the internet once to load your reports; after that they’re saved for offline viewing.');
    else status('Couldn’t open your reports', 'The link may be incomplete. Please open the full link you were sent.');
    return;
  }
  const years = Object.keys(state.data.summaries || {}).sort().reverse();
  state.year = years[0] || null;
  document.title = state.data.client.name + ' — Field Reports';
  render();
}

function header(){
  const d = state.data, p = d.pca;
  const tel = String(p.phone||'').replace(/[^\d+]/g,'');
  return `
    <div class="top">
      <div><div class="eyebrow">Field reports for</div><h1>${esc(d.client.name)}</h1></div>
      <img src="${LOGO}" alt="${esc(p.business)}">
    </div>
    <div class="contact">
      ${ tel ? `<a class="btn small" href="tel:${tel}">Call ${esc((p.name||'').split(' ')[0])}</a><a class="btn small ghost" href="sms:${tel}">Text</a>` : '' }
      ${ p.email ? `<a class="btn small ghost" href="mailto:${esc(p.email)}">Email</a>` : '' }
    </div>
    <div class="tabs">
      ${[['reports','Reports'], ['summary','Summary'], ['map','Map'], ['visits','Visits']].concat(d.billing ? [['billing','Billing']] : [])
        .map(t=>`<button class="${state.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}
    </div>`;
}
function footer(){
  const d = state.data;
  return `<div class="foot">${esc(d.pca.business)} · ${esc(d.pca.name)}, Licensed PCA #${esc(d.pca.num)}<br>Updated ${new Date(d.updated).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}. Tip: tap Share → Add to Home Screen to keep this page handy.</div>`;
}
function render(){
  if(state.map){ try { state.map.remove(); } catch(e){} state.map = null; }
  const d = state.data;
  let body = '';
  if(state.tab === 'reports'){
    body = `<div class="card">${ d.reports.length ? d.reports.map(r=>{
      const iss = (r.issues||[]).filter(i=>i.severity !== 'None / Good').sort((a,b)=>(SEV_RANK[b.severity]||0)-(SEV_RANK[a.severity]||0));
      return `<div class="row" data-report="${r.id}">
        <div><div class="t">${esc(r.field)}</div><div class="s">${esc(fmtDate(r.dateISO, r.date))}${r.crop && r.crop[0] !== '(' ? ' · ' + esc(r.crop) : ''} · ${iss.length ? iss.length + ' finding' + (iss.length===1?'':'s') : 'no issues found'}</div>
          <div>${iss.slice(0,3).map(i=>`<span class="sev" style="background:${SEV_HEX[i.severity]||'#6B7060'}">${esc(CAT_SHORT[i.category]||'Other')} · ${esc(i.severity)}</span>`).join('')}</div></div>
        <div class="chev">›</div></div>`; }).join('') : '<div class="empty">No reports yet.</div>' }</div>`;
  }
  if(state.tab === 'summary'){
    const years = Object.keys(d.summaries || {}).sort().reverse();
    body = years.length ? `
      <div class="toolbar"><select id="yearSel">${years.map(y=>`<option ${y===state.year?'selected':''}>${y}</option>`).join('')}</select><button class="btn small" id="printBtn">Save as PDF</button></div>
      <div id="printTarget">${withLogo(d.summaries[state.year])}</div>` : `<div class="card"><div class="empty">Your season summary will appear after the first visit.</div></div>`;
  }
  if(state.tab === 'map'){
    body = `<div id="gmap" class="gmap"></div><p class="hint">${d.fields.length ? 'Your fields are outlined. Dots are spots flagged during visits — tap one for details.' : 'Spots flagged during visits are shown as dots — tap one for details.'}</p>`;
  }
  if(state.tab === 'visits'){
    body = `<div class="card"><h2>Upcoming visits</h2>${ d.visits.length ? d.visits.map(v=>`<div class="row" style="cursor:default;"><div><div class="t">${esc(fmtDay(v.date))}</div><div class="s">${v.time ? esc(fmtTime(v.time)) : 'Time to be confirmed'}${v.note ? ' · ' + esc(v.note) : ''}</div></div></div>`).join('') : '<div class="empty">No visits on the calendar right now.</div>' }</div>`;
  }
  if(state.tab === 'billing' && d.billing){
    const b = d.billing;
    body = `<div class="card"><div class="hint">Balance due</div><div class="big">${money2(b.balance)}</div></div>
      <div class="card"><h2>Invoices</h2>${ b.invoices.length ? b.invoices.map(i=>`<div class="row" data-invoice="${i.id}"><div><div class="t">${esc(i.number)}</div><div class="s">${esc(fmtDate(i.issued))} · ${money2(i.total)}</div></div><span class="chip ${i.status==='paid'?'paid':i.overdue?'overdue':'due'}">${i.status==='paid'?'Paid':i.overdue?'Past due':'Due ' + esc(fmtDate(i.due))}</span></div>`).join('') : '<div class="empty">No invoices yet.</div>' }</div>`;
  }
  app.innerHTML = header() + body + footer();
  app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', ()=>{ state.tab = b.getAttribute('data-tab'); render(); window.scrollTo(0,0); }));
  app.querySelectorAll('[data-report]').forEach(r => r.addEventListener('click', ()=> openReport(parseInt(r.getAttribute('data-report'),10))));
  app.querySelectorAll('[data-invoice]').forEach(r => r.addEventListener('click', ()=> openInvoice(parseInt(r.getAttribute('data-invoice'),10))));
  const ys = document.getElementById('yearSel'); if(ys) ys.addEventListener('change', ()=>{ state.year = ys.value; render(); });
  const pb = document.getElementById('printBtn'); if(pb) pb.addEventListener('click', ()=> window.print());
  if(state.tab === 'map') drawFieldMap();
}
function detailPage(inner){
  app.innerHTML = `<div class="toolbar" style="padding-top:16px;"><button class="back" id="backBtn">← Back</button><button class="btn small" id="printBtn">Save as PDF</button></div>${inner}${footer()}`;
  document.getElementById('backBtn').addEventListener('click', ()=>{ render(); window.scrollTo(0,0); });
  document.getElementById('printBtn').addEventListener('click', ()=> window.print());
  window.scrollTo(0,0);
}
async function openReport(id){
  detailPage(`<div class="status"><h2>Opening report…</h2></div>`);
  try {
    const r = await load('r-' + id + '.bin');
    detailPage(`<div class="paper tbl-scroll" id="printTarget">${r.html}</div>`);
    initReportMap(document.getElementById('printTarget'));
  } catch(e){
    detailPage(`<div class="status"><h2>Couldn’t open this report</h2><p>${navigator.onLine ? 'Please try again in a minute.' : 'You’re offline — reports you’ve opened before are saved, but this one isn’t yet.'}</p></div>`);
  }
}
function openInvoice(id){
  const i = state.data.billing.invoices.find(x=>x.id===id); if(!i) return;
  detailPage(`<div id="printTarget">${withLogo(i.html)}</div>`);
}
function tiles(map){
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, crossOrigin: true, attribution: 'Tiles &copy; Esri' }).addTo(map);
  const roads = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, crossOrigin: true }).addTo(map);
  const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, crossOrigin: true }).addTo(map);
  const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, maxNativeZoom: 19, crossOrigin: true, attribution: '&copy; OpenStreetMap contributors' });
  L.control.layers({ 'Satellite': sat, 'Street map': streets }, {}, { collapsed: true }).addTo(map);
  map.on('baselayerchange', e => {
    if(e.name === 'Satellite'){ if(!map.hasLayer(roads)) roads.addTo(map); if(!map.hasLayer(labels)) labels.addTo(map); }
    else { map.removeLayer(roads); map.removeLayer(labels); }
  });
}
function centroid(points){
  const lat0 = points.reduce((s,p)=>s+p[0],0)/points.length * Math.PI/180, R = 6378137;
  const xy = points.map(p=>[R*p[1]*Math.PI/180*Math.cos(lat0), R*p[0]*Math.PI/180]);
  let a=0, cx=0, cy=0;
  for(let i=0;i<xy.length;i++){ const p=xy[i], q=xy[(i+1)%xy.length], f=p[0]*q[1]-q[0]*p[1]; a+=f; cx+=(p[0]+q[0])*f; cy+=(p[1]+q[1])*f; }
  if(Math.abs(a) < 1e-6) return [points.reduce((s,p)=>s+p[0],0)/points.length, points.reduce((s,p)=>s+p[1],0)/points.length];
  cx/=(3*a); cy/=(3*a); return [cy/R*180/Math.PI, cx/(R*Math.cos(lat0))*180/Math.PI];
}
function drawFieldMap(){
  const el = document.getElementById('gmap');
  if(typeof L === 'undefined'){ el.innerHTML = '<div class="status" style="color:#ddd;">The map needs an internet connection to load.</div>'; return; }
  const map = L.map(el); state.map = map; tiles(map);
  const group = L.featureGroup().addTo(map);
  state.data.fields.forEach(f=>{
    L.polygon(f.points, { color:'#F2C94C', weight:3, fillColor:'#F2C94C', fillOpacity:.15 }).addTo(group).bindPopup(`<b>${esc(f.field)}</b><br>${f.acres ? Math.round(f.acres).toLocaleString('en-US') + ' acres' : ''}`);
    L.marker(centroid(f.points), { icon: L.divIcon({ className:'field-label', html:`<div>${esc(f.field)}</div>`, iconSize:null }), interactive:false, keyboard:false }).addTo(group);
  });
  state.data.reports.forEach(r => (r.issues||[]).forEach(i=>{
    if(!i.pin) return;
    L.circleMarker([i.pin.lat, i.pin.lon], { radius:7, color:'#fff', weight:2, fillColor: CAT_HEX[i.category] || '#9B9C8E', fillOpacity:1 }).addTo(group)
      .bindPopup(`<b>${esc(r.field)}</b> · ${esc(fmtDate(r.dateISO, r.date))}<br>${esc(CAT_SHORT[i.category]||'Other')}${i.problem ? ': ' + esc(i.problem) : ''} <i>(${esc(i.severity)})</i>`);
  }));
  if(group.getLayers().length) map.fitBounds(group.getBounds(), { padding:[24,24], maxZoom:17 });
  else map.setView([37.45, -120.85], 9);
  setTimeout(()=>map.invalidateSize(), 150);
}
function initReportMap(container){
  const dataEl = container.querySelector('#rptMapData'), mapEl = container.querySelector('#rptMap');
  if(!dataEl || !mapEl || typeof L === 'undefined') return;
  let pins; try { pins = JSON.parse(dataEl.textContent); } catch(e){ return; }
  if(!pins || !pins.length) return;
  const map = L.map(mapEl, { scrollWheelZoom:false }); tiles(map);
  const markers = pins.map(p => L.marker([p.lat, p.lon], { icon: L.divIcon({ className:'rpt-pin-icon', html:`<div class="rpt-pin-marker">${p.num}</div>`, iconSize:[24,24], iconAnchor:[12,12] }) }).addTo(map).bindPopup(`<b>Issue ${p.num}</b><br>${esc(p.label)} — ${esc(p.severity)}`));
  if(markers.length === 1) map.setView(markers[0].getLatLng(), 17); else map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
}
document.addEventListener('click', e=>{
  const img = e.target.closest && e.target.closest('#printTarget img.rpt-photo');
  if(!img) return;
  const box = document.createElement('div'); box.className = 'lightbox';
  box.innerHTML = '<img alt="Photo">'; box.querySelector('img').src = img.src;
  box.addEventListener('click', ()=>box.remove()); document.body.appendChild(box);
});
window.addEventListener('hashchange', ()=>{ if(location.hash.length > 1) start(); });
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
start();
</script>
</body>
