<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #EDEEE3; --surface: #FFFFFF; --ink: #232620; --ink-soft: #5B6055;
  --accent: #4B6043; --accent-deep: #33442D; --rust: #B5652D; --line: #CCCFBE;
  --good: #4B6043; --low: #7E8A3E; --mod: #C79A2E; --sev: #C4622A; --crit: #A8342A;
  --pest:#C4622A; --weed:#2A8FB5; --nutrient:#4F8A3D; --irrigation:#D9A426; --vertebrate:#A6488A; --concern:#9B9C8E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1D18; --surface: #24261F; --ink: #EDEEE3; --ink-soft: #A9AD9D;
    --accent: #8FB27C; --accent-deep: #B7D6A6; --rust: #D98A52; --line: #3A3D32;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1D18; --surface: #24261F; --ink: #EDEEE3; --ink-soft: #A9AD9D;
  --accent: #8FB27C; --accent-deep: #B7D6A6; --rust: #D98A52; --line: #3A3D32;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px));
}
h1,h2,h3 { font-family: 'Source Serif 4', Georgia, serif; color: var(--accent-deep); margin: 0; }
a { color: var(--rust); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
}
header.top .top-text h1 { font-size: 22px; }
header.top .top-text p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-soft); }
header.top .top-text a.crosslink { font-size: 12.5px; font-weight: 600; color: var(--rust); text-decoration: none; }
.logo-chip { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; flex-shrink: 0; }
.logo-chip img { width: 34px; height: 34px; display: block; border-radius: 4px; object-fit: cover; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 16px;
}
.card h2 { font-size: 16px; margin-bottom: 10px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.stat-tile .num { font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; color: var(--accent-deep); font-variant-numeric: tabular-nums; }
.stat-tile .lbl { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; text-transform: uppercase; letter-spacing: .03em; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff;
  border: none; font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 10px 16px;
  border-radius: 20px; text-decoration: none; cursor: pointer;
}
.btn.rust { background: var(--rust); }
.btn.ghost { background: transparent; color: var(--accent-deep); border: 1px solid var(--line); }
.btn.small { padding: 7px 12px; font-size: 12.5px; }
.btn.danger { background: transparent; color: var(--crit, #A8342A); border: 1px solid var(--line); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
input[type=text], input[type=number], input[type=date], input[type=time], textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
  font-family: inherit; font-size: 14px; background: var(--bg); color: var(--ink);
}
label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }
.field { margin-bottom: 12px; }
.field-row { display: flex; gap: 10px; }
.field-row > div { flex: 1; }
.list-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
}
.list-row:last-child { border-bottom: none; }
.list-row .title { font-weight: 600; font-size: 14px; }
.list-row .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.list-row .right { text-align: right; flex-shrink: 0; }
.list-row .amt { font-weight: 700; color: var(--accent-deep); font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-soft); font-size: 13.5px; padding: 10px 0; }
.chip { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; color: #fff; margin-right: 4px; }
.chip.paid { background: var(--accent); }
.chip.pending { background: var(--rust); }
.chip-btn { border: none; cursor: pointer; font-family: inherit; }
.stat-tile.warn .num { color: var(--rust); }
.section-title { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; color: var(--accent-deep); margin: 0 0 10px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; height: calc(64px + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--accent-deep); display: flex; z-index: 50;
}
.tabitem {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: #A9B29A; text-decoration: none; font-size: 9px; font-weight: 600; background: none; border: none; cursor: pointer; padding: 0 2px;
}
.tabitem svg { width: 19px; height: 19px; }
.tabitem.active { color: #fff; }
.searchbar { margin-bottom: 14px; }
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px; }
.cal-head { font-size: 9.5px; font-weight: 700; text-transform: uppercase; color: var(--ink-soft); text-align: center; padding-bottom: 4px; }
.cal-cell {
  aspect-ratio: 1; border-radius: 8px; padding: 4px 5px; font-size: 12px; color: var(--ink);
  background: var(--bg); position: relative; border: none; font-family: inherit; text-align: left; cursor: pointer;
}
.cal-cell.muted { color: var(--line); background: transparent; cursor: default; }
.cal-cell.today { background: var(--accent-deep); color: #fff; font-weight: 700; }
.cal-cell.selected { outline: 2px solid var(--rust); }
.cal-dot { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--rust); }
.cal-cell.today .cal-dot { background: #fff; }
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-nav button { background: none; border: none; color: var(--accent-deep); font-size: 18px; cursor: pointer; padding: 4px 10px; }
.todo-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.todo-row:last-child { border-bottom: none; }
.todo-check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); flex-shrink: 0; background: var(--surface); padding: 0; cursor: pointer; }
.todo-check.done { background: var(--accent); border-color: var(--accent); }
.todo-text { flex: 1; text-align: left; font-size: 13.5px; background: none; border: none; padding: 0; color: var(--ink); cursor: pointer; }
.todo-text.done { color: var(--ink-soft); text-decoration: line-through; }
.todo-del { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 16px; padding: 2px 6px; }
.barchart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.barchart-row .blabel { width: 66px; flex-shrink: 0; font-size: 11.5px; color: var(--ink-soft); text-align: right; }
.barchart-row .btrack { flex: 1; background: var(--bg); border-radius: 6px; height: 16px; overflow: hidden; }
.barchart-row .bfill { height: 100%; border-radius: 6px; }
.barchart-row .bval { width: 64px; flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.catlegend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; }
.catlegend .li { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-soft); }
.catlegend .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--accent-deep); text-decoration: none; margin-bottom: 12px; }
[hidden] { display: none !important; }
</style>
</head>

  <button class="tabitem" data-tab="analytics" onclick="location.hash='#analytics'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    Analytics
  </button>
  <button class="tabitem" data-tab="scheduler" onclick="location.hash='#scheduler'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
    Scheduler
  </button>
</nav>

<script>
/* ---------- File names ----------
   These must exactly match the actual filenames of the report-builder file
   in this same GitHub repo/folder. If you rename that file again, update
   the name here (and update its own "PORTAL_FILE" the same way). */
const REPORT_FILE = 'Consult portal 2.1.html';
function reportUrl(query){
  return encodeURIComponent(REPORT_FILE) + (query ? ('?' + query) : '');
}

/* ---------- Data layer (shared localStorage with field-report-builder.html) ---------- */
const CATEGORIES = {pest:'Pest Pressures', weed:'Weed Pressures', nutrient:'Nutrient Findings', irrigation:'Irrigation Findings', vertebrate:'Vertebrate Pressures', concern:'Other Concerning Findings'};
const CAT_COLOR = {pest:'var(--pest)', weed:'var(--weed)', nutrient:'var(--nutrient)', irrigation:'var(--irrigation)', vertebrate:'var(--vertebrate)', concern:'var(--concern)'};
const SEV_COLOR = {'None / Good':'var(--good)','Low':'var(--low)','Moderate':'var(--mod)','Severe':'var(--sev)','Critical':'var(--crit)'};

function loadReports(){ try{ return JSON.parse(localStorage.getItem('pca_reports')||'[]'); }catch(e){ return []; } }
function loadManualClients(){ try{ return JSON.parse(localStorage.getItem('pca_manual_clients')||'[]'); }catch(e){ return []; } }
function saveManualClients(list){ try{ localStorage.setItem('pca_manual_clients', JSON.stringify(list)); }catch(e){} }
function loadAppts(){ try{ return JSON.parse(localStorage.getItem('pca_schedule_appts')||'[]'); }catch(e){ return []; } }
function saveAppts(list){ try{ localStorage.setItem('pca_schedule_appts', JSON.stringify(list)); }catch(e){} }
function loadTodos(){ try{ return JSON.parse(localStorage.getItem('pca_schedule_todos')||'[]'); }catch(e){ return []; } }
function saveTodos(list){ try{ localStorage.setItem('pca_schedule_todos', JSON.stringify(list)); }catch(e){} }

function togglePaymentStatus(id){
  const list = loadReports();
  const r = list.find(x=>x.id===id);
  if(!r) return;
  r.paymentStatus = (r.paymentStatus === 'paid') ? 'pending' : 'paid';
  try{ localStorage.setItem('pca_reports', JSON.stringify(list)); }catch(e){}
  render();
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return n==null ? '—' : '$' + n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0}); }
function clientKeyOf(name){ return (name||'').trim().toLowerCase(); }
function fmtDateShort(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function fmtMonthLabel(ym){
  const d = new Date(ym + '-01T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', year:'numeric'});
}

function computeClients(){
  const reports = loadReports();
  const map = {};
  reports.forEach(r=>{
    const key = clientKeyOf(r.farmer);
    if(!key) return;
    if(!map[key]) map[key] = {key, name:r.farmer, crop:r.crop||'', county:r.county||'', reports:[], manual:false};
    map[key].reports.push(r);
  });
  Object.values(map).forEach(c=>{
    c.reports.sort((a,b)=>{
      const ad = a.dateISO||'', bd = b.dateISO||'';
      if(ad && bd) return bd.localeCompare(ad);
      return (b.id||0) - (a.id||0);
    });
    const latest = c.reports[0];
    if(latest){ c.crop = latest.crop || c.crop; c.county = latest.county || c.county; c.name = latest.farmer || c.name; }
    c.reportCount = c.reports.length;
    const amounts = c.reports.map(r=> typeof r.amount === 'number' ? r.amount : null).filter(v=>v!=null);
    c.totalAmount = amounts.reduce((s,v)=>s+v,0);
    c.avgAmount = amounts.length ? c.totalAmount/amounts.length : null;
    c.lastVisit = latest ? (latest.date || latest.dateISO || '') : '';
    c.lastVisitISO = latest ? (latest.dateISO || '') : '';
    c.outstanding = c.reports.reduce((s,r)=> s + ((typeof r.amount==='number' && r.paymentStatus!=='paid') ? r.amount : 0), 0);
  });
  const manual = loadManualClients();
  manual.forEach(m=>{
    const key = clientKeyOf(m.name);
    if(!key || map[key]) return;
    map[key] = {key, name:m.name, crop:m.crop||'', county:m.county||'', reports:[], manual:true, reportCount:0, totalAmount:0, avgAmount:null, lastVisit:'', lastVisitISO:'', outstanding:0};
  });
  return Object.values(map).sort((a,b)=> a.name.localeCompare(b.name));
}

function computeAnalytics(){
  const reports = loadReports();
  const withAmount = reports.filter(r=> typeof r.amount === 'number');
  const totalRevenue = withAmount.reduce((s,r)=>s+r.amount, 0);
  const avgPerReport = withAmount.length ? totalRevenue/withAmount.length : null;
  const totalOutstanding = withAmount.reduce((s,r)=> s + (r.paymentStatus !== 'paid' ? r.amount : 0), 0);
  const pendingCount = withAmount.filter(r=> r.paymentStatus !== 'paid').length;
  const monthMap = {};
  withAmount.forEach(r=>{
    if(!r.dateISO) return;
    const ym = r.dateISO.slice(0,7);
    if(!monthMap[ym]) monthMap[ym] = {ym, total:0, count:0};
    monthMap[ym].total += r.amount; monthMap[ym].count++;
  });
  const months = Object.values(monthMap).sort((a,b)=> a.ym.localeCompare(b.ym));
  const catCounts = {};
  reports.forEach(r=> (r.issues||[]).forEach(i=>{
    const c = i.category || 'concern';
    catCounts[c] = (catCounts[c]||0) + 1;
  }));
  const totalIssues = Object.values(catCounts).reduce((s,v)=>s+v, 0);
  return { reportsCount: reports.length, totalRevenue, avgPerReport, months, catCounts, totalIssues, totalOutstanding, pendingCount };
}

function reportsThisMonth(){
  const reports = loadReports();
  const now = new Date(); const ym = now.toISOString().slice(0,7);
  return reports.filter(r=> (r.dateISO||'').slice(0,7) === ym);
}

/* ---------- Router ---------- */
function currentRoute(){
  const h = (location.hash || '#dashboard').slice(1);
  const parts = h.split('/');
  return { tab: parts[0] || 'dashboard', arg: parts[1] ? decodeURIComponent(parts[1]) : null };
}
window.addEventListener('hashchange', render);
window.addEventListener('load', ()=>{ if(!location.hash) location.hash = '#dashboard'; render(); });

function setActiveTab(tab){
  document.querySelectorAll('.tabitem').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-tab') === (tab==='client' ? 'clients' : tab));
  });
}

function render(){
  const { tab, arg } = currentRoute();
  const view = document.getElementById('view');
  setActiveTab(tab);
  const fullscreenLink = document.getElementById('openFullscreenLink');
  if(tab === 'dashboard') view.innerHTML = renderDashboard();
  else if(tab === 'report') view.innerHTML = renderReportTab(arg);
  else if(tab === 'clients') { view.innerHTML = renderClients(); wireClients(); }
  else if(tab === 'client') { view.innerHTML = renderClientDetail(arg); }
  else if(tab === 'analytics') view.innerHTML = renderAnalytics();
  else if(tab === 'scheduler') { view.innerHTML = renderScheduler(); wireScheduler(); }
  else view.innerHTML = renderDashboard();
  if(fullscreenLink){
    if(tab === 'report'){ fullscreenLink.hidden = false; fullscreenLink.href = reportUrl(arg); }
    else fullscreenLink.hidden = true;
  }
  window.scrollTo(0,0);
}

/* ---------- New Report (embeds the report builder in-place) ---------- */
function renderReportTab(query){
  return `
    <div class="card" style="padding:0; overflow:hidden;">
      <iframe src="${reportUrl(query)}" title="New Report" style="display:block; width:100%; border:0; height:calc(100vh - 170px); min-height:520px; background:var(--surface);"></iframe>
    </div>
    <p style="text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:-8px;">Saved reports show up automatically on your Dashboard, Clients and Analytics tabs.</p>
  `;
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const clients = computeClients();
  const a = computeAnalytics();
  const monthReports = reportsThisMonth();
  const monthRevenue = monthReports.reduce((s,r)=> s + (typeof r.amount==='number'?r.amount:0), 0);
  const recent = loadReports().slice().sort((x,y)=>(y.id||0)-(x.id||0)).slice(0,5);
  const appts = loadAppts().slice().sort((x,y)=> (x.date+ (x.time||'')).localeCompare(y.date+(y.time||'')));
  const todayISO = new Date().toISOString().slice(0,10);
  const upcoming = appts.filter(ap=> ap.date >= todayISO).slice(0,3);
  const todos = loadTodos().filter(t=>!t.done).slice(0,3);
  const dueReports = loadReports()
    .filter(r=> typeof r.amount === 'number' && r.paymentStatus !== 'paid')
    .sort((x,y)=> (x.dateISO||'').localeCompare(y.dateISO||''))
    .slice(0,6);

  return `
    <div class="stat-grid">
      <div class="stat-tile"><div class="num">${clients.length}</div><div class="lbl">Active clients</div></div>
      <div class="stat-tile"><div class="num">${monthReports.length}</div><div class="lbl">Reports this month</div></div>
      <div class="stat-tile${a.totalOutstanding>0?' warn':''}"><div class="num">${money(a.totalOutstanding)}</div><div class="lbl">Pending payments</div></div>
      <div class="stat-tile"><div class="num">${money(monthRevenue)}</div><div class="lbl">Revenue this month</div></div>
    </div>

    ${ dueReports.length ? `
    <div class="card">
      <div class="row-between" style="margin-bottom:10px;">
        <h2 style="margin:0;">Payments due</h2>
        <a class="btn ghost small" href="#clients">View clients</a>
      </div>
      ${ dueReports.map(r=>`
        <div class="list-row">
          <div>
            <div class="title">${esc(r.farmer)}</div>
            <div class="sub">${esc(r.field)} · ${esc(r.date||'')}</div>
          </div>
          <div class="right">
            <div class="amt">${money(r.amount)}</div>
            <button class="chip-btn chip pending" onclick="togglePaymentStatus(${r.id})">Mark paid</button>
          </div>
        </div>`).join('') }
    </div>` : '' }

    <div class="card">
      <div class="row-between" style="margin-bottom:10px;">
        <h2 style="margin:0;">Recent reports</h2>
        <a class="btn rust small" href="#report">+ New Report</a>
      </div>
      ${ recent.length ? recent.map(r=>`
        <a class="list-row" href="#report/${encodeURIComponent('open='+r.id)}">
          <div>
            <div class="title">${esc(r.farmer)}</div>
            <div class="sub">${esc(r.field)} · ${esc(r.date||'')}</div>
          </div>
          <div class="right">
            <div class="amt">${money(r.amount)}</div>
            ${ typeof r.amount==='number' ? `<span class="chip ${r.paymentStatus==='paid'?'paid':'pending'}">${r.paymentStatus==='paid'?'Paid':'Pending'}</span>` : '' }
          </div>
        </a>`).join('') : `<div class="empty">No reports saved yet. Once you save a report in Field Reports, it will show up here.</div>` }
    </div>

    <div class="card">
      <div class="row-between" style="margin-bottom:10px;">
        <h2 style="margin:0;">Upcoming appointments</h2>
        <a class="btn ghost small" href="#scheduler">View all</a>
      </div>
      ${ upcoming.length ? upcoming.map(ap=>`
        <div class="list-row">
          <div>
            <div class="title">${esc(ap.client)}</div>
            <div class="sub">${esc(ap.note||'')}</div>
          </div>
          <div class="right"><div class="sub">${fmtDateShort(ap.date)}${ap.time? ' · '+ap.time:''}</div></div>
        </div>`).join('') : `<div class="empty">Nothing scheduled yet.</div>` }
    </div>

    <div class="card" style="margin-bottom:0;">
      <div class="row-between" style="margin-bottom:10px;">
        <h2 style="margin:0;">To-do</h2>
        <a class="btn ghost small" href="#scheduler">View all</a>
      </div>
      ${ todos.length ? todos.map(t=>`<div class="list-row"><div class="title">${esc(t.text)}</div></div>`).join('') : `<div class="empty">Nothing on your list.</div>` }
    </div>
  `;
}

/* ---------- Clients ---------- */
function renderClients(){
  const clients = computeClients();
  return `
    <div class="searchbar">
      <input type="text" id="clientSearch" placeholder="Search clients...">
    </div>
    <div class="card">
      <div class="row-between" style="margin-bottom:${document.getElementById('addClientForm')?10:10}px;">
        <h2 style="margin:0;">Clients</h2>
        <button class="btn small" id="toggleAddClient">+ Add Client</button>
      </div>
      <div id="addClientForm" hidden>
        <div class="field"><label>Name</label><input type="text" id="ncName" placeholder="e.g. Alvarez Ranch"></div>
        <div class="field-row">
          <div class="field"><label>Crop</label><input type="text" id="ncCrop" placeholder="e.g. Almonds"></div>
          <div class="field"><label>County / location</label><input type="text" id="ncCounty" placeholder="e.g. Fresno County"></div>
        </div>
        <button class="btn" id="saveNewClient">Save client</button>
      </div>
      <div id="clientList">
        ${ clients.length ? clients.map(clientRowHTML).join('') : `<div class="empty">No clients yet. Log a report or add a client to get started.</div>` }
      </div>
    </div>
  `;
}
function clientRowHTML(c){
  return `
    <a class="list-row" href="#client/${encodeURIComponent(c.key)}" data-name="${esc(c.name).toLowerCase()}">
      <div>
        <div class="title">${esc(c.name)}</div>
        <div class="sub">${esc(c.crop||'—')}${c.county? ' · '+esc(c.county):''} · ${c.reportCount} report${c.reportCount===1?'':'s'}</div>
        ${ c.outstanding>0 ? `<span class="chip pending" style="margin-top:4px;">${money(c.outstanding)} pending</span>` : '' }
      </div>
      <div class="right">
        <div class="amt">${money(c.avgAmount)}</div>
        <div class="sub">avg/visit</div>
      </div>
    </a>`;
}
function wireClients(){
  const search = document.getElementById('clientSearch');
  if(search) search.addEventListener('input', ()=>{
    const q = search.value.trim().toLowerCase();
    document.querySelectorAll('#clientList .list-row').forEach(row=>{
      row.style.display = row.getAttribute('data-name').includes(q) ? '' : 'none';
    });
  });
  const toggle = document.getElementById('toggleAddClient');
  const form = document.getElementById('addClientForm');
  if(toggle) toggle.addEventListener('click', ()=>{ form.hidden = !form.hidden; });
  const save = document.getElementById('saveNewClient');
  if(save) save.addEventListener('click', ()=>{
    const name = document.getElementById('ncName').value.trim();
    if(!name) return;
    const crop = document.getElementById('ncCrop').value.trim();
    const county = document.getElementById('ncCounty').value.trim();
    const list = loadManualClients();
    list.push({name, crop, county});
    saveManualClients(list);
    render();
  });
}

/* ---------- Client detail ---------- */
function renderClientDetail(key){
  const clients = computeClients();
  const c = clients.find(x=>x.key === key);
  if(!c) return `<a class="back-link" href="#clients">← Clients</a><div class="card"><div class="empty">Client not found.</div></div>`;
  const farmerParam = encodeURIComponent(c.name);
  return `
    <a class="back-link" href="#clients">← Clients</a>
    <div class="card">
      <div class="row-between">
        <div>
          <h2 style="font-size:20px;">${esc(c.name)}</h2>
          <div class="sub" style="color:var(--ink-soft); font-size:12.5px; margin-top:2px;">${esc(c.crop||'—')}${c.county? ' · '+esc(c.county):''}</div>
        </div>
        <a class="btn rust small" href="#report/${encodeURIComponent('farmer='+farmerParam)}">Log visit</a>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-tile"><div class="num">${c.reportCount}</div><div class="lbl">Total reports</div></div>
      <div class="stat-tile"><div class="num">${money(c.totalAmount)}</div><div class="lbl">Total revenue</div></div>
      <div class="stat-tile"><div class="num">${c.lastVisit || '—'}</div><div class="lbl">Last visit</div></div>
      <div class="stat-tile${c.outstanding>0?' warn':''}"><div class="num">${money(c.outstanding)}</div><div class="lbl">Outstanding balance</div></div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <h2 style="margin-bottom:10px;">Report history</h2>
      ${ c.reports.length ? c.reports.map(r=>{
        const hasAmt = typeof r.amount === 'number';
        const paid = r.paymentStatus === 'paid';
        return `
        <div class="list-row">
          <a href="#report/${encodeURIComponent('open='+r.id)}" style="text-decoration:none;color:inherit;flex:1;">
            <div class="title">${esc(r.field)}</div>
            <div class="sub">${esc(r.date||'')}${(r.issues&&r.issues.length)? ' · '+r.issues.length+' issue'+(r.issues.length===1?'':'s'):''}</div>
          </a>
          <div class="right">
            <div class="amt">${money(r.amount)}</div>
            ${ hasAmt ? `<button class="chip-btn chip ${paid?'paid':'pending'}" onclick="togglePaymentStatus(${r.id})">${paid?'Paid':'Pending'}</button>` : '' }
          </div>
        </div>`;
      }).join('') : `<div class="empty">No reports logged yet for this client. Use "Log visit" to get started.</div>` }
    </div>
  `;
}

/* ---------- Analytics ---------- */
function renderAnalytics(){
  const a = computeAnalytics();
  const maxMonth = Math.max(1, ...a.months.map(m=>m.total));
  const monthsHTML = a.months.length >= 2 ? a.months.map(m=>`
    <div class="barchart-row">
      <div class="blabel">${fmtMonthLabel(m.ym)}</div>
      <div class="btrack"><div class="bfill" style="width:${Math.round(m.total/maxMonth*100)}%; background:var(--accent);"></div></div>
      <div class="bval">${money(m.total)}</div>
    </div>`).join('') : `<div class="empty">Log billing amounts on at least two months of reports to see a revenue trend here.</div>`;

  const catEntries = Object.entries(a.catCounts).sort((x,y)=>y[1]-x[1]);
  const catHTML = catEntries.length ? catEntries.map(([cat,count])=>{
    const pct = a.totalIssues ? Math.round(count/a.totalIssues*100) : 0;
    return `
    <div class="barchart-row">
      <div class="blabel">${esc(CATEGORIES[cat]||cat)}</div>
      <div class="btrack"><div class="bfill" style="width:${pct}%; background:${CAT_COLOR[cat]||'var(--concern)'};"></div></div>
      <div class="bval">${pct}%</div>
    </div>`;
  }).join('') : `<div class="empty">No issues logged yet — category trends will appear once you file reports with findings.</div>`;

  return `
    <div class="stat-grid">
      <div class="stat-tile"><div class="num">${money(a.totalRevenue)}</div><div class="lbl">Total revenue</div></div>
      <div class="stat-tile"><div class="num">${a.reportsCount}</div><div class="lbl">Reports completed</div></div>
      <div class="stat-tile"><div class="num">${money(a.avgPerReport)}</div><div class="lbl">Avg revenue per report</div></div>
      <div class="stat-tile${a.totalOutstanding>0?' warn':''}"><div class="num">${money(a.totalOutstanding)}</div><div class="lbl">Pending payments${a.pendingCount?' ('+a.pendingCount+')':''}</div></div>
    </div>
    <div class="card">
      <h2 class="section-title">Revenue by month</h2>
      ${monthsHTML}
    </div>
    <div class="card" style="margin-bottom:0;">
      <h2 class="section-title">Findings by category</h2>
      ${catHTML}
    </div>
  `;
}

/* ---------- Scheduler ---------- */
let calState = (()=>{ const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; })();

function renderScheduler(){
  const appts = loadAppts();
  const todos = loadTodos();
  const todayISO = new Date().toISOString().slice(0,10);
  const upcoming = appts.slice().filter(ap=>ap.date >= todayISO).sort((x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||'')));
  const monthLabel = new Date(calState.year, calState.month, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'});

  const first = new Date(calState.year, calState.month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(calState.year, calState.month+1, 0).getDate();
  const prevDays = new Date(calState.year, calState.month, 0).getDate();
  const cells = [];
  for(let i=startWeekday-1;i>=0;i--) cells.push({day: prevDays-i, muted:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({day:d, muted:false});
  while(cells.length % 7 !== 0) cells.push({day: cells.length, muted:true, trailing:true});
  let trailCounter = 1;
  cells.forEach(c=>{ if(c.trailing){ c.day = trailCounter++; } });

  const apptDates = {};
  appts.forEach(ap=>{ apptDates[ap.date] = (apptDates[ap.date]||0)+1; });

  const cellsHTML = cells.map(c=>{
    if(c.muted) return `<div class="cal-cell muted">${c.day}</div>`;
    const iso = `${calState.year}-${String(calState.month+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`;
    const isToday = iso === todayISO;
    const hasAppt = !!apptDates[iso];
    return `<button type="button" class="cal-cell${isToday?' today':''}" data-date="${iso}">${c.day}${hasAppt?'<div class="cal-dot"></div>':''}</button>`;
  }).join('');

  return `
    <div class="card">
      <div class="month-nav">
        <button type="button" id="prevMonth">‹</button>
        <div class="section-title" style="margin:0;">${monthLabel}</div>
        <button type="button" id="nextMonth">›</button>
      </div>
      <div class="calendar">
        <div class="cal-head">S</div><div class="cal-head">M</div><div class="cal-head">T</div><div class="cal-head">W</div><div class="cal-head">T</div><div class="cal-head">F</div><div class="cal-head">S</div>
        ${cellsHTML}
      </div>
    </div>

    <div class="card">
      <div class="row-between" style="margin-bottom:10px;">
        <h2 style="margin:0;">New appointment</h2>
      </div>
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="apDate"></div>
        <div class="field"><label>Time</label><input type="time" id="apTime"></div>
      </div>
      <div class="field"><label>Client</label><input type="text" id="apClient" list="clientNames" placeholder="e.g. Delgado Farms"></div>
      <datalist id="clientNames">${computeClients().map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
      <div class="field"><label>Note (optional)</label><input type="text" id="apNote" placeholder="e.g. pre-harvest walk"></div>
      <button class="btn rust" id="saveAppt">+ Add appointment</button>
    </div>

    <div class="card">
      <h2 class="section-title">Upcoming appointments</h2>
      ${ upcoming.length ? upcoming.map(ap=>`
        <div class="list-row">
          <div>
            <div class="title">${esc(ap.client)}</div>
            <div class="sub">${fmtDateShort(ap.date)}${ap.time?' · '+ap.time:''}${ap.note? ' · '+esc(ap.note):''}</div>
          </div>
          <button class="todo-del" data-del-appt="${ap.id}" aria-label="Delete">✕</button>
        </div>`).join('') : `<div class="empty">Nothing scheduled yet.</div>` }
    </div>

    <div class="card" style="margin-bottom:0;">
      <h2 class="section-title">To-do</h2>
      <div class="field-row" style="margin-bottom:12px;">
        <div class="field" style="margin-bottom:0;"><input type="text" id="newTodoText" placeholder="Add a to-do..."></div>
        <button class="btn small" id="addTodo" style="flex:0 0 auto;">Add</button>
      </div>
      ${ todos.length ? todos.map(t=>`
        <div class="todo-row">
          <button type="button" class="todo-check${t.done?' done':''}" data-toggle-todo="${t.id}"></button>
          <button type="button" class="todo-text${t.done?' done':''}" data-toggle-todo="${t.id}">${esc(t.text)}</button>
          <button class="todo-del" data-del-todo="${t.id}" aria-label="Delete">✕</button>
        </div>`).join('') : `<div class="empty">Nothing on your list.</div>` }
    </div>
  `;
}

function wireScheduler(){
  const prev = document.getElementById('prevMonth');
  const next = document.getElementById('nextMonth');
  if(prev) prev.addEventListener('click', ()=>{
    calState.month--; if(calState.month<0){calState.month=11; calState.year--;}
    document.getElementById('view').innerHTML = renderScheduler(); wireScheduler();
  });
  if(next) next.addEventListener('click', ()=>{
    calState.month++; if(calState.month>11){calState.month=0; calState.year++;}
    document.getElementById('view').innerHTML = renderScheduler(); wireScheduler();
  });
  document.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      document.getElementById('apDate').value = cell.getAttribute('data-date');
      document.getElementById('apDate').scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
  const saveBtn = document.getElementById('saveAppt');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const date = document.getElementById('apDate').value;
    const time = document.getElementById('apTime').value;
    const client = document.getElementById('apClient').value.trim();
    const note = document.getElementById('apNote').value.trim();
    if(!date || !client) { alertInline('Please enter at least a date and client.'); return; }
    const list = loadAppts();
    list.push({ id: Date.now(), date, time, client, note });
    saveAppts(list);
    document.getElementById('view').innerHTML = renderScheduler(); wireScheduler();
  });
  document.querySelectorAll('[data-del-appt]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = parseInt(btn.getAttribute('data-del-appt'),10);
      saveAppts(loadAppts().filter(a=>a.id!==id));
      document.getElementById('view').innerHTML = renderScheduler(); wireScheduler();
    });
  });
  document.querySelectorAll('[data-toggle-todo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = parseInt(btn.getAttribute('data-toggle-todo'),10);
      saveTodos(loadTodos().map(t=> t.id===id ? Object.assign({},t,{done:!t.done}) : t));
      document.getElementById('view').innerHTML = renderScheduler(); wireScheduler();
    });
  });
  document.querySelectorAll('[data-del-todo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = parseInt(btn.getAttribute('data-del-todo'),10);
      saveTodos(loadTodos().filter(t=>t.id!==id));
      document.getElementById('view').innerHTML = renderScheduler(); wireScheduler();
    });
  });
  const addTodoBtn = document.getElementById('addTodo');
  const newTodoInput = document.getElementById('newTodoText');
  function addTodo(){
    const text = newTodoInput.value.trim();
    if(!text) return;
    const list = loadTodos();
    list.push({ id: Date.now(), text, done:false });
    saveTodos(list);
    document.getElementById('view').innerHTML = renderScheduler(); wireScheduler();
  }
  if(addTodoBtn) addTodoBtn.addEventListener('click', addTodo);
  if(newTodoInput) newTodoInput.addEventListener('keydown', e=>{ if(e.key==='Enter') addTodo(); });
}

function alertInline(msg){
  const view = document.getElementById('view');
  const div = document.createElement('div');
  div.className = 'empty';
  div.style.color = 'var(--sev)';
  div.textContent = msg;
  view.prepend(div);
  setTimeout(()=>div.remove(), 3000);
}
</script>
</body>
</html>
